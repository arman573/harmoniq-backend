name: AI Arman customer gateway secret inventory once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-customer-gateway-secret-inventory-once
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  AI_SERVICE: harmoniq-ai-arman-beta0
  RETURNS_SERVICE: harmoniq-returns-api
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RESULT_PATH: docs/ai-arman/CUSTOMER_GATEWAY_SECRET_REFERENCE_INVENTORY_LATEST.md

jobs:
  inventory:
    if: github.event.head_commit.message == 'Inventory customer gateway secret references once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - name: Authenticate read-only Cloud Run inventory
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Inventory selected configuration sources without values
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$AI_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai.json"
          gcloud run services describe "$RETURNS_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/returns.json"

          inspect_env() {
            local file="$1"
            local name="$2"
            jq -r --arg name "$name" '
              [.spec.template.spec.containers[0].env[]? | select(.name == $name)] | first // null |
              if . == null then "missing|-"
              elif .valueFrom.secretKeyRef.name? then "secret_ref|" + .valueFrom.secretKeyRef.name
              elif has("value") then "plain_value|[redacted]"
              else "present_unknown|[redacted]" end
            ' "$file"
          }

          AI_RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // "missing"' "$RUNNER_TEMP/ai.json")"
          RETURNS_RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // "missing"' "$RUNNER_TEMP/returns.json")"

          {
            echo '# AI Arman – customer gateway secret-reference inventory'
            echo
            echo "- Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo '- Inventory mode: **read-only GCP configuration metadata**'
            echo '- Secret/plain values: **not read and not written to this document**'
            echo
            echo '## Runtime identities'
            echo
            echo "- AI Arman runtime: \`$AI_RUNTIME\`"
            echo "- Returns runtime: \`$RETURNS_RUNTIME\`"
            echo
            echo '## AI Arman service selected env sources'
            echo
            for name in VENDRE_API_BASE_URL VENDRE_API_KEY GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN GMAIL_OUTBOUND_EMAIL GMAIL_INBOUND_EMAIL AI_ARMAN_CUSTOMER_SESSION_SECRET; do
              result="$(inspect_env "$RUNNER_TEMP/ai.json" "$name")"
              source="${result%%|*}"
              ref="${result#*|}"
              echo "- \`$name\`: source=\`$source\`, ref=\`$ref\`"
            done
            echo
            echo '## Returns service selected env sources'
            echo
            for name in VENDRE_API_BASE_URL VENDRE_API_KEY GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN GMAIL_OUTBOUND_EMAIL GMAIL_INBOUND_EMAIL; do
              result="$(inspect_env "$RUNNER_TEMP/returns.json" "$name")"
              source="${result%%|*}"
              ref="${result#*|}"
              echo "- \`$name\`: source=\`$source\`, ref=\`$ref\`"
            done
            echo
            echo 'This inventory intentionally records only whether a selected variable is missing, plain/redacted, or backed by a named Secret Manager reference. No secret values are emitted.'
          } > "$RESULT_PATH"

      - name: Commit inventory checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record customer gateway secret reference inventory'
          git push origin HEAD:feature/ai-arman-foundation-v1
