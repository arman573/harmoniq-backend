name: AI Arman internal preview observe push once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-internal-preview-observe-push-once
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  SERVICE_URL: https://harmoniq-ai-arman-beta0-cw6q5ekseq-lz.a.run.app
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  EXPECTED_SOURCE_LABEL: 68ae2e0c
  RESULT_PATH: docs/ai-arman/INTERNAL_PREVIEW_CANDIDATE_LATEST.md

jobs:
  observe:
    if: github.event.head_commit.message == 'Observe internal preview candidate via push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - name: Authenticate deployer for read-only verification
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Wait for candidate and verify boundaries
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=""
          for attempt in {1..40}; do
            CANDIDATE="$(gcloud run revisions list \
              --service "$SERVICE_NAME" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --filter="metadata.labels.release=internal-preview-candidate AND metadata.labels.source-sha=$EXPECTED_SOURCE_LABEL" \
              --sort-by='~metadata.creationTimestamp' \
              --limit=1 \
              --format='value(metadata.name)' || true)"
            if [ -n "$CANDIDATE" ]; then break; fi
            sleep 15
          done
          test -n "$CANDIDATE"

          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run revisions describe "$CANDIDATE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/candidate.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"

          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then exit 1; fi
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service.json")" = "2"
          jq -e '[.status.traffic[]? | select((.percent // 0) > 0) | (.percent // 0)] | sort == [1,99]' "$RUNNER_TEMP/service.json" >/dev/null
          test "$(jq -r --arg rev "$CANDIDATE" '[.status.traffic[]? | select(.revisionName == $rev) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")" = "0"

          env_value() { jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name == $n) | .value // empty' "$RUNNER_TEMP/candidate.json"; }
          test "$(env_value AI_ARMAN_INTERNAL_PREVIEW_DIAGNOSTICS_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_INTERPRETATION_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_DURABLE_AUDIT_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_PROMOTION_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_WIDGET_PREVIEW_ENABLED)" = "false"

          TAG_URL="$(jq -r --arg rev "$CANDIDATE" '.status.traffic[]? | select(.revisionName == $rev and (.tag // "") != "") | .url // empty' "$RUNNER_TEMP/service.json" | head -n1)"
          test -n "$TAG_URL"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Mint canonical-audience ID token
        id: id_token
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_URL }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Test private page and diagnostics
        shell: bash
        env:
          ID_TOKEN: ${{ steps.id_token.outputs.id_token }}
          TAG_URL: ${{ steps.verify.outputs.tag_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          PAGE_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/page.html" --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$TAG_URL/ai-arman/internal-preview")"
          test "$PAGE_CODE" = "200"
          grep -F 'AI Arman – intern testyta' "$RUNNER_TEMP/page.html" >/dev/null

          DIAG_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/diagnostics.json" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"contractVersion\":\"ai-arman-chat-v1\",\"clientMessageId\":\"observer-${GITHUB_RUN_ID}\",\"message\":{\"text\":\"Jag söker ett schampo för torrt hår\"},\"context\":{\"locale\":\"sv-SE\",\"channel\":\"internal_preview\"}}" \
            "$TAG_URL/ai-arman/internal-preview/diagnostics")"
          test "$DIAG_CODE" = "200"
          jq -e '.deterministic.backendAuthority == "backend_policy" and .modelShadow.providerStatus == "completed" and .safety.promotionEnabled == false and .safety.modelAffectsCustomerResponse == false and .safety.writesExecuted == false and .safety.productionActionsEnabled == false and .safety.modelOutputExposed == false and .safety.promptExposed == false' "$RUNNER_TEMP/diagnostics.json" >/dev/null
          if grep -Eqi 'systemPrompt|promptVersion|modelVersion|rawModelText|OPENAI_API_KEY' "$RUNNER_TEMP/diagnostics.json"; then exit 1; fi

          jq -r '.modelShadow.primaryIntent // "null"' "$RUNNER_TEMP/diagnostics.json" > "$RUNNER_TEMP/model-intent.txt"
          jq -r '.deterministic.primaryIntent // "null"' "$RUNNER_TEMP/diagnostics.json" > "$RUNNER_TEMP/backend-intent.txt"
          jq -r '.modelShadow.primaryIntentMatch // "null"' "$RUNNER_TEMP/diagnostics.json" > "$RUNNER_TEMP/intent-match.txt"
          jq -r '.modelShadow.totalTokens // "null"' "$RUNNER_TEMP/diagnostics.json" > "$RUNNER_TEMP/tokens.txt"
          jq -r '.modelShadow.estimatedCostUsd // "null"' "$RUNNER_TEMP/diagnostics.json" > "$RUNNER_TEMP/cost.txt"

      - name: Write safe verification checkpoint
        shell: bash
        env:
          CANDIDATE: ${{ steps.verify.outputs.candidate }}
          TAG_URL: ${{ steps.verify.outputs.tag_url }}
        run: |
          set -euo pipefail
          MODEL_INTENT="$(cat "$RUNNER_TEMP/model-intent.txt")"
          BACKEND_INTENT="$(cat "$RUNNER_TEMP/backend-intent.txt")"
          INTENT_MATCH="$(cat "$RUNNER_TEMP/intent-match.txt")"
          TOKENS="$(cat "$RUNNER_TEMP/tokens.txt")"
          COST="$(cat "$RUNNER_TEMP/cost.txt")"
          cat > "$RESULT_PATH" <<EOF
          # AI Arman – private internal preview candidate latest

          - Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Candidate source label: \`$EXPECTED_SOURCE_LABEL\`
          - Candidate revision: \`$CANDIDATE\`
          - Private tagged preview URL: \`$TAG_URL/ai-arman/internal-preview\`
          - Candidate traffic: **0%**
          - Positive live traffic: **99% / 1%**
          - Service max instances: **2**
          - Public IAM: **absent**
          - Internal diagnostics: **enabled only on candidate**
          - Model interpretation: **ON on candidate**
          - Model shadow: **ON on candidate**
          - Durable audit: **ON on candidate**
          - Model promotion: **OFF**
          - Existing widget preview: **OFF**
          - Writes executed: **false**
          - Production actions: **false**
          - Private page authenticated GET: **PASS**
          - Real diagnostics provider call: **PASS**
          - Synthetic model intent: \`$MODEL_INTENT\`
          - Synthetic backend intent: \`$BACKEND_INTENT\`
          - Synthetic primary-intent match: \`$INTENT_MATCH\`
          - Synthetic provider tokens: \`$TOKENS\`
          - Synthetic estimated cost USD: \`$COST\`

          No raw model text, prompts, secrets, customer PII, production writes, promotion, public IAM, or live traffic change were used by this verification.
          EOF

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_PATH"
          git commit -m 'Record internal preview candidate verification'
          git push origin HEAD:feature/ai-arman-foundation-v1
