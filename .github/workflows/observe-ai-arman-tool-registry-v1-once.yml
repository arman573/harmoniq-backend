name: Observe AI Arman tool registry v1 candidate once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE: harmoniq-ai-arman-beta0
  SOURCE_PREFIX: 25723a25
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  RESULT_PATH: docs/ai-arman/TOOL_REGISTRY_V1_OBSERVE_LATEST.md

jobs:
  observe:
    if: github.event.head_commit.message == 'Observe AI Arman tool registry v1 candidate once'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Wait for zero traffic tool candidate
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          AI_URL=''
          REV=''
          TAG_URL=''
          for attempt in $(seq 1 30); do
            gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
            AI_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/service.json")"
            REV="$(jq -r --arg p "$SERVICE-toolv1-$SOURCE_PREFIX" '.status.traffic[]? | select((.revisionName // "") | startswith($p)) | .revisionName // empty' "$RUNNER_TEMP/service.json" | tail -n1)"
            if [[ -n "$REV" ]]; then
              TAG_URL="$(jq -r --arg r "$REV" '.status.traffic[]? | select(.revisionName==$r and .tag!=null) | .url // empty' "$RUNNER_TEMP/service.json" | head -n1)"
              [[ -n "$TAG_URL" ]] && break
            fi
            sleep 20
          done
          test -n "$AI_URL"
          test -n "$REV"
          test -n "$TAG_URL"
          PERCENT="$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")"
          test "$PERCENT" = '0'
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/service.json" > "$RUNNER_TEMP/positive.json"
          jq -e 'length==2 and ([.[].percent] | sort)==[1,99]' "$RUNNER_TEMP/positive.json" >/dev/null
          echo "ai_url=$AI_URL" >> "$GITHUB_OUTPUT"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        id: idtoken
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.inspect.outputs.ai_url }}
          create_credentials_file: false

      - name: Probe real tracking tool safely
        id: probe
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          TAG_URL: ${{ steps.inspect.outputs.tag_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"caseId":"HQR-2494077","caseType":"support","status":"chat_waiting_admin","orderId":"2494077","messages":[{"direction":"inbound","sender":"Kund","text":"Hej, kan jag få Sändnings-ID ?"}],"adminQuestion":"Kontrollera sändnings-ID och tracking åt mig.","discussion":[]}
          JSON
          START="$(date +%s)"
          HTTP="$(curl -sS --max-time 35 -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/request.json" "$TAG_URL/ai-arman/internal/admin-assistant/assist" || true)"
          ELAPSED="$(( $(date +%s) - START ))"
          OK=false
          TRACKING_OK=false
          VERIFIED=false
          CODE="$(jq -r '.code // empty' "$RUNNER_TEMP/response.json" 2>/dev/null || true)"
          if [[ "$HTTP" == '200' || "$HTTP" == '201' ]]; then
            jq -e '.ok==true and .sendsCustomerMessage==false and .executesWrites==false' "$RUNNER_TEMP/response.json" >/dev/null && OK=true || true
            jq -e '[.toolsUsed[]? | select(.tool=="tracking.read" and .ok==true)] | length==1' "$RUNNER_TEMP/response.json" >/dev/null && TRACKING_OK=true || true
            jq -e '.verifiedFactsAvailable==true' "$RUNNER_TEMP/response.json" >/dev/null && VERIFIED=true || true
          fi
          echo "http=$HTTP" >> "$GITHUB_OUTPUT"
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "tracking_ok=$TRACKING_OK" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Record observation without raw customer or tracking data
        env:
          REV: ${{ steps.inspect.outputs.rev }}
          TAG_URL: ${{ steps.inspect.outputs.tag_url }}
          HTTP: ${{ steps.probe.outputs.http }}
          ELAPSED: ${{ steps.probe.outputs.elapsed }}
          OK: ${{ steps.probe.outputs.ok }}
          TRACKING_OK: ${{ steps.probe.outputs.tracking_ok }}
          VERIFIED: ${{ steps.probe.outputs.verified }}
          CODE: ${{ steps.probe.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          OVERALL=FAIL
          [[ "$OK" == true && "$TRACKING_OK" == true && "$VERIFIED" == true ]] && OVERALL=PASS
          git fetch origin feature/ai-arman-foundation-v1
          git checkout -B result origin/feature/ai-arman-foundation-v1
          cat > "$RESULT_PATH" <<EOF
          # AI Arman Tool Registry v1 observation

          - Observed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Overall: **$OVERALL**
          - Candidate revision: \`$REV\`
          - Candidate URL: \`$TAG_URL\`
          - Candidate traffic: **0%**
          - Production positive traffic: **99/1 unchanged**
          - Real case/order tracking probe HTTP: \`$HTTP\`
          - AI response contract ok: **$OK**
          - tracking.read ok: **$TRACKING_OK**
          - verifiedFactsAvailable: **$VERIFIED**
          - Probe latency: **${ELAPSED}s**
          - Safe error code: \`${CODE:-none}\`
          - Raw parcel/tracking/customer data recorded here: **false**
          - Customer message sending: **false**
          - External writes: **false**
          - GCP mutations by observer: **none**
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman tool registry v1 observation'
          git push origin HEAD:feature/ai-arman-foundation-v1
          test "$OVERALL" = PASS
