name: Deploy compact AI Arman admin companion candidate once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE: harmoniq-ai-arman-beta0
  SOURCE_SHA: d8142459d54a19e033d4ed2092de5dbf2c52f612
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  SECRET_NAME: ai-arman-openai-api-key
  RESULT_PATH: docs/ai-arman/ADMIN_COMPANION_CANDIDATE_LATEST.md

jobs:
  candidate:
    if: github.event.head_commit.message == 'Deploy compact AI Arman admin companion candidate once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Guard frozen source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Re-run full source gate
        run: |
          set -euo pipefail
          npm ci
          npm test -- --runInBand
          npm run build
          docker build -f Dockerfile.ai-arman-candidate -t ai-arman-admin-companion:verify .
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Snapshot live boundary
        id: before
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/before.json"
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/positive-before.json"
          jq -e 'length==2 and ([.[].percent] | sort)==[1,99]' "$RUNNER_TEMP/positive-before.json" >/dev/null
          if jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then exit 1; fi
          SERVICE_URL="$(jq -r '.status.url' "$RUNNER_TEMP/before.json")"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
      - name: Build immutable image
        id: image
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/harmoniq-containers/$SERVICE:admin-companion-${SOURCE_SHA:0:12}-$GITHUB_RUN_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f Dockerfile.ai-arman-candidate -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          echo "image=$REGION-docker.pkg.dev/$PROJECT_ID/harmoniq-containers/$SERVICE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Deploy private zero traffic companion
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          TAG="admincomp-${SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --platform managed \
            --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "ac-${SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}" \
            --tag "$TAG" --no-traffic --port 8080 --cpu 1 --memory 256Mi --concurrency 1 --timeout 30 \
            --set-env-vars "NODE_ENV=production,AI_ARMAN_ADMIN_ASSISTANT_ENABLED=true,AI_ARMAN_ADMIN_LEARNING_ENABLED=false,AI_ARMAN_ADMIN_ASSISTANT_TIMEOUT_MS=15000,AI_ARMAN_ADMIN_REPLY_DRAFT_ENABLED=false,AI_ARMAN_CUSTOMER_WIDGET_ENABLED=false,AI_ARMAN_CUSTOMER_IDENTITY_ENABLED=false,AI_ARMAN_MODEL_INTERPRETATION_ENABLED=true,AI_ARMAN_MODEL_SHADOW_ENABLED=false,AI_ARMAN_MODEL_PROMOTION_ENABLED=false,AI_ARMAN_OPENAI_MODEL=gpt-5-mini,AI_ARMAN_MODEL_INPUT_COST_USD_PER_MILLION_TOKENS=0.25,AI_ARMAN_MODEL_OUTPUT_COST_USD_PER_MILLION_TOKENS=2.0" \
            --set-secrets "OPENAI_API_KEY=$SECRET_NAME:1" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/after.json"
          REV="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          URL="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          test -n "$REV"; test -n "$URL"
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/after.json")" = '0'
          echo "revision=$REV" >> "$GITHUB_OUTPUT"; echo "url=$URL" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        id: idtoken
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.before.outputs.service_url }}
          create_credentials_file: false
      - name: Verify compact UI and synthetic reasoning
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          PAGE_STATUS="$(curl -sS -o "$RUNNER_TEMP/page.html" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" "$URL/ai-arman/internal/admin-assistant")"
          test "$PAGE_STATUS" = '200'
          grep -F 'width:min(410px' "$RUNNER_TEMP/page.html" >/dev/null
          grep -F 'Förstå' "$RUNNER_TEMP/page.html" >/dev/null
          grep -F 'Diskutera' "$RUNNER_TEMP/page.html" >/dev/null
          ! grep -F '.innerHTML' "$RUNNER_TEMP/page.html" >/dev/null
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"caseId":"HQR-SYNTHETIC","caseType":"support","status":"waiting_admin","messages":[{"direction":"inbound","sender":"Kund","text":"Hej, jag saknar spårningslänk. Hur går det med paketet?"}]}
          JSON
          STATUS="$(curl -sS -o "$RUNNER_TEMP/assist.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/request.json" "$URL/ai-arman/internal/admin-assistant/assist")"
          case "$STATUS" in 200|201) ;; *) cat "$RUNNER_TEMP/assist.json" >&2; exit 1 ;; esac
          jq -e '.ok==true and (.caseSummary|type=="string" and length>0) and (.recommendedActions|type=="array") and (.answerToAdmin|type=="string" and length>0) and .sendsCustomerMessage==false and .executesWrites==false' "$RUNNER_TEMP/assist.json" >/dev/null
      - name: Verify production unchanged
        env:
          REV: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/final.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/final.json" > "$RUNNER_TEMP/positive-after.json"
          cmp "$RUNNER_TEMP/positive-before.json" "$RUNNER_TEMP/positive-after.json"
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/final.json")" = '0'
      - name: Record checkpoint
        env:
          REV: ${{ steps.deploy.outputs.revision }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          git fetch origin feature/ai-arman-foundation-v1
          git checkout -B result origin/feature/ai-arman-foundation-v1
          cat > "$RESULT_PATH" <<EOF
          # AI Arman compact admin companion candidate

          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Frozen source: \`$SOURCE_SHA\`
          - Overall: **PASS**
          - Candidate revision: \`$REV\`
          - Candidate URL: \`$URL\`
          - Candidate traffic: **0%**
          - Production 99/1: **unchanged**
          - Private service: **PASS**
          - Compact drawer width: **410 px max**
          - Tabs: **Förstå / Lös / Diskutera**
          - Synthetic case reasoning: **PASS**
          - Customer message sending: **false**
          - External writes: **false**
          - Support learning: **OFF in this candidate**
          - No external module modified by this candidate workflow.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record compact AI Arman admin companion candidate'
          git push origin HEAD:feature/ai-arman-foundation-v1
