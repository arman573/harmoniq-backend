name: Deploy AI Arman tool registry v1 candidate once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE: harmoniq-ai-arman-beta0
  SOURCE_SHA: 25723a256ce06b6af7444ae2367e5f3baa089907
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  OPENAI_SECRET: ai-arman-openai-api-key
  TRACKING_BASE_URL: https://harmoniq-customer-tracking-widget-cw6q5ekseq-lz.a.run.app
  RESULT_PATH: docs/ai-arman/TOOL_REGISTRY_V1_CANDIDATE_LATEST.md

jobs:
  candidate:
    if: github.event.head_commit.message == 'Deploy AI Arman tool registry v1 candidate once'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Guard frozen green source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Re-run exact source gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test -- --runInBand
          npm run build
          docker build -f Dockerfile.ai-arman-candidate -t ai-arman-tool-registry-v1:verify .

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Snapshot protected production boundary
        id: before
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/before.json"
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam-before.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/positive-before.json"
          jq -e 'length==2 and ([.[].percent] | sort)==[1,99]' "$RUNNER_TEMP/positive-before.json" >/dev/null
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/before.json")" = '2'
          if jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/iam-before.json" >/dev/null; then exit 1; fi
          echo "service_url=$(jq -r '.status.url' "$RUNNER_TEMP/before.json")" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/harmoniq-containers/$SERVICE:tool-registry-v1-${SOURCE_SHA:0:12}-$GITHUB_RUN_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f Dockerfile.ai-arman-candidate -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$REGION-docker.pkg.dev/$PROJECT_ID/harmoniq-containers/$SERVICE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy private zero traffic tool candidate
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="toolv1-${SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --platform managed \
            --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "toolv1-${SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}" \
            --tag "$TAG" --no-traffic --port 8080 --cpu 1 --memory 256Mi --concurrency 1 --timeout 30 \
            --set-env-vars "NODE_ENV=production,AI_ARMAN_ADMIN_ASSISTANT_ENABLED=true,AI_ARMAN_ADMIN_LEARNING_ENABLED=false,AI_ARMAN_ADMIN_ASSISTANT_TIMEOUT_MS=20000,AI_ARMAN_ADMIN_REPLY_DRAFT_ENABLED=false,AI_ARMAN_CUSTOMER_WIDGET_ENABLED=false,AI_ARMAN_CUSTOMER_IDENTITY_ENABLED=false,AI_ARMAN_MODEL_INTERPRETATION_ENABLED=true,AI_ARMAN_MODEL_SHADOW_ENABLED=false,AI_ARMAN_MODEL_PROMOTION_ENABLED=false,AI_ARMAN_OPENAI_MODEL=gpt-5-mini,AI_ARMAN_MODEL_INPUT_COST_USD_PER_MILLION_TOKENS=0.25,AI_ARMAN_MODEL_OUTPUT_COST_USD_PER_MILLION_TOKENS=2.0,AI_ARMAN_TRACKING_READ_ENABLED=true,AI_ARMAN_TRACKING_READ_BASE_URL=$TRACKING_BASE_URL,AI_ARMAN_TRACKING_READ_TIMEOUT_MS=5000,AI_ARMAN_VENDRE_ORDER_READ_ENABLED=false" \
            --set-secrets "OPENAI_API_KEY=$OPENAI_SECRET:1" --quiet

          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/after.json"
          REV="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          URL="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          test -n "$REV"; test -n "$URL"
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/after.json")" = '0'
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        id: idtoken
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.before.outputs.service_url }}
          create_credentials_file: false

      - name: Verify real HQR tracking tool read
        id: real
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"caseId":"HQR-2494077","caseType":"support","status":"chat_waiting_admin","orderId":"2494077","messages":[{"direction":"inbound","sender":"Kund","text":"Hej, kan jag få Sändnings-ID ?"}],"adminQuestion":"Kontrollera sändnings-ID och tracking åt mig.","discussion":[]}
          JSON
          START="$(date +%s)"
          STATUS="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/request.json" "$URL/ai-arman/internal/admin-assistant/assist")"
          ELAPSED="$(( $(date +%s) - START ))"
          case "$STATUS" in 200|201) ;; *) jq '{ok,code,mode}' "$RUNNER_TEMP/response.json" >&2 || true; exit 1 ;; esac
          jq -e '.ok==true and (.mode=="analysis" or .mode=="discussion") and .sendsCustomerMessage==false and .executesWrites==false and .verifiedFactsAvailable==true' "$RUNNER_TEMP/response.json" >/dev/null
          jq -e '[.toolsUsed[]? | select(.tool=="tracking.read" and .ok==true)] | length==1' "$RUNNER_TEMP/response.json" >/dev/null
          jq -e '[.toolsUsed[]? | select(.tool=="case.read" and .ok==true)] | length==1' "$RUNNER_TEMP/response.json" >/dev/null
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "tracking_ok=true" >> "$GITHUB_OUTPUT"

      - name: Verify protected production unchanged
        env:
          REV: ${{ steps.deploy.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/final.json"
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam-final.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/final.json" > "$RUNNER_TEMP/positive-after.json"
          cmp "$RUNNER_TEMP/positive-before.json" "$RUNNER_TEMP/positive-after.json"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/final.json")" = '2'
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/final.json")" = '0'
          if jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/iam-final.json" >/dev/null; then exit 1; fi

      - name: Record tool registry v1 candidate checkpoint
        env:
          REV: ${{ steps.deploy.outputs.revision }}
          URL: ${{ steps.deploy.outputs.url }}
          ELAPSED: ${{ steps.real.outputs.elapsed }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/ai-arman-foundation-v1
          git checkout -B result origin/feature/ai-arman-foundation-v1
          cat > "$RESULT_PATH" <<EOF
          # AI Arman Tool Registry v1 candidate

          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Frozen green source: \`$SOURCE_SHA\`
          - Overall: **PASS**
          - Candidate revision: \`$REV\`
          - Candidate URL: \`$URL\`
          - Image digest: \`$DIGEST\`
          - Candidate traffic: **0%**
          - Production 99/1: **unchanged**
          - Service max instances: **2 unchanged**
          - Private IAM: **PASS**
          - Real case tested: \`HQR-2494077\`
          - Real order tested: \`2494077\`
          - case.read: **PASS**
          - tracking.read via existing Vendre+nShift service: **PASS**
          - Verified facts available to model: **true**
          - Real agent latency: **${ELAPSED}s**
          - Direct Vendre order.read: **disabled pending verified secret/base-url wiring**
          - Customer message sending: **false**
          - External writes: **false**
          - Model promotion: **false**
          - Secret values logged: **false**
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman tool registry v1 candidate'
          git push origin HEAD:feature/ai-arman-foundation-v1
