name: Temporary AI Arman model smoke exit-code probe

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-model-exitcode-probe.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  JOB_NAME: ai-arman-model-provider-smoke
  SECRET_NAME: ai-arman-openai-api-key
  IMAGE: europe-north1-docker.pkg.dev/harmoniq-210513/harmoniq-containers/harmoniq-ai-arman-beta0@sha256:5ed92d23fee206b2eb8f453ae91398ae32d243e2b7f3e8c02c8166236b90e674

jobs:
  exit-code-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate through existing WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy isolated job from verified immutable image
        id: deploy_job
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          gcloud run jobs deploy "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args dist/ai-arman/model/model-provider-smoke.js \
            --set-env-vars "AI_ARMAN_MODEL_INTERPRETATION_ENABLED=true,AI_ARMAN_OPENAI_MODEL=gpt-5-mini,AI_ARMAN_MODEL_INTERPRETATION_TIMEOUT_MS=10000,AI_ARMAN_MODEL_INPUT_COST_USD_PER_MILLION_TOKENS=0.25,AI_ARMAN_MODEL_OUTPUT_COST_USD_PER_MILLION_TOKENS=2" \
            --set-secrets "OPENAI_API_KEY=$SECRET_NAME:1" \
            --max-retries 0 \
            --task-timeout 60s \
            --quiet
          echo "EXITCODE_PROBE_JOB_DEPLOY=PASS"

      - name: Execute and poll task result safely
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gcloud run jobs execute "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait \
            --quiet
          EXECUTE_CODE=$?
          set -e

          EXECUTION="$(gcloud run jobs executions list \
            --job "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --limit 1 \
            --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)')"
          test -n "$EXECUTION"
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"
          echo "MODEL_PROVIDER_EXECUTION=$EXECUTION"

          EXIT_CODE=""
          for attempt in $(seq 1 15); do
            set +e
            EXIT_CODE="$(gcloud run jobs executions tasks list \
              --execution "$EXECUTION" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --format='value(lastAttemptResult.exitCode)' 2>/dev/null | head -n 1)"
            TASK_LIST_CODE=$?
            set -e
            if [ "$TASK_LIST_CODE" -eq 0 ] && [ -n "$EXIT_CODE" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$EXIT_CODE" ]; then
            echo "MODEL_PROVIDER_CLASSIFICATION=metadata_not_available"
            echo "classification=metadata_not_available" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          case "$EXIT_CODE" in
            0) CLASSIFICATION="pass" ;;
            41) CLASSIFICATION="authentication" ;;
            42) CLASSIFICATION="quota" ;;
            43) CLASSIFICATION="unavailable" ;;
            44) CLASSIFICATION="invalid_response" ;;
            45) CLASSIFICATION="configuration_disabled" ;;
            46) CLASSIFICATION="unexpected_source" ;;
            49) CLASSIFICATION="unexpected_error" ;;
            *) CLASSIFICATION="unknown_exit_$EXIT_CODE" ;;
          esac

          echo "MODEL_PROVIDER_SAFE_EXIT_CODE=$EXIT_CODE"
          echo "MODEL_PROVIDER_CLASSIFICATION=$CLASSIFICATION"
          echo "classification=$CLASSIFICATION" >> "$GITHUB_OUTPUT"

          if [ "$EXECUTE_CODE" -eq 0 ]; then
            test "$EXIT_CODE" = "0"
            exit 0
          fi
          exit 1

      - name: Delete temporary Cloud Run Job
        if: always() && steps.deploy_job.outputs.attempted == 'true'
        shell: bash
        run: |
          set +e
          gcloud run jobs delete "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet
          CODE=$?
          if [ "$CODE" -eq 0 ]; then
            echo "TEMP_JOB_CLEANUP=PASS"
          else
            echo "TEMP_JOB_CLEANUP=FAILED_OR_JOB_NOT_CREATED"
          fi
          exit 0

      - name: Summary
        if: always()
        shell: bash
        env:
          CLASSIFICATION: ${{ steps.probe.outputs.classification }}
          EXECUTION: ${{ steps.probe.outputs.execution }}
        run: |
          {
            echo "## AI Arman model smoke exit-code probe"
            echo
            echo "- Live service mutation: none"
            echo "- Customer traffic: none"
            echo "- Secret payload printed: no"
            echo "- Immutable image: \`$IMAGE\`"
            echo "- Execution: \`${EXECUTION:-not-started}\`"
            echo "- Safe classification: \`${CLASSIFICATION:-not-classified}\`"
          } >> "$GITHUB_STEP_SUMMARY"
