name: Probe compact AI Arman companion once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  CANONICAL_URL: https://harmoniq-ai-arman-beta0-cw6q5ekseq-lz.a.run.app
  CANDIDATE_URL: https://admincomp-d8142459-1---harmoniq-ai-arman-beta0-cw6q5ekseq-lz.a.run.app
  RESULT_PATH: docs/ai-arman/ADMIN_COMPANION_PROBE_LATEST.md

jobs:
  probe:
    if: github.event.head_commit.message == 'Probe compact AI Arman companion once'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.CANONICAL_URL }}
          create_credentials_file: false
      - name: Probe safe response shape
        id: probe
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"caseId":"HQR-SYNTHETIC","caseType":"support","status":"waiting_admin","messages":[{"direction":"inbound","sender":"Kund","text":"Hej, jag saknar spårningslänk. Hur går det med paketet?"}]}
          JSON
          START="$(date +%s)"
          STATUS="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/request.json" "$CANDIDATE_URL/ai-arman/internal/admin-assistant/assist" || true)"
          END="$(date +%s)"
          ELAPSED="$((END-START))"
          CODE="$(jq -r '.code // empty' "$RUNNER_TEMP/response.json" 2>/dev/null || true)"
          OK="$(jq -r '.ok // false' "$RUNNER_TEMP/response.json" 2>/dev/null || echo false)"
          SUMMARY_TYPE="$(jq -r 'if has("caseSummary") then (.caseSummary|type) else "none" end' "$RUNNER_TEMP/response.json" 2>/dev/null || echo none)"
          SENDS="$(jq -r '.sendsCustomerMessage // "unset"' "$RUNNER_TEMP/response.json" 2>/dev/null || echo unset)"
          WRITES="$(jq -r '.executesWrites // "unset"' "$RUNNER_TEMP/response.json" 2>/dev/null || echo unset)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "code=${CODE:-none}" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "summary_type=$SUMMARY_TYPE" >> "$GITHUB_OUTPUT"
          echo "sends=$SENDS" >> "$GITHUB_OUTPUT"
          echo "writes=$WRITES" >> "$GITHUB_OUTPUT"
      - name: Record safe probe
        env:
          STATUS: ${{ steps.probe.outputs.status }}
          ELAPSED: ${{ steps.probe.outputs.elapsed }}
          CODE: ${{ steps.probe.outputs.code }}
          OK: ${{ steps.probe.outputs.ok }}
          SUMMARY_TYPE: ${{ steps.probe.outputs.summary_type }}
          SENDS: ${{ steps.probe.outputs.sends }}
          WRITES: ${{ steps.probe.outputs.writes }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RESULT_PATH" <<EOF
          # AI Arman compact admin companion probe

          - Checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - HTTP status: \`$STATUS\`
          - Elapsed seconds: \`$ELAPSED\`
          - Safe code: \`$CODE\`
          - ok: \`$OK\`
          - caseSummary type: \`$SUMMARY_TYPE\`
          - sendsCustomerMessage: \`$SENDS\`
          - executesWrites: \`$WRITES\`
          - AI text and prompt content: **not recorded**
          - No Cloud Run or external module mutation performed.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record compact AI Arman companion probe'
          git push origin HEAD:feature/ai-arman-foundation-v1
