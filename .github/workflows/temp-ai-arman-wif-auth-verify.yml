name: TEMP AI Arman WIF auth verify

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/temp-ai-arman-wif-auth-verify.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: temp-ai-arman-wif-auth-verify
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq

jobs:
  verify-provider:
    name: Verify backend branch is accepted by WIF provider
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "arman573/harmoniq-backend"
          test "$GITHUB_REF" = "refs/heads/feature/ai-arman-foundation-v1"
          test "$GITHUB_ACTOR" = "arman573"

      - name: Direct WIF authentication
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ''
          create_credentials_file: false
          export_environment_variables: false

      - name: Confirm read-only verification
        shell: bash
        run: |
          set -euo pipefail
          echo "providerAuth=success"
          echo "mutationsPerformed=false"
          echo "cloudRunChanged=false"
          echo "trafficChanged=false"
