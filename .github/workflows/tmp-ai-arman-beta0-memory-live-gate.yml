name: Temporary AI Arman beta0 256Mi live gate

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-beta0-memory-live-gate.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  SERVICE_NAME: harmoniq-ai-arman-beta0

jobs:
  guarded-memory-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate through existing WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify exact 512Mi private baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n 1)"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

          gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > "$RUNNER_TEMP/before-service.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > "$RUNNER_TEMP/before-iam.json"

          URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/before-service.json")"
          REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$RUNNER_TEMP/before-service.json")"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image // empty' "$RUNNER_TEMP/before-service.json")"
          MEMORY="$(jq -r '.spec.template.spec.containers[0].resources.limits.memory // empty' "$RUNNER_TEMP/before-service.json")"
          CPU="$(jq -r '.spec.template.spec.containers[0].resources.limits.cpu // empty' "$RUNNER_TEMP/before-service.json")"
          RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/before-service.json")"
          STARTUP_PATH="$(jq -r '.spec.template.spec.containers[0].startupProbe.httpGet.path // empty' "$RUNNER_TEMP/before-service.json")"
          STARTUP_PORT="$(jq -r '.spec.template.spec.containers[0].startupProbe.httpGet.port // empty' "$RUNNER_TEMP/before-service.json")"
          CONCURRENCY="$(jq -r '.spec.template.spec.containerConcurrency // empty' "$RUNNER_TEMP/before-service.json")"
          TIMEOUT="$(jq -r '.spec.template.spec.timeoutSeconds // empty' "$RUNNER_TEMP/before-service.json")"
          CPU_THROTTLING="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/cpu-throttling"] // empty' "$RUNNER_TEMP/before-service.json")"
          CPU_BOOST="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/startup-cpu-boost"] // empty' "$RUNNER_TEMP/before-service.json")"
          SERVICE_MIN="$(jq -r '.metadata.annotations["run.googleapis.com/minScale"] // "0"' "$RUNNER_TEMP/before-service.json")"
          SERVICE_MAX="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/before-service.json")"

          test -n "$URL"
          test -n "$REVISION"
          test -n "$IMAGE"
          test "$MEMORY" = "512Mi"
          test "$CPU" = "1"
          test "$RUNTIME" = "$RUNTIME_SERVICE_ACCOUNT"
          test "$STARTUP_PATH" = "/ai-arman/foundation"
          test "$STARTUP_PORT" = "8080"
          test "$CONCURRENCY" = "20"
          test "$TIMEOUT" = "30"
          test "$CPU_THROTTLING" = "true"
          test "$CPU_BOOST" = "false"
          test "$SERVICE_MIN" = "0"
          test "$SERVICE_MAX" = "1"

          for flag in \
            AI_ARMAN_WIDGET_PREVIEW_ENABLED \
            AI_ARMAN_MODEL_INTERPRETATION_ENABLED \
            AI_ARMAN_MODEL_SHADOW_ENABLED \
            AI_ARMAN_MODEL_PROMOTION_ENABLED; do
            VALUE="$(jq -r --arg flag "$flag" '.spec.template.spec.containers[0].env[]? | select(.name == $flag) | .value' "$RUNNER_TEMP/before-service.json")"
            test "$VALUE" = "false"
          done

          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$RUNNER_TEMP/before-iam.json" >/dev/null; then
            echo "Baseline service is public; refusing mutation." >&2
            exit 1
          fi

          echo "BASELINE_PRIVATE_IAM=PASS"
          echo "BASELINE_MEMORY=512Mi"
          echo "BASELINE_REVISION=$REVISION"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Change only memory to 256Mi
        id: mutate
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"

          if ! gcloud run services update "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --memory 256Mi \
            --quiet; then
            echo "256Mi update command failed; restoring 512Mi defensively." >&2
            gcloud run services update "$SERVICE_NAME" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --memory 512Mi \
              --quiet || true
            exit 1
          fi

          echo "MEMORY_MUTATION_COMMAND=PASS"

      - name: Verify post-update configuration and private IAM
        id: postcheck
        shell: bash
        env:
          BASELINE_REVISION: ${{ steps.baseline.outputs.revision }}
          BASELINE_IMAGE: ${{ steps.baseline.outputs.image }}
          BASELINE_URL: ${{ steps.baseline.outputs.url }}
        run: |
          set -euo pipefail

          gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > "$RUNNER_TEMP/after-service.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > "$RUNNER_TEMP/after-iam.json"

          URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/after-service.json")"
          REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$RUNNER_TEMP/after-service.json")"
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image // empty' "$RUNNER_TEMP/after-service.json")"
          MEMORY="$(jq -r '.spec.template.spec.containers[0].resources.limits.memory // empty' "$RUNNER_TEMP/after-service.json")"
          CPU="$(jq -r '.spec.template.spec.containers[0].resources.limits.cpu // empty' "$RUNNER_TEMP/after-service.json")"
          RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/after-service.json")"
          STARTUP_PATH="$(jq -r '.spec.template.spec.containers[0].startupProbe.httpGet.path // empty' "$RUNNER_TEMP/after-service.json")"
          STARTUP_PORT="$(jq -r '.spec.template.spec.containers[0].startupProbe.httpGet.port // empty' "$RUNNER_TEMP/after-service.json")"
          CONCURRENCY="$(jq -r '.spec.template.spec.containerConcurrency // empty' "$RUNNER_TEMP/after-service.json")"
          TIMEOUT="$(jq -r '.spec.template.spec.timeoutSeconds // empty' "$RUNNER_TEMP/after-service.json")"
          CPU_THROTTLING="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/cpu-throttling"] // empty' "$RUNNER_TEMP/after-service.json")"
          CPU_BOOST="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/startup-cpu-boost"] // empty' "$RUNNER_TEMP/after-service.json")"
          SERVICE_MIN="$(jq -r '.metadata.annotations["run.googleapis.com/minScale"] // "0"' "$RUNNER_TEMP/after-service.json")"
          SERVICE_MAX="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/after-service.json")"

          test "$URL" = "$BASELINE_URL"
          test -n "$REVISION"
          test "$REVISION" != "$BASELINE_REVISION"
          test "$IMAGE" = "$BASELINE_IMAGE"
          test "$MEMORY" = "256Mi"
          test "$CPU" = "1"
          test "$RUNTIME" = "$RUNTIME_SERVICE_ACCOUNT"
          test "$STARTUP_PATH" = "/ai-arman/foundation"
          test "$STARTUP_PORT" = "8080"
          test "$CONCURRENCY" = "20"
          test "$TIMEOUT" = "30"
          test "$CPU_THROTTLING" = "true"
          test "$CPU_BOOST" = "false"
          test "$SERVICE_MIN" = "0"
          test "$SERVICE_MAX" = "1"

          for flag in \
            AI_ARMAN_WIDGET_PREVIEW_ENABLED \
            AI_ARMAN_MODEL_INTERPRETATION_ENABLED \
            AI_ARMAN_MODEL_SHADOW_ENABLED \
            AI_ARMAN_MODEL_PROMOTION_ENABLED; do
            VALUE="$(jq -r --arg flag "$flag" '.spec.template.spec.containers[0].env[]? | select(.name == $flag) | .value' "$RUNNER_TEMP/after-service.json")"
            test "$VALUE" = "false"
          done

          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$RUNNER_TEMP/after-iam.json" >/dev/null; then
            echo "Public IAM detected after memory update." >&2
            exit 1
          fi

          echo "POST_MEMORY=256Mi"
          echo "POST_PRIVATE_IAM=PASS"
          echo "POST_REVISION=$REVISION"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Mint private service ID token
        id: idtoken
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.postcheck.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticated remote smoke at 256Mi
        shell: bash
        env:
          SERVICE_URL: ${{ steps.postcheck.outputs.url }}
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_URL"
          test -n "$ID_TOKEN"
          echo "::add-mask::$ID_TOKEN"

          FOUNDATION_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/foundation.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ID_TOKEN" \
            "$SERVICE_URL/ai-arman/foundation")"
          test "$FOUNDATION_CODE" = "200"

          jq -e '
            .ok == true and
            .service == "ai-arman" and
            .phase == "foundation-v1" and
            .productionActionsEnabled == false
          ' "$RUNNER_TEMP/foundation.json" >/dev/null

          WIDGET_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/widget.txt" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ID_TOKEN" \
            "$SERVICE_URL/ai-arman/widget/beta0-preview")"
          test "$WIDGET_CODE" = "404"

          echo "REMOTE_FOUNDATION_HTTP=200"
          echo "REMOTE_FOUNDATION_PAYLOAD=PASS"
          echo "REMOTE_WIDGET_HTTP=404"
          echo "REMOTE_WIDGET_DISABLED=PASS"

      - name: Roll back to 512Mi on any post-mutation failure
        if: failure() && steps.mutate.outputs.attempted == 'true'
        shell: bash
        run: |
          set +e
          echo "ROLLBACK_TRIGGERED=true"
          gcloud run services update "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --memory 512Mi \
            --quiet
          UPDATE_CODE=$?

          gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > "$RUNNER_TEMP/rollback-service.json"
          DESCRIBE_CODE=$?

          if [ "$UPDATE_CODE" -ne 0 ] || [ "$DESCRIBE_CODE" -ne 0 ]; then
            echo "ROLLBACK_RESULT=FAIL" >&2
            exit 1
          fi

          MEMORY="$(jq -r '.spec.template.spec.containers[0].resources.limits.memory // empty' "$RUNNER_TEMP/rollback-service.json")"
          if [ "$MEMORY" != "512Mi" ]; then
            echo "ROLLBACK_RESULT=FAIL_MEMORY_$MEMORY" >&2
            exit 1
          fi

          echo "ROLLBACK_RESULT=PASS_512Mi"

      - name: Publish live gate summary
        if: success()
        shell: bash
        env:
          REVISION: ${{ steps.postcheck.outputs.revision }}
        run: |
          {
            echo "## AI Arman beta0 memory live gate"
            echo
            echo "- Service: \`$SERVICE_NAME\`"
            echo "- Revision: \`$REVISION\`"
            echo "- Memory: 256 MiB"
            echo "- CPU: 1 vCPU"
            echo "- Service scaling: min 0 / max 1"
            echo "- Private IAM boundary: PASS"
            echo "- Foundation authenticated remote smoke: PASS"
            echo "- Widget remains disabled: PASS"
            echo "- Model interpretation/shadow/promotion remain disabled: PASS"
            echo "- Production actions remain disabled: PASS"
            echo
            echo "Only the Cloud Run memory limit was intentionally changed."
          } >> "$GITHUB_STEP_SUMMARY"
