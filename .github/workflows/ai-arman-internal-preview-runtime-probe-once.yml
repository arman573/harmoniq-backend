name: AI Arman internal preview runtime probe once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-internal-preview-runtime-probe-once
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  SERVICE_URL: https://harmoniq-ai-arman-beta0-cw6q5ekseq-lz.a.run.app
  CANDIDATE_REVISION: harmoniq-ai-arman-beta0-preview-68ae2e0c-1
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  RESULT_PATH: docs/ai-arman/INTERNAL_PREVIEW_RUNTIME_PROBE_LATEST.md

jobs:
  probe:
    if: github.event.head_commit.message == 'Probe internal preview runtime once'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Resolve tagged URL
        id: target
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          TAG_URL="$(jq -r --arg rev "$CANDIDATE_REVISION" '.status.traffic[]? | select(.revisionName == $rev and (.tag // "") != "") | .url // empty' "$RUNNER_TEMP/service.json" | head -n1)"
          test -n "$TAG_URL"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Mint canonical-audience ID token
        id: token
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_URL }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Probe endpoints without failing job
        id: runtime
        shell: bash
        env:
          ID_TOKEN: ${{ steps.token.outputs.id_token }}
          TAG_URL: ${{ steps.target.outputs.tag_url }}
        run: |
          set -u
          echo "::add-mask::$ID_TOKEN"
          PAGE_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/page.out" --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$TAG_URL/ai-arman/internal-preview" || true)"
          DIAG_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/diag.out" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"contractVersion\":\"ai-arman-chat-v1\",\"clientMessageId\":\"runtime-probe-${GITHUB_RUN_ID}\",\"message\":{\"text\":\"Jag söker ett schampo för torrt hår\"},\"context\":{\"locale\":\"sv-SE\",\"channel\":\"internal_preview\"}}" \
            "$TAG_URL/ai-arman/internal-preview/diagnostics" || true)"

          PAGE_MARKER=false
          if grep -Fq 'AI Arman – intern testyta' "$RUNNER_TEMP/page.out" 2>/dev/null; then PAGE_MARKER=true; fi

          PROVIDER_STATUS=unavailable
          DIAG_ERROR=unavailable
          if jq -e . "$RUNNER_TEMP/diag.out" >/dev/null 2>&1; then
            PROVIDER_STATUS="$(jq -r '.modelShadow.providerStatus // "unavailable"' "$RUNNER_TEMP/diag.out")"
            DIAG_ERROR="$(jq -r '.message // .error // "none"' "$RUNNER_TEMP/diag.out" | tr '\n' ' ' | cut -c1-120)"
          else
            DIAG_ERROR="$(tr '\n' ' ' < "$RUNNER_TEMP/diag.out" 2>/dev/null | cut -c1-120)"
          fi

          echo "page_code=${PAGE_CODE:-curl_error}" >> "$GITHUB_OUTPUT"
          echo "page_marker=$PAGE_MARKER" >> "$GITHUB_OUTPUT"
          echo "diag_code=${DIAG_CODE:-curl_error}" >> "$GITHUB_OUTPUT"
          echo "provider_status=$PROVIDER_STATUS" >> "$GITHUB_OUTPUT"
          echo "diag_error=$DIAG_ERROR" >> "$GITHUB_OUTPUT"

      - name: Write safe runtime probe checkpoint
        shell: bash
        env:
          TAG_URL: ${{ steps.target.outputs.tag_url }}
          PAGE_CODE: ${{ steps.runtime.outputs.page_code }}
          PAGE_MARKER: ${{ steps.runtime.outputs.page_marker }}
          DIAG_CODE: ${{ steps.runtime.outputs.diag_code }}
          PROVIDER_STATUS: ${{ steps.runtime.outputs.provider_status }}
          DIAG_ERROR: ${{ steps.runtime.outputs.diag_error }}
        run: |
          set -euo pipefail
          cat > "$RESULT_PATH" <<EOF
          # AI Arman – internal preview runtime probe

          - Recorded at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Candidate revision: \`$CANDIDATE_REVISION\`
          - Tagged URL: \`$TAG_URL\`
          - Preview page HTTP: \`$PAGE_CODE\`
          - Preview page marker found: \`$PAGE_MARKER\`
          - Diagnostics HTTP: \`$DIAG_CODE\`
          - Diagnostics provider status: \`$PROVIDER_STATUS\`
          - Safe diagnostics error/status text: \`$DIAG_ERROR\`

          This probe performs no deploy, traffic update, IAM mutation, secret change, or business write. It records only HTTP status and allowlisted diagnostic status text.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_PATH"
          git commit -m 'Record internal preview runtime probe'
          git push origin HEAD:feature/ai-arman-foundation-v1
