name: AI Arman live durable shadow activate once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/ai-arman-live-durable-shadow-activate-once.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  DETERMINISTIC_REVISION: harmoniq-ai-arman-beta0-00002-2kq
  OLD_SHADOW_REVISION: harmoniq-ai-arman-beta0-shadow-a979b694-2
  DURABLE_REVISION: harmoniq-ai-arman-beta0-durable-20ff1996-1
  EXPECTED_DIGEST: sha256:0f9c7b718c0457f231af770aa82b18f5c2bbe02ecfe295cd5b6647ca249661a0
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Fail-closed preflight
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > before.json
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > iam.json
          gcloud run revisions describe "$DURABLE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > durable.json
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' iam.json >/dev/null; then exit 1; fi
          test "$(jq -r --arg r "$DETERMINISTIC_REVISION" '[.status.traffic[]? | select(.revisionName==$r) | (.percent//0)] | add//0' before.json)" = 99
          test "$(jq -r --arg r "$OLD_SHADOW_REVISION" '[.status.traffic[]? | select(.revisionName==$r) | (.percent//0)] | add//0' before.json)" = 1
          test "$(jq -r --arg r "$DURABLE_REVISION" '[.status.traffic[]? | select(.revisionName==$r) | (.percent//0)] | add//0' before.json)" = 0
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' before.json)" = 2
          test "$(jq -r '[.status.conditions[]? | select(.type=="Ready")][0].status // empty' durable.json)" = True
          jq -r '.spec.containers[0].image' durable.json | grep -F "$EXPECTED_DIGEST" >/dev/null
          envv(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' durable.json; }
          test "$(envv AI_ARMAN_MODEL_INTERPRETATION_ENABLED)" = true
          test "$(envv AI_ARMAN_MODEL_SHADOW_ENABLED)" = true
          test "$(envv AI_ARMAN_MODEL_PROMOTION_ENABLED)" = false
          test "$(envv AI_ARMAN_WIDGET_PREVIEW_ENABLED)" = false
          test "$(envv AI_ARMAN_MODEL_SHADOW_DURABLE_AUDIT_ENABLED)" = true
          test "$(envv AI_ARMAN_MODEL_SHADOW_MAX_CALLS_PER_MINUTE)" = 1
          test "$(envv AI_ARMAN_MODEL_SHADOW_MAX_CONCURRENT_CALLS)" = 1
          test "$(envv AI_ARMAN_MODEL_SHADOW_MAX_TOKENS_PER_CALL)" = 1024
          test "$(envv AI_ARMAN_MODEL_SHADOW_MAX_TOKENS_PER_MINUTE)" = 1024
          test "$(envv AI_ARMAN_MODEL_SHADOW_MAX_COST_USD_PER_CALL)" = 0.005
          test "$(envv AI_ARMAN_MODEL_SHADOW_MAX_COST_USD_PER_MINUTE)" = 0.005
          echo PREFLIGHT_PASS

      - name: Move only the existing one percent shadow
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --to-revisions="$DETERMINISTIC_REVISION=99,$DURABLE_REVISION=1"

      - name: Verify live boundary or rollback
        shell: bash
        run: |
          set -euo pipefail
          ok=true
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > after.json || ok=false
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > iam-after.json || ok=false
          [ "$ok" = true ] && ! jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' iam-after.json >/dev/null || ok=false
          [ "$ok" = true ] && test "$(jq -r --arg r "$DETERMINISTIC_REVISION" '[.status.traffic[]? | select(.revisionName==$r) | (.percent//0)] | add//0' after.json)" = 99 || ok=false
          [ "$ok" = true ] && test "$(jq -r --arg r "$DURABLE_REVISION" '[.status.traffic[]? | select(.revisionName==$r) | (.percent//0)] | add//0' after.json)" = 1 || ok=false
          [ "$ok" = true ] && test "$(jq -r --arg r "$OLD_SHADOW_REVISION" '[.status.traffic[]? | select(.revisionName==$r) | (.percent//0)] | add//0' after.json)" = 0 || ok=false
          [ "$ok" = true ] && test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' after.json)" = 2 || ok=false
          if [ "$ok" != true ]; then
            echo 'Post-change verification failed; rolling back.' >&2
            gcloud run services update-traffic "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --to-revisions="$DETERMINISTIC_REVISION=99,$OLD_SHADOW_REVISION=1"
            exit 1
          fi
          echo LIVE_DURABLE_SHADOW_1_PERCENT_PASS
