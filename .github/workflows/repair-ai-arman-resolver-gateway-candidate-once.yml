name: Repair AI Arman resolver gateway candidate once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair AI Arman resolver gateway candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROJECT_ID: harmoniq-210513
      REGION: europe-north1
      SERVICE_NAME: harmoniq-ai-arman-beta0
      RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
      CANDIDATE_TAG: resolver-ai-3298af83
      SOURCE_SHA: 3298af83deea3d186f4295e4637b20e62badb0a5
      CASE_ID: HQR-2493614
      RESULT_PATH: docs/ai-arman/ADMIN_RESOLVER_CANDIDATE_LATEST.md
      WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
      DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Snapshot production traffic and recover gateway config in memory
        id: before
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service-before.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent,tag}] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/service-before.json" > "$RUNNER_TEMP/positive-before.json"
          PROD_REV="$(jq -r '[.status.traffic[]? | select((.percent // 0)>0)] | sort_by(.percent) | last | .revisionName // empty' "$RUNNER_TEMP/service-before.json")"
          OLD_CANDIDATE_REV="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/service-before.json" | head -n1)"
          SERVICE_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/service-before.json")"
          test -n "$PROD_REV"; test -n "$OLD_CANDIDATE_REV"; test -n "$SERVICE_URL"
          gcloud run revisions describe "$PROD_REV" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/prod-rev.json"
          gcloud run revisions describe "$OLD_CANDIDATE_REV" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/old-candidate.json"
          envv(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' "$RUNNER_TEMP/prod-rev.json"; }
          GW_ENABLED="$(envv AI_ARMAN_RETURNS_ADMIN_GATEWAY_ENABLED)"
          GW_BASE="$(envv AI_ARMAN_RETURNS_ADMIN_GATEWAY_BASE_URL)"
          GW_AUDIENCE="$(envv AI_ARMAN_RETURNS_ADMIN_GATEWAY_AUDIENCE)"
          GW_TOKEN="$(envv AI_ARMAN_RETURNS_ADMIN_GATEWAY_ACCESS_TOKEN)"
          GW_TIMEOUT="$(envv AI_ARMAN_RETURNS_ADMIN_GATEWAY_TIMEOUT_MS)"
          test "$GW_ENABLED" = 'true'
          test -n "$GW_BASE"; test -n "$GW_AUDIENCE"; test "${#GW_TOKEN}" -ge 32
          echo "::add-mask::$GW_TOKEN"
          echo "::add-mask::$GW_BASE"
          echo "::add-mask::$GW_AUDIENCE"
          echo "GW_ENABLED=$GW_ENABLED" >> "$GITHUB_ENV"
          echo "GW_BASE=$GW_BASE" >> "$GITHUB_ENV"
          echo "GW_AUDIENCE=$GW_AUDIENCE" >> "$GITHUB_ENV"
          echo "GW_TOKEN=$GW_TOKEN" >> "$GITHUB_ENV"
          echo "GW_TIMEOUT=${GW_TIMEOUT:-20000}" >> "$GITHUB_ENV"
          IMAGE="$(jq -r '.spec.containers[0].image // empty' "$RUNNER_TEMP/old-candidate.json")"
          test -n "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "production_revision=$PROD_REV" >> "$GITHUB_OUTPUT"

      - name: Deploy repaired zero traffic resolver revision
        id: deploy
        env:
          IMAGE: ${{ steps.before.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          APP_TOKEN="$(printf 'resolver:%s' "$SOURCE_SHA" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$APP_TOKEN"
          gcloud run deploy "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --platform managed \
            --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "resolverfix-${SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}" \
            --tag "$CANDIDATE_TAG" --no-traffic \
            --update-env-vars "AI_ARMAN_ADMIN_RESOLVER_ENABLED=true,AI_ARMAN_ADMIN_RESOLVER_ACCESS_TOKEN=$APP_TOKEN,AI_ARMAN_RETURNS_ADMIN_GATEWAY_ENABLED=$GW_ENABLED,AI_ARMAN_RETURNS_ADMIN_GATEWAY_BASE_URL=$GW_BASE,AI_ARMAN_RETURNS_ADMIN_GATEWAY_AUDIENCE=$GW_AUDIENCE,AI_ARMAN_RETURNS_ADMIN_GATEWAY_ACCESS_TOKEN=$GW_TOKEN,AI_ARMAN_RETURNS_ADMIN_GATEWAY_TIMEOUT_MS=$GW_TIMEOUT,AI_ARMAN_RETURNS_ADMIN_WRITE_ENABLED=false,AI_ARMAN_MODEL_PROMOTION_ENABLED=false" \
            --quiet
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/after.json"
          REV="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          URL="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          test -n "$REV"; test -n "$URL"
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/after.json")" = '0'
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify repaired config and production traffic unchanged
        env:
          REV: ${{ steps.deploy.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/final.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent,tag}] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/final.json" > "$RUNNER_TEMP/positive-after.json"
          cmp "$RUNNER_TEMP/positive-before.json" "$RUNNER_TEMP/positive-after.json"
          gcloud run revisions describe "$REV" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/repaired.json"
          envc(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' "$RUNNER_TEMP/repaired.json"; }
          test "$(envc AI_ARMAN_ADMIN_RESOLVER_ENABLED)" = 'true'
          test "$(envc AI_ARMAN_RETURNS_ADMIN_GATEWAY_ENABLED)" = 'true'
          test -n "$(envc AI_ARMAN_RETURNS_ADMIN_GATEWAY_BASE_URL)"
          test -n "$(envc AI_ARMAN_RETURNS_ADMIN_GATEWAY_AUDIENCE)"
          test "${#GW_TOKEN}" -ge 32
          test "$(envc AI_ARMAN_RETURNS_ADMIN_WRITE_ENABLED)" = 'false'
          test "$(envc AI_ARMAN_MODEL_PROMOTION_ENABLED)" = 'false'

      - name: Mint private identity token
        id: idtoken
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.before.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Verify real read-only prepare directly on repaired candidate
        id: prepare
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          TAG_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          APP_TOKEN="$(printf 'resolver:%s' "$SOURCE_SHA" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$APP_TOKEN"
          CODE="$(curl --max-time 70 -sS -o "$RUNNER_TEMP/prepare.json" -w '%{http_code}' --request POST --header "Authorization: Bearer $ID_TOKEN" --header "X-AI-Arman-Admin-Token: $APP_TOKEN" --header 'Content-Type: application/json' --data "{\"caseId\":\"$CASE_ID\"}" "$TAG_URL/ai-arman/internal/admin-resolver/prepare" || true)"
          if [[ "$CODE" != '200' && "$CODE" != '201' ]]; then
            jq '{ok,code,error}' "$RUNNER_TEMP/prepare.json" >&2 2>/dev/null || true
            exit 1
          fi
          jq -e --arg id "$CASE_ID" '.ok==true and .mode=="prepare" and .caseId==$id and .verifiedCase==true and .executesWrites==false and .sendsCustomerMessage==false' "$RUNNER_TEMP/prepare.json" >/dev/null
          VERIFIED_ORDER="$(jq -r '.verifiedOrderContext // false' "$RUNNER_TEMP/prepare.json")"
          ANALYSIS_STATUS="$(jq -r '.analysisStatus // "unknown"' "$RUNNER_TEMP/prepare.json")"
          DRAFT_STATUS="$(jq -r '.draftStatus // "unknown"' "$RUNNER_TEMP/prepare.json")"
          echo "verified_order=$VERIFIED_ORDER" >> "$GITHUB_OUTPUT"
          echo "analysis_status=$ANALYSIS_STATUS" >> "$GITHUB_OUTPUT"
          echo "draft_status=$DRAFT_STATUS" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/prepare.json"

      - name: Record repaired PASS
        env:
          REV: ${{ steps.deploy.outputs.revision }}
          TAG_URL: ${{ steps.deploy.outputs.url }}
          PROD_REV: ${{ steps.before.outputs.production_revision }}
          VERIFIED_ORDER: ${{ steps.prepare.outputs.verified_order }}
          ANALYSIS_STATUS: ${{ steps.prepare.outputs.analysis_status }}
          DRAFT_STATUS: ${{ steps.prepare.outputs.draft_status }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/ai-arman-foundation-v1
          git checkout -B result origin/feature/ai-arman-foundation-v1
          cat > "$RESULT_PATH" <<EOF
          # AI Arman admin resolver candidate

          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Frozen source: \`$SOURCE_SHA\`
          - Overall: **PASS**
          - Candidate revision: \`$REV\`
          - Candidate URL: \`$TAG_URL\`
          - Candidate traffic: **0%**
          - Production positive traffic: **unchanged**
          - Production reference revision: \`$PROD_REV\`
          - Private IAM: **unchanged**
          - Resolver enabled: **true**
          - Admin gateway restored from traffic-serving production revision: **true**
          - Full-admin writes on candidate: **false**
          - Model promotion: **false**
          - Real case prepare: **PASS**
          - Verified case: **true**
          - Verified order context: **$VERIFIED_ORDER**
          - Analysis status: \`$ANALYSIS_STATUS\`
          - Draft status: \`$DRAFT_STATUS\`
          - Customer message sent: **false**
          - Write executed: **false**
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record repaired AI Arman resolver candidate'
          git push origin HEAD:feature/ai-arman-foundation-v1
