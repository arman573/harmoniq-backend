name: Temporary AI Arman memory measurement

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-memory-measurement.yml

permissions:
  contents: read

jobs:
  memory-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current candidate image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile.ai-arman-candidate -t ai-arman-memory:current .

      - name: Measure unconstrained candidate
        shell: bash
        run: |
          set -euo pipefail
          CID="$(docker run -d -p 18080:8080 \
            -e PORT=8080 \
            -e AI_ARMAN_WIDGET_PREVIEW_ENABLED=false \
            -e AI_ARMAN_MODEL_INTERPRETATION_ENABLED=false \
            -e AI_ARMAN_MODEL_SHADOW_ENABLED=false \
            -e AI_ARMAN_MODEL_PROMOTION_ENABLED=false \
            ai-arman-memory:current)"
          cleanup() { docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:18080/ai-arman/foundation >/dev/null; then break; fi
            sleep 1
          done

          echo "MEMORY_UNCONSTRAINED_READY=PASS"
          docker stats --no-stream --format 'MEMORY_UNCONSTRAINED_IDLE={{.MemUsage}} CPU={{.CPUPerc}}' "$CID"

          for i in {1..200}; do
            curl --silent --fail http://127.0.0.1:18080/ai-arman/foundation >/dev/null &
            if (( i % 20 == 0 )); then wait; fi
          done
          wait

          docker stats --no-stream --format 'MEMORY_UNCONSTRAINED_AFTER_200={{.MemUsage}} CPU={{.CPUPerc}}' "$CID"
          docker inspect "$CID" --format 'MEMORY_UNCONSTRAINED_OOM={{.State.OOMKilled}} EXIT={{.State.ExitCode}}'

      - name: Measure isolated 256 MiB candidate
        shell: bash
        run: |
          set -euo pipefail
          CID="$(docker run -d --memory=256m --memory-swap=256m -p 18081:8080 \
            -e PORT=8080 \
            -e AI_ARMAN_WIDGET_PREVIEW_ENABLED=false \
            -e AI_ARMAN_MODEL_INTERPRETATION_ENABLED=false \
            -e AI_ARMAN_MODEL_SHADOW_ENABLED=false \
            -e AI_ARMAN_MODEL_PROMOTION_ENABLED=false \
            ai-arman-memory:current)"
          cleanup() { docker logs "$CID" || true; docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:18081/ai-arman/foundation >/dev/null; then break; fi
            if [ "$(docker inspect "$CID" --format '{{.State.Running}}')" != "true" ]; then
              echo "MEMORY_256_STARTUP=FAIL_CONTAINER_EXITED"
              docker inspect "$CID" --format 'MEMORY_256_OOM={{.State.OOMKilled}} EXIT={{.State.ExitCode}}'
              exit 20
            fi
            sleep 1
          done

          curl --silent --fail http://127.0.0.1:18081/ai-arman/foundation >/dev/null
          echo "MEMORY_256_READY=PASS"
          docker stats --no-stream --format 'MEMORY_256_IDLE={{.MemUsage}} CPU={{.CPUPerc}}' "$CID"

          for wave in {1..10}; do
            for i in {1..20}; do
              curl --silent --fail http://127.0.0.1:18081/ai-arman/foundation >/dev/null &
            done
            wait
            docker stats --no-stream --format "MEMORY_256_WAVE_${wave}={{.MemUsage}} CPU={{.CPUPerc}}" "$CID"
          done

          WIDGET_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/ai-arman/widget/beta0-preview)"
          test "$WIDGET_CODE" = "404"
          echo "MEMORY_256_WIDGET_DISABLED=PASS"

          docker inspect "$CID" --format 'MEMORY_256_FINAL_OOM={{.State.OOMKilled}} RUNNING={{.State.Running}} EXIT={{.State.ExitCode}}'
