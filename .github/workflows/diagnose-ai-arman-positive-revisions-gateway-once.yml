name: Diagnose AI Arman positive revisions gateway config once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose AI Arman positive revisions gateway config'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PROJECT_ID: harmoniq-210513
      REGION: europe-north1
      SERVICE_NAME: harmoniq-ai-arman-beta0
      RESULT_PATH: docs/ai-arman/ADMIN_POSITIVE_REVISION_GATEWAY_DIAGNOSTIC.md
      WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
      DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Inspect positive-traffic revisions without exposing values
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          jq -r '.status.traffic[]? | select((.percent // 0)>0) | [.revisionName, (.percent|tostring), (.tag // "")] | @tsv' "$RUNNER_TEMP/service.json" > "$RUNNER_TEMP/traffic.tsv"
          test -s "$RUNNER_TEMP/traffic.tsv"
          : > "$RUNNER_TEMP/rows.md"
          while IFS=$'\t' read -r rev percent tag; do
            gcloud run revisions describe "$rev" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/rev.json"
            envv(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' "$RUNNER_TEMP/rev.json"; }
            enabled="$(envv AI_ARMAN_RETURNS_ADMIN_GATEWAY_ENABLED)"
            base="$(envv AI_ARMAN_RETURNS_ADMIN_GATEWAY_BASE_URL)"
            audience="$(envv AI_ARMAN_RETURNS_ADMIN_GATEWAY_AUDIENCE)"
            token="$(envv AI_ARMAN_RETURNS_ADMIN_GATEWAY_ACCESS_TOKEN)"
            write="$(envv AI_ARMAN_RETURNS_ADMIN_WRITE_ENABLED)"
            [[ -n "$token" ]] && echo "::add-mask::$token"
            printf -- '- Revision `%s` | traffic `%s%%` | tag `%s` | gateway `%s` | base `%s` | audience `%s` | token length `%s` | writes `%s`\n' \
              "$rev" "$percent" "${tag:-none}" "${enabled:-missing}" \
              "$([[ -n "$base" ]] && echo present || echo missing)" \
              "$([[ -n "$audience" ]] && echo present || echo missing)" \
              "${#token}" "${write:-missing}" >> "$RUNNER_TEMP/rows.md"
          done < "$RUNNER_TEMP/traffic.tsv"

      - name: Record safe diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/ai-arman-foundation-v1
          git checkout -B result origin/feature/ai-arman-foundation-v1
          {
            echo '# AI Arman positive-traffic gateway diagnostic'
            echo
            echo "- Checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '- No gateway URL/token values are recorded.'
            echo
            cat "$RUNNER_TEMP/rows.md"
          } > "$RESULT_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman positive revision gateway diagnostic'
          git push origin HEAD:feature/ai-arman-foundation-v1
