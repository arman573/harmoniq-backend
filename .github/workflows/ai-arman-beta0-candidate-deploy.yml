name: AI Arman beta0 candidate deploy

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-beta0-candidate-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  RETURNS_SERVICE: harmoniq-returns-api
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  STABLE_TAG: resolver-ready-3298af83
  EXPECTED_RETURNS_LIVE_REV: harmoniq-returns-api-trk2494077-1
  RETURNS_CANDIDATE_REV: harmoniq-returns-api-aistock-52
  PRESENTATION_CANDIDATE_TAG: cpgcs-352e37b7
  PRESENTATION_CANDIDATE_REV: harmoniq-ai-arman-beta0-cpgcs-352e37b7-20
  PRESENTATION_BUCKET: harmoniq-210513-ai-arman-customer-presentation
  PRESENTATION_OBJECT: ai-arman/customer-presentation-v1.json
  RESULT_PATH: .github/deploy-status/ai-arman-customer-presentation-candidate-latest.txt
  FAILED_STAGE: snapshot

jobs:
  verify-approved-write:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Verify AI Arman presentation approved write candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1

      - name: Authenticate dedicated AI Arman deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Snapshot exact zero traffic candidate and production boundaries
        id: before
        shell: bash
        run: |
          set -euo pipefail
          echo 'FAILED_STAGE=snapshot' >> "$GITHUB_ENV"
          test "$GITHUB_REPOSITORY" = 'arman573/harmoniq-backend'
          test "$GITHUB_REF" = 'refs/heads/feature/ai-arman-foundation-v1'

          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai-iam.json"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/ai-iam.json" >/dev/null; then
            echo 'AI service unexpectedly public' >&2
            exit 1
          fi
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent,tag}] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/ai.json" > "$RUNNER_TEMP/ai-positive-before.json"
          STABLE_REV="$(jq -r --arg tag "$STABLE_TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/ai.json" | head -n1)"
          CANDIDATE_REV="$(jq -r --arg tag "$PRESENTATION_CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/ai.json" | head -n1)"
          CANDIDATE_URL="$(jq -r --arg tag "$PRESENTATION_CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/ai.json" | head -n1)"
          AI_CANONICAL_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/ai.json")"
          test "$STABLE_REV" = 'harmoniq-ai-arman-beta0-resv4-07aacf15-15'
          test "$CANDIDATE_REV" = "$PRESENTATION_CANDIDATE_REV"
          test -n "$CANDIDATE_URL"
          test -n "$AI_CANONICAL_URL"
          test "$(jq -r --arg r "$CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/ai.json")" = '0'

          gcloud run revisions describe "$CANDIDATE_REV" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/candidate.json"
          test "$(jq -r '.spec.serviceAccountName // empty' "$RUNNER_TEMP/candidate.json")" = "$RUNTIME_SERVICE_ACCOUNT"
          cenv(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' "$RUNNER_TEMP/candidate.json" | head -n1; }
          test "$(cenv AI_ARMAN_CUSTOMER_ADMIN_ENABLED)" = 'true'
          test "$(cenv AI_ARMAN_CUSTOMER_PRESENTATION_GCS_BUCKET)" = "$PRESENTATION_BUCKET"
          test "$(cenv AI_ARMAN_CUSTOMER_PRESENTATION_GCS_OBJECT)" = "$PRESENTATION_OBJECT"
          APP_TOKEN="$(cenv AI_ARMAN_CUSTOMER_ADMIN_ACCESS_TOKEN)"
          test ${#APP_TOKEN} -ge 32
          echo "::add-mask::$APP_TOKEN"
          echo "APP_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"

          gcloud run services describe "$RETURNS_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/returns.json"
          test "$(jq -r '[.status.traffic[]? | select((.percent // 0)>0)] | if length==1 and .[0].percent==100 then .[0].revisionName else empty end' "$RUNNER_TEMP/returns.json")" = "$EXPECTED_RETURNS_LIVE_REV"
          test "$(jq -r --arg r "$RETURNS_CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/returns.json")" = '0'

          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "ai_canonical_url=$AI_CANONICAL_URL" >> "$GITHUB_OUTPUT"
          echo 'SNAPSHOT_PASS=true' >> "$GITHUB_ENV"

      - name: Mint private AI identity token
        id: idtoken
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.before.outputs.ai_canonical_url }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Approved candidate-only presentation write and authoritative reread
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.before.outputs.candidate_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'FAILED_STAGE=approved-write' >> "$GITHUB_ENV"
          echo "::add-mask::$ID_TOKEN"

          GET1="$(curl --max-time 30 -sS -o "$RUNNER_TEMP/before.json" -w '%{http_code}' \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header "X-AI-Arman-Customer-Admin-Token: $APP_TOKEN" \
            "$URL/ai-arman/internal/customer-presentation")"
          test "$GET1" = '200'
          jq -e '.ok==true and .configured==true and .source=="default" and .generation=="0" and .writeExecuted==false and (.presentation|type)=="object"' "$RUNNER_TEMP/before.json" >/dev/null

          jq '{approved:true,expectedGeneration:.generation,presentation:.presentation}' "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/put.json"
          PUT_CODE="$(curl --max-time 30 -sS -o "$RUNNER_TEMP/put-response.json" -w '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header "X-AI-Arman-Customer-Admin-Token: $APP_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/put.json" \
            "$URL/ai-arman/internal/customer-presentation")"
          echo "APPROVED_PUT_HTTP=$PUT_CODE" >> "$GITHUB_ENV"
          test "$PUT_CODE" = '200'
          jq -e '.ok==true and .configured==true and .source=="gcs" and .writeExecuted==true and (.generation|test("^[0-9]+$")) and .generation!="0" and .updatedBy=="returns-admin"' "$RUNNER_TEMP/put-response.json" >/dev/null
          NEW_GENERATION="$(jq -r '.generation' "$RUNNER_TEMP/put-response.json")"
          echo "NEW_GENERATION=$NEW_GENERATION" >> "$GITHUB_ENV"

          GET2="$(curl --max-time 30 -sS -o "$RUNNER_TEMP/after.json" -w '%{http_code}' \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header "X-AI-Arman-Customer-Admin-Token: $APP_TOKEN" \
            "$URL/ai-arman/internal/customer-presentation")"
          test "$GET2" = '200'
          jq -e --arg generation "$NEW_GENERATION" '.ok==true and .configured==true and .source=="gcs" and .generation==$generation and .writeExecuted==false and .updatedBy=="returns-admin"' "$RUNNER_TEMP/after.json" >/dev/null
          jq -e --slurp '.[0].presentation == .[1].presentation' "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" >/dev/null

          jq '{approved:true,expectedGeneration:"0",presentation:.presentation}' "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/stale.json"
          STALE_CODE="$(curl --max-time 30 -sS -o "$RUNNER_TEMP/stale-response.json" -w '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header "X-AI-Arman-Customer-Admin-Token: $APP_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/stale.json" \
            "$URL/ai-arman/internal/customer-presentation")"
          echo "STALE_PUT_HTTP=$STALE_CODE" >> "$GITHUB_ENV"
          test "$STALE_CODE" = '409'
          jq -e '.code=="customer_presentation_conflict" and .writeExecuted==false' "$RUNNER_TEMP/stale-response.json" >/dev/null

          echo 'APPROVED_WRITE_PASS=true' >> "$GITHUB_ENV"
          echo 'AUTHORITATIVE_REREAD_PASS=true' >> "$GITHUB_ENV"
          echo 'STALE_GENERATION_REJECTED=true' >> "$GITHUB_ENV"

      - name: Prove traffic and production boundaries unchanged
        shell: bash
        run: |
          set -euo pipefail
          echo 'FAILED_STAGE=traffic-proof' >> "$GITHUB_ENV"
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai-final.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent,tag}] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/ai-final.json" > "$RUNNER_TEMP/ai-positive-after.json"
          cmp "$RUNNER_TEMP/ai-positive-before.json" "$RUNNER_TEMP/ai-positive-after.json"
          test "$(jq -r --arg r "$PRESENTATION_CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/ai-final.json")" = '0'

          gcloud run services describe "$RETURNS_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/returns-final.json"
          test "$(jq -r '[.status.traffic[]? | select((.percent // 0)>0)] | if length==1 and .[0].percent==100 then .[0].revisionName else empty end' "$RUNNER_TEMP/returns-final.json")" = "$EXPECTED_RETURNS_LIVE_REV"
          test "$(jq -r --arg r "$RETURNS_CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/returns-final.json")" = '0'
          echo 'TRAFFIC_PASS=true' >> "$GITHUB_ENV"
          echo 'FAILED_STAGE=complete' >> "$GITHUB_ENV"

      - name: Record sanitized approved-write gate result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RESULT_PATH" <<EOF
          overall=$JOB_STATUS
          run_id=$GITHUB_RUN_ID
          workflow_head=$GITHUB_SHA
          stage=$FAILED_STAGE
          candidate_revision=$PRESENTATION_CANDIDATE_REV
          candidate_tag=$PRESENTATION_CANDIDATE_TAG
          candidate_traffic_expected=0
          presentation_gcs_bucket=$PRESENTATION_BUCKET
          presentation_gcs_object=$PRESENTATION_OBJECT
          snapshot_pass=${SNAPSHOT_PASS:-false}
          user_requested_next_gate=true
          approved_put_http=${APPROVED_PUT_HTTP:-unknown}
          approved_write_pass=${APPROVED_WRITE_PASS:-false}
          authoritative_reread_pass=${AUTHORITATIVE_REREAD_PASS:-false}
          new_generation=${NEW_GENERATION:-unknown}
          stale_put_http=${STALE_PUT_HTTP:-unknown}
          stale_generation_rejected=${STALE_GENERATION_REJECTED:-false}
          positive_traffic_unchanged=${TRAFFIC_PASS:-false}
          customer_message_sent=false
          order_or_case_write=false
          vendre_write=false
          gmail_write=false
          nshift_write=false
          production_traffic_cutover=false
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman approved presentation write gate [skip ci]' || true
          git push origin HEAD:feature/ai-arman-foundation-v1
