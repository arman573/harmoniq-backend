name: Inspect AI deployer returns permissions once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  AI_DEPLOYER: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  RESULT_PATH: docs/ai-arman/AI_DEPLOYER_RETURNS_PERMISSION_PREFLIGHT.md

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect AI deployer returns permissions once'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.AI_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Inspect role names and service metadata only
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe harmoniq-returns-api --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/returns.json"
          RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/returns.json")"
          CAN_DESCRIBE=true
          ROLES='unavailable'
          if gcloud projects get-iam-policy "$PROJECT_ID" --format=json > "$RUNNER_TEMP/project-iam.json" 2>/dev/null; then
            ROLES="$(jq -r --arg member "serviceAccount:$AI_DEPLOYER" '[.bindings[]? | select(any(.members[]?; .==$member)) | .role] | sort | join(",")' "$RUNNER_TEMP/project-iam.json")"
            [[ -n "$ROLES" ]] || ROLES='none-explicit-at-project'
          fi
          ACT_AS='unknown'
          if [[ -n "$RUNTIME" ]] && gcloud iam service-accounts get-iam-policy "$RUNTIME" --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/runtime-iam.json" 2>/dev/null; then
            if jq -e --arg member "serviceAccount:$AI_DEPLOYER" '[.bindings[]? | select(.role=="roles/iam.serviceAccountUser") | .members[]?] | any(.==$member)' "$RUNNER_TEMP/runtime-iam.json" >/dev/null; then ACT_AS=true; else ACT_AS=false; fi
          fi
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "roles=$ROLES" >> "$GITHUB_OUTPUT"
          echo "act_as=$ACT_AS" >> "$GITHUB_OUTPUT"
          echo "can_describe=$CAN_DESCRIBE" >> "$GITHUB_OUTPUT"
      - name: Record safe preflight
        env:
          RUNTIME: ${{ steps.inspect.outputs.runtime }}
          ROLES: ${{ steps.inspect.outputs.roles }}
          ACT_AS: ${{ steps.inspect.outputs.act_as }}
          CAN_DESCRIBE: ${{ steps.inspect.outputs.can_describe }}
        run: |
          set -euo pipefail
          cat > "$RESULT_PATH" <<EOF
          # AI deployer -> returns permission preflight

          - Observed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - AI deployer: \`$AI_DEPLOYER\`
          - Can describe returns service: **$CAN_DESCRIBE**
          - Returns runtime service account: \`$RUNTIME\`
          - Explicit project roles visible to caller: \`$ROLES\`
          - Explicit serviceAccountUser on returns runtime: **$ACT_AS**
          - Secret values read: **false**
          - IAM mutations: **none**
          - Cloud Run mutations: **none**
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI deployer returns permission preflight'
          git push origin HEAD:feature/ai-arman-foundation-v1
