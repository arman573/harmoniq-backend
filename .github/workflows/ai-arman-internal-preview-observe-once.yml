name: AI Arman internal preview observe once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-arman-internal-preview-observe-once
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  SERVICE_URL: https://harmoniq-ai-arman-beta0-cw6q5ekseq-lz.a.run.app
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  EXPECTED_SOURCE_LABEL: 68ae2e0c

jobs:
  observe-preview-candidate:
    if: github.event.pull_request.head.ref == 'feature/ai-arman-foundation-v1' && github.actor == 'arman573'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate read-only observation identity
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Wait for and verify zero-traffic preview candidate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=""
          for attempt in {1..40}; do
            CANDIDATE="$(gcloud run revisions list \
              --service "$SERVICE_NAME" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --filter="metadata.labels.release=internal-preview-candidate AND metadata.labels.source-sha=$EXPECTED_SOURCE_LABEL" \
              --sort-by='~metadata.creationTimestamp' \
              --limit=1 \
              --format='value(metadata.name)' || true)"
            if [ -n "$CANDIDATE" ]; then break; fi
            sleep 15
          done
          test -n "$CANDIDATE"

          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run revisions describe "$CANDIDATE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/candidate.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"

          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then
            echo "Public IAM detected." >&2
            exit 1
          fi
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service.json")" = "2"
          jq -e '[.status.traffic[]? | select((.percent // 0) > 0) | (.percent // 0)] | sort == [1,99]' "$RUNNER_TEMP/service.json" >/dev/null
          test "$(jq -r --arg rev "$CANDIDATE" '[.status.traffic[]? | select(.revisionName == $rev) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")" = "0"

          env_value() { jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name == $n) | .value // empty' "$RUNNER_TEMP/candidate.json"; }
          test "$(env_value AI_ARMAN_INTERNAL_PREVIEW_DIAGNOSTICS_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_INTERPRETATION_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_DURABLE_AUDIT_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_PROMOTION_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_WIDGET_PREVIEW_ENABLED)" = "false"

          TAG_URL="$(jq -r --arg rev "$CANDIDATE" '.status.traffic[]? | select(.revisionName == $rev and (.tag // "") != "") | .url // empty' "$RUNNER_TEMP/service.json" | head -n1)"
          test -n "$TAG_URL"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Mint candidate ID token
        id: id_token
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_URL }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Verify private preview response without writes
        shell: bash
        env:
          ID_TOKEN: ${{ steps.id_token.outputs.id_token }}
          TAG_URL: ${{ steps.verify.outputs.tag_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          PAGE_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/page.html" --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$TAG_URL/ai-arman/internal-preview")"
          test "$PAGE_CODE" = "200"
          grep -F 'AI Arman – intern testyta' "$RUNNER_TEMP/page.html" >/dev/null

      - name: Publish observation summary
        shell: bash
        env:
          CANDIDATE: ${{ steps.verify.outputs.candidate }}
          TAG_URL: ${{ steps.verify.outputs.tag_url }}
        run: |
          {
            echo '## AI Arman internal preview observation'
            echo
            echo "- Candidate revision: \`$CANDIDATE\`"
            echo "- Private preview URL: \`$TAG_URL/ai-arman/internal-preview\`"
            echo '- Candidate traffic: 0%'
            echo '- Positive live traffic: 99/1'
            echo '- Service max instances: 2'
            echo '- Public IAM: absent'
            echo '- Diagnostics: enabled only on candidate'
            echo '- Promotion: OFF'
            echo '- Private page authenticated GET: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
