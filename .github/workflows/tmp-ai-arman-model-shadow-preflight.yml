name: Temporary AI Arman model shadow preflight

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-model-shadow-preflight.yml

permissions:
  contents: read

jobs:
  model-shadow-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_ARMAN_OPENAI_MODEL: gpt-5-mini
      AI_ARMAN_MODEL_INTERPRETATION_ENABLED: 'true'
      AI_ARMAN_MODEL_SHADOW_ENABLED: 'true'
      AI_ARMAN_MODEL_PROMOTION_ENABLED: 'false'
      AI_ARMAN_MODEL_INTERPRETATION_TIMEOUT_MS: '10000'
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify source before provider test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test -- --runInBand
          npm run build

      - name: Check model credential presence without exposing secret
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY_PRESENT=true"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "OPENAI_API_KEY_PRESENT=false"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run synthetic Responses API interpretation smoke
        if: steps.credential.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { AiArmanModelInterpretationClient } = require('./dist/ai-arman/model/model-interpretation.client.js');

          const samples = [
            {
              name: 'haircare_recommendation',
              text: 'Jag behöver ett schampo för tunt färgat hår som blir fett snabbt men har torra längder.',
              expected: 'product_recommendation',
              identity: false,
            },
            {
              name: 'tracking_order',
              text: 'Var är mitt paket för order 90250?',
              expected: 'tracking_status',
              identity: true,
            },
            {
              name: 'claim_wrong_product',
              text: 'Jag fick fel produkt i min beställning och behöver hjälp.',
              expected: 'claim_help',
              identity: true,
            },
          ];

          (async () => {
            const client = new AiArmanModelInterpretationClient();
            let totalInput = 0;
            let totalOutput = 0;
            for (const sample of samples) {
              const result = await client.interpret({ text: sample.text });
              if (!result.ok) {
                throw new Error(`${sample.name}: ${result.error}`);
              }
              if (result.candidate.primaryIntent !== sample.expected) {
                throw new Error(`${sample.name}: expected ${sample.expected}, got ${result.candidate.primaryIntent}`);
              }
              if (result.candidate.requiresIdentity !== sample.identity) {
                throw new Error(`${sample.name}: requiresIdentity mismatch`);
              }
              totalInput += result.usage.inputTokens;
              totalOutput += result.usage.outputTokens;
              console.log(`MODEL_SMOKE_${sample.name}=PASS intent=${result.candidate.primaryIntent} inputTokens=${result.usage.inputTokens} outputTokens=${result.usage.outputTokens}`);
            }

            const estimatedCostUsd = (totalInput * 0.25 / 1_000_000) + (totalOutput * 2.00 / 1_000_000);
            console.log(`MODEL_SMOKE_TOTAL_INPUT_TOKENS=${totalInput}`);
            console.log(`MODEL_SMOKE_TOTAL_OUTPUT_TOKENS=${totalOutput}`);
            console.log(`MODEL_SMOKE_ESTIMATED_COST_USD=${estimatedCostUsd.toFixed(6)}`);
            console.log('MODEL_PROMOTION_ENABLED=false');
            console.log('MODEL_SMOKE_RESULT=PASS');
          })().catch((error) => {
            console.error(`MODEL_SMOKE_RESULT=FAIL ${error instanceof Error ? error.message : String(error)}`);
            process.exit(1);
          });
          NODE

      - name: Report provider test blocked by missing credential
        if: steps.credential.outputs.present != 'true'
        shell: bash
        run: |
          echo "MODEL_SMOKE_RESULT=BLOCKED_NO_OPENAI_API_KEY"
          echo "No model request was sent."

      - name: Summary
        if: always()
        shell: bash
        env:
          KEY_PRESENT: ${{ steps.credential.outputs.present }}
        run: |
          {
            echo "## AI Arman model shadow preflight"
            echo
            echo "- Source tests/build: completed before credential check"
            echo "- Model: gpt-5-mini"
            echo "- Synthetic prompts only"
            echo "- Promotion: disabled"
            echo "- Customer traffic: none"
            echo "- Cloud Run mutation: none"
            echo "- OpenAI credential present: ${KEY_PRESENT:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
