name: Temporary AI Arman dependency audit

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-dependency-audit.yml

permissions:
  contents: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Analyze remediation without changing lockfile
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > runtime-audit.json
          npm audit --json > full-audit.json
          npm audit fix --omit=dev --dry-run --json > runtime-fix-dry-run.json
          npm audit fix --dry-run --json > full-fix-dry-run.json
          npm outdated --json > outdated.json
          set -e
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const read = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return {}; } };
          const runtime = read('runtime-audit.json');
          const full = read('full-audit.json');
          const runtimeFix = read('runtime-fix-dry-run.json');
          const fullFix = read('full-fix-dry-run.json');
          const outdated = read('outdated.json');
          const lock = read('package-lock.json');

          function installedVersion(name) {
            return lock.packages?.[`node_modules/${name}`]?.version || null;
          }
          function advisorySummary(report) {
            return Object.entries(report.vulnerabilities || {}).map(([name, v]) => ({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              installed: installedVersion(name),
              range: v.range,
              fixAvailable: v.fixAvailable,
              via: (v.via || []).map(x => typeof x === 'string' ? x : ({
                name: x.name,
                severity: x.severity,
                title: x.title,
                range: x.range,
                url: x.url,
                cvss: x.cvss?.score ?? null
              }))
            }));
          }
          function fixSummary(report) {
            return {
              added: report.added ?? null,
              removed: report.removed ?? null,
              changed: report.changed ?? null,
              audited: report.audited ?? null,
              metadata: report.metadata ?? null
            };
          }
          const directNames = Object.keys(lock.packages?.['']?.dependencies || {});
          const directCurrent = {};
          for (const name of directNames) directCurrent[name] = installedVersion(name);

          let candidateTree = null;
          try {
            const copy = '/tmp/audit-remediation';
            cp.execSync(`rm -rf ${copy} && mkdir -p ${copy} && cp package.json package-lock.json ${copy}/`);
            cp.execSync('npm install --package-lock-only --ignore-scripts --audit=false', { cwd: copy, stdio: 'ignore' });
            const nextLock = read(`${copy}/package-lock.json`);
            const changedDirect = [];
            for (const name of directNames) {
              const before = directCurrent[name];
              const after = nextLock.packages?.[`node_modules/${name}`]?.version || null;
              if (before !== after) changedDirect.push({ name, before, after });
            }
            candidateTree = { changedDirect };
          } catch (e) {
            candidateTree = { error: e.message };
          }

          const summary = {
            generatedAt: new Date().toISOString(),
            sourceSha: process.env.GITHUB_SHA,
            runtimeCounts: runtime.metadata?.vulnerabilities || {},
            fullCounts: full.metadata?.vulnerabilities || {},
            runtimeAdvisories: advisorySummary(runtime),
            fullOnlyAdvisories: advisorySummary(full).filter(x => !(runtime.vulnerabilities || {})[x.name]),
            runtimeFixDryRun: fixSummary(runtimeFix),
            fullFixDryRun: fixSummary(fullFix),
            directOutdated: Object.fromEntries(Object.entries(outdated).filter(([name]) => directNames.includes(name))),
            packageLockRefreshCandidate: candidateTree
          };
          fs.writeFileSync('.github/tmp-ai-arman-dependency-remediation-summary.json', JSON.stringify(summary, null, 2) + '\n');
          NODE

      - name: Commit temporary remediation summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp-ai-arman-dependency-remediation-summary.json
          git commit -m "Capture temporary dependency remediation summary"
          git push
