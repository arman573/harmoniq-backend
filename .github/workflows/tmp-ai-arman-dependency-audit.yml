name: Temporary AI Arman dependency audit

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-dependency-audit.yml

permissions:
  contents: write

jobs:
  apply-runtime-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update verified dependency set in lockfile only
        shell: bash
        run: |
          npm update @nestjs/common @nestjs/core @nestjs/platform-express @nestjs/typeorm pg typeorm multer brace-expansion qs body-parser --package-lock-only --ignore-scripts --audit=false
          git diff --exit-code -- package.json
          npm ci --ignore-scripts
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/@nestjs/platform-express'].version!=='11.2.1') process.exit(1); if(p.packages['node_modules/typeorm'].version!=='0.3.31') process.exit(1); if(p.packages['node_modules/multer'].version!=='2.2.0') process.exit(1);"
          npm audit --omit=dev --audit-level=low

      - name: Commit package-lock remediation only
        shell: bash
        run: |
          git status --short
          test -z "$(git status --short | grep -v '^ M package-lock.json$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Remediate AI Arman runtime dependency vulnerabilities"
          git push origin HEAD:feature/ai-arman-foundation-v1
