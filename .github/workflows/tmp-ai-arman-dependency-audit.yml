name: Temporary AI Arman dependency audit

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-dependency-audit.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Capture audits and dependency paths
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > runtime-audit.json
          npm audit --json > full-audit.json
          set -e
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const runtime = JSON.parse(fs.readFileSync('runtime-audit.json', 'utf8'));
          const full = JSON.parse(fs.readFileSync('full-audit.json', 'utf8'));
          const names = new Set();
          for (const report of [runtime, full]) {
            for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
              if (['moderate', 'high', 'critical'].includes(v.severity)) names.add(name);
            }
          }
          const dependencyPaths = {};
          for (const name of [...names].sort()) {
            try {
              dependencyPaths[name] = execSync(`npm ls ${JSON.stringify(name)} --all --json`, { encoding: 'utf8' });
            } catch (error) {
              dependencyPaths[name] = error.stdout || error.message;
            }
          }
          fs.writeFileSync('.github/tmp-ai-arman-dependency-audit-report.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            sourceSha: process.env.GITHUB_SHA,
            runtime,
            full,
            dependencyPaths
          }, null, 2) + '\n');
          NODE

      - name: Commit temporary audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp-ai-arman-dependency-audit-report.json
          git commit -m "Capture temporary AI Arman dependency audit report"
          git push
