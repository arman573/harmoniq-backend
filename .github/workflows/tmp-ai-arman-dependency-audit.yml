name: Temporary AI Arman dependency audit

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-dependency-audit.yml

permissions:
  contents: write

jobs:
  dev-remediation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test remaining dev/build remediation in isolated copy
        shell: bash
        run: |
          rm -rf /tmp/ai-arman-dev-remediation
          mkdir -p /tmp/ai-arman-dev-remediation
          cp package.json package-lock.json /tmp/ai-arman-dev-remediation/
          cd /tmp/ai-arman-dev-remediation
          npm update @babel/core fast-uri form-data js-yaml brace-expansion --package-lock-only --ignore-scripts --audit=false
          npm ci --ignore-scripts
          set +e
          npm audit --omit=dev --json > runtime-after.json
          npm audit --json > full-after.json
          set -e
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + '/package-lock.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const runtime = JSON.parse(fs.readFileSync('runtime-after.json', 'utf8'));
          const full = JSON.parse(fs.readFileSync('full-after.json', 'utf8'));
          const changed = [];
          const keys = new Set([...Object.keys(before.packages || {}), ...Object.keys(after.packages || {})]);
          for (const key of [...keys].sort()) {
            const a = before.packages?.[key]?.version || null;
            const b = after.packages?.[key]?.version || null;
            if (a !== b) changed.push({ package: key.replace(/^node_modules\//,''), before: a, after: b });
          }
          const summary = {
            generatedAt: new Date().toISOString(),
            sourceSha: process.env.GITHUB_SHA,
            changedPackages: changed,
            runtimeCountsAfter: runtime.metadata?.vulnerabilities || {},
            runtimeRemaining: Object.entries(runtime.vulnerabilities || {}).map(([name,v]) => ({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable})),
            fullCountsAfter: full.metadata?.vulnerabilities || {},
            fullRemaining: Object.entries(full.vulnerabilities || {}).map(([name,v]) => ({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))
          };
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/.github/tmp-ai-arman-dev-remediation-test.json', JSON.stringify(summary, null, 2) + '\n');
          NODE

      - name: Commit temporary isolated test result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp-ai-arman-dev-remediation-test.json
          git commit -m "Capture isolated dev dependency remediation test"
          git push
