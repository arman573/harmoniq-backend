name: Temporary AI Arman dependency audit

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-dependency-audit.yml

permissions:
  contents: write

jobs:
  apply-dev-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update verified dev/build dependency set in lockfile only
        shell: bash
        run: |
          npm update @babel/core fast-uri form-data js-yaml brace-expansion --package-lock-only --ignore-scripts --audit=false
          git diff --exit-code -- package.json
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=low

      - name: Commit package-lock remediation only
        shell: bash
        run: |
          git status --short
          test -z "$(git status --short | grep -v '^ M package-lock.json$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Remediate AI Arman dev dependency vulnerabilities"
          git push origin HEAD:feature/ai-arman-foundation-v1
