name: Verify focused AI Arman full admin chain once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  AI_SERVICE: harmoniq-ai-arman-beta0
  RETURNS_SERVICE: harmoniq-returns-api
  AI_SOURCE_SHA: d7d56949eb3c4c9985df73beb52001665459cba8
  RETURNS_SOURCE_REVISION: harmoniq-returns-api-aidiag-5beef7e5-4
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  RESULT_PATH: docs/ai-arman/FULL_ADMIN_FOCUSED_CHAIN_LATEST.md

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify focused AI Arman full admin chain once'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AI_SOURCE_SHA }}
          fetch-depth: 1
      - name: Guard frozen functional source
        run: test "$(git rev-parse HEAD)" = "$AI_SOURCE_SHA"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Snapshot protected services
        id: before
        shell: bash
        run: |
          set -euo pipefail
          for service in "$AI_SERVICE" "$RETURNS_SERVICE"; do
            gcloud run services describe "$service" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/$service-before.json"
            jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.revisionName)' "$RUNNER_TEMP/$service-before.json" > "$RUNNER_TEMP/$service-positive-before.json"
          done
          AI_CANONICAL_URL="$(jq -r '.status.url' "$RUNNER_TEMP/$AI_SERVICE-before.json")"
          RETURNS_CANONICAL_URL="$(jq -r '.status.url' "$RUNNER_TEMP/$RETURNS_SERVICE-before.json")"
          AI_MAX="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/$AI_SERVICE-before.json")"
          echo "ai_url=$AI_CANONICAL_URL" >> "$GITHUB_OUTPUT"
          echo "returns_url=$RETURNS_CANONICAL_URL" >> "$GITHUB_OUTPUT"
          echo "ai_max=$AI_MAX" >> "$GITHUB_OUTPUT"
          gcloud run revisions describe "$RETURNS_SOURCE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/returns-source.json"
          RETURNS_IMAGE="$(jq -r '.spec.containers[0].image // empty' "$RUNNER_TEMP/returns-source.json")"
          test -n "$RETURNS_IMAGE"
          echo "returns_image=$RETURNS_IMAGE" >> "$GITHUB_OUTPUT"
      - name: Generate ephemeral gateway token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Deploy zero traffic returns gateway candidate
        id: returns_deploy
        continue-on-error: true
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          IMAGE: ${{ steps.before.outputs.returns_image }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="aifocused-${GITHUB_RUN_NUMBER}"
          gcloud run deploy "$RETURNS_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --platform managed \
            --image "$IMAGE" \
            --revision-suffix "aifoc-${AI_SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}" \
            --tag "$TAG" --no-traffic \
            --update-env-vars "AI_ARMAN_FULL_ADMIN_ENABLED=true,AI_ARMAN_FULL_ADMIN_WRITE_ENABLED=false,AI_ARMAN_FULL_ADMIN_ACCESS_TOKEN=$TOKEN,AI_ARMAN_FULL_ADMIN_TIMEOUT_MS=30000" \
            --quiet
          gcloud run services describe "$RETURNS_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/returns-deployed.json"
          REV="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/returns-deployed.json" | head -n1)"
          URL="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/returns-deployed.json" | head -n1)"
          test -n "$REV"; test -n "$URL"
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/returns-deployed.json")" = '0'
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Build immutable AI image
        id: image
        if: steps.returns_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/harmoniq-containers/$AI_SERVICE:focused-full-admin-${AI_SOURCE_SHA:0:12}-$GITHUB_RUN_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f Dockerfile.ai-arman-candidate -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$REGION-docker.pkg.dev/$PROJECT_ID/harmoniq-containers/$AI_SERVICE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Deploy private zero traffic AI candidate
        id: ai_deploy
        if: steps.returns_deploy.outcome == 'success' && steps.image.outcome == 'success'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TOKEN: ${{ steps.token.outputs.token }}
          RETURNS_URL: ${{ steps.returns_deploy.outputs.url }}
          RETURNS_AUDIENCE: ${{ steps.before.outputs.returns_url }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="focusedadmin-${AI_SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}"
          gcloud run deploy "$AI_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --platform managed \
            --image "$IMAGE" \
            --revision-suffix "faf-${AI_SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}" \
            --tag "$TAG" --no-traffic --cpu 1 --memory 256Mi --concurrency 1 --timeout 30 \
            --update-env-vars "AI_ARMAN_ADMIN_ASSISTANT_ENABLED=true,AI_ARMAN_ADMIN_LEARNING_ENABLED=false,AI_ARMAN_ADMIN_ASSISTANT_TIMEOUT_MS=20000,AI_ARMAN_MODEL_INTERPRETATION_ENABLED=true,AI_ARMAN_OPENAI_MODEL=gpt-5-mini,AI_ARMAN_MODEL_INPUT_COST_USD_PER_MILLION_TOKENS=0.25,AI_ARMAN_MODEL_OUTPUT_COST_USD_PER_MILLION_TOKENS=2.0,AI_ARMAN_RETURNS_ADMIN_GATEWAY_ENABLED=true,AI_ARMAN_RETURNS_ADMIN_GATEWAY_BASE_URL=$RETURNS_URL,AI_ARMAN_RETURNS_ADMIN_GATEWAY_AUDIENCE=$RETURNS_AUDIENCE,AI_ARMAN_RETURNS_ADMIN_GATEWAY_ACCESS_TOKEN=$TOKEN,AI_ARMAN_RETURNS_ADMIN_WRITE_ENABLED=false,AI_ARMAN_MODEL_PROMOTION_ENABLED=false,AI_ARMAN_MODEL_SHADOW_ENABLED=false" \
            --quiet
          gcloud run services describe "$AI_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai-deployed.json"
          REV="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/ai-deployed.json" | head -n1)"
          URL="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/ai-deployed.json" | head -n1)"
          test -n "$REV"; test -n "$URL"
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/ai-deployed.json")" = '0'
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        id: idtoken
        if: steps.ai_deploy.outcome == 'success'
        continue-on-error: true
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.before.outputs.ai_url }}
          create_credentials_file: false
      - name: Probe enriched real read
        id: read_probe
        if: steps.ai_deploy.outcome == 'success' && steps.idtoken.outcome == 'success'
        continue-on-error: true
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          AI_URL: ${{ steps.ai_deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/read.json" <<'JSON'
          {"caseId":"HQR-2494077","caseType":"support","status":"waiting_admin","adminQuestion":"Kontrollera order, leverans och tracking för ärendet. Gör kontrollen själv.","messages":[],"discussion":[]}
          JSON
          STATUS="$(curl --max-time 40 -sS -o "$RUNNER_TEMP/read-response.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/read.json" "$AI_URL/ai-arman/internal/admin-assistant/assist" || true)"
          READ_OK=false
          CASE_OK=false
          ORDER_OK=false
          WRITE_EXEC=false
          if [[ "$STATUS" == 200 || "$STATUS" == 201 ]]; then
            jq -e '.ok==true' "$RUNNER_TEMP/read-response.json" >/dev/null 2>&1 && READ_OK=true || true
            jq -e '([.adminActions[]? | select(.action=="case.read" and .ok==true)] | length)>=1' "$RUNNER_TEMP/read-response.json" >/dev/null 2>&1 && CASE_OK=true || true
            jq -e '([.adminActions[]? | select(.action=="case.order_context.read" and .ok==true)] | length)>=1' "$RUNNER_TEMP/read-response.json" >/dev/null 2>&1 && ORDER_OK=true || true
            jq -e '.writeExecuted==true' "$RUNNER_TEMP/read-response.json" >/dev/null 2>&1 && WRITE_EXEC=true || true
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "read_ok=$READ_OK" >> "$GITHUB_OUTPUT"
          echo "case_ok=$CASE_OK" >> "$GITHUB_OUTPUT"
          echo "order_ok=$ORDER_OK" >> "$GITHUB_OUTPUT"
          echo "write_exec=$WRITE_EXEC" >> "$GITHUB_OUTPUT"
          test "$READ_OK" = true
          test "$CASE_OK" = true
          test "$ORDER_OK" = true
          test "$WRITE_EXEC" = false
      - name: Probe write kill switch
        id: write_probe
        if: steps.read_probe.outcome == 'success'
        continue-on-error: true
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          AI_URL: ${{ steps.ai_deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/write.json" <<'JSON'
          {"caseId":"HQR-2494077","caseType":"support","status":"waiting_admin","adminQuestion":"Pausa HQR-2494077.","messages":[],"discussion":[]}
          JSON
          STATUS="$(curl --max-time 40 -sS -o "$RUNNER_TEMP/write-response.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/write.json" "$AI_URL/ai-arman/internal/admin-assistant/assist" || true)"
          BLOCKED=false
          if [[ "$STATUS" == 200 || "$STATUS" == 201 ]]; then
            jq -e '.writeExecuted==false and ([.adminActions[]? | select(.action=="case.pause" and .ok==false and .error=="returns_admin_gateway_write_disabled")] | length)==1' "$RUNNER_TEMP/write-response.json" >/dev/null 2>&1 && BLOCKED=true || true
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"
          test "$BLOCKED" = true
      - name: Verify positive traffic unchanged
        id: traffic
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PASS=true
          for service in "$AI_SERVICE" "$RETURNS_SERVICE"; do
            gcloud run services describe "$service" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/$service-final.json"
            jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.revisionName)' "$RUNNER_TEMP/$service-final.json" > "$RUNNER_TEMP/$service-positive-final.json"
            cmp "$RUNNER_TEMP/$service-positive-before.json" "$RUNNER_TEMP/$service-positive-final.json" || PASS=false
          done
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          test "$PASS" = true
      - name: Record focused chain checkpoint
        if: always()
        shell: bash
        env:
          RETURNS_DEPLOY: ${{ steps.returns_deploy.outcome }}
          RETURNS_REV: ${{ steps.returns_deploy.outputs.revision }}
          IMAGE_BUILD: ${{ steps.image.outcome }}
          AI_DEPLOY: ${{ steps.ai_deploy.outcome }}
          AI_REV: ${{ steps.ai_deploy.outputs.revision }}
          IDTOKEN: ${{ steps.idtoken.outcome }}
          READ_PROBE: ${{ steps.read_probe.outcome }}
          READ_HTTP: ${{ steps.read_probe.outputs.status }}
          CASE_OK: ${{ steps.read_probe.outputs.case_ok }}
          ORDER_OK: ${{ steps.read_probe.outputs.order_ok }}
          WRITE_PROBE: ${{ steps.write_probe.outcome }}
          WRITE_HTTP: ${{ steps.write_probe.outputs.status }}
          WRITE_BLOCKED: ${{ steps.write_probe.outputs.blocked }}
          TRAFFIC: ${{ steps.traffic.outputs.pass }}
        run: |
          set -euo pipefail
          OVERALL=FAIL
          if [[ "$RETURNS_DEPLOY" == success && "$IMAGE_BUILD" == success && "$AI_DEPLOY" == success && "$IDTOKEN" == success && "$READ_PROBE" == success && "$WRITE_PROBE" == success && "$TRAFFIC" == true ]]; then OVERALL=PASS; fi
          git fetch origin feature/ai-arman-foundation-v1
          git checkout -B result origin/feature/ai-arman-foundation-v1
          cat > "$RESULT_PATH" <<EOF
          # AI Arman focused full-admin chain

          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Frozen functional AI source: \`$AI_SOURCE_SHA\`
          - Overall: **$OVERALL**
          - Returns candidate deploy: **$RETURNS_DEPLOY**
          - Returns candidate revision: \`${RETURNS_REV:-none}\`
          - AI image build: **${IMAGE_BUILD:-skipped}**
          - AI candidate deploy: **${AI_DEPLOY:-skipped}**
          - AI candidate revision: \`${AI_REV:-none}\`
          - Private AI invocation token step: **${IDTOKEN:-skipped}**
          - HQR-2494077 read probe: **${READ_PROBE:-skipped}** HTTP \`${READ_HTTP:-none}\`
          - case.read ok: **${CASE_OK:-false}**
          - case.order_context.read ok: **${ORDER_OK:-false}**
          - Explicit pause probe: **${WRITE_PROBE:-skipped}** HTTP \`${WRITE_HTTP:-none}\`
          - Pause blocked before mutation: **${WRITE_BLOCKED:-false}**
          - AI-side writes enabled: **false**
          - Returns-side writes enabled: **false**
          - Production traffic unchanged: **${TRAFFIC:-false}**
          - Secret values recorded: **false**
          - Real customer writes executed by verifier: **none**
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record focused AI Arman full admin chain'
          git push origin HEAD:feature/ai-arman-foundation-v1
          test "$OVERALL" = PASS
