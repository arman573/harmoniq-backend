name: AI Arman internal preview verify push once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-internal-preview-verify-push-once
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  SERVICE_URL: https://harmoniq-ai-arman-beta0-cw6q5ekseq-lz.a.run.app
  CANDIDATE_REVISION: harmoniq-ai-arman-beta0-preview-68ae2e0c-1
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  RESULT_PATH: docs/ai-arman/INTERNAL_PREVIEW_CANDIDATE_LATEST.md

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify internal preview candidate once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - name: Authenticate push WIF
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify candidate configuration
        id: config
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run revisions describe "$CANDIDATE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/candidate.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"

          PUBLIC_IAM=false
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then PUBLIC_IAM=true; fi
          test "$PUBLIC_IAM" = "false"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service.json")" = "2"
          jq -e '[.status.traffic[]? | select((.percent // 0) > 0) | (.percent // 0)] | sort == [1,99]' "$RUNNER_TEMP/service.json" >/dev/null
          test "$(jq -r --arg rev "$CANDIDATE_REVISION" '[.status.traffic[]? | select(.revisionName == $rev) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")" = "0"

          env_value() { jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name == $n) | .value // empty' "$RUNNER_TEMP/candidate.json"; }
          test "$(env_value AI_ARMAN_INTERNAL_PREVIEW_DIAGNOSTICS_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_INTERPRETATION_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_DURABLE_AUDIT_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_PROMOTION_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_WIDGET_PREVIEW_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_MAX_CALLS_PER_MINUTE)" = "1"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_MAX_CONCURRENT_CALLS)" = "1"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_MAX_TOKENS_PER_CALL)" = "1024"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_MAX_COST_USD_PER_CALL)" = "0.005"

          TAG_URL="$(jq -r --arg rev "$CANDIDATE_REVISION" '.status.traffic[]? | select(.revisionName == $rev and (.tag // "") != "") | .url // empty' "$RUNNER_TEMP/service.json" | head -n1)"
          test -n "$TAG_URL"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Mint canonical-audience ID token
        id: token
        if: steps.config.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_URL }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Verify private page and real diagnostics
        id: runtime
        if: steps.token.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          ID_TOKEN: ${{ steps.token.outputs.id_token }}
          TAG_URL: ${{ steps.config.outputs.tag_url }}
        run: |
          set -euo pipefail
          test -n "$ID_TOKEN"
          test -n "$TAG_URL"
          echo "::add-mask::$ID_TOKEN"

          PAGE_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/page.html" --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$TAG_URL/ai-arman/internal-preview")"
          test "$PAGE_CODE" = "200"
          grep -F 'AI Arman – intern testyta' "$RUNNER_TEMP/page.html" >/dev/null
          if grep -Eqi 'systemPrompt|promptVersion|modelVersion|rawModelText|OPENAI_API_KEY|\.innerHTML' "$RUNNER_TEMP/page.html"; then exit 1; fi

          DIAG_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/diagnostics.json" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"contractVersion\":\"ai-arman-chat-v1\",\"clientMessageId\":\"verify-${GITHUB_RUN_ID}\",\"message\":{\"text\":\"Jag söker ett schampo för torrt hår\"},\"context\":{\"locale\":\"sv-SE\",\"channel\":\"internal_preview\"}}" \
            "$TAG_URL/ai-arman/internal-preview/diagnostics")"
          test "$DIAG_CODE" = "200"
          jq -e '.diagnosticsVersion == "ai-arman-internal-preview-diagnostics-v1" and .deterministic.backendAuthority == "backend_policy" and .modelShadow.providerStatus == "completed" and .safety.promotionEnabled == false and .safety.modelAffectsCustomerResponse == false and .safety.modelAffectsState == false and .safety.modelAffectsTools == false and .safety.writesExecuted == false and .safety.productionActionsEnabled == false and .safety.modelOutputExposed == false and .safety.promptExposed == false' "$RUNNER_TEMP/diagnostics.json" >/dev/null
          if grep -Eqi 'systemPrompt|promptVersion|modelVersion|rawModelText|OPENAI_API_KEY' "$RUNNER_TEMP/diagnostics.json"; then exit 1; fi

          echo "model_intent=$(jq -r '.modelShadow.primaryIntent // "null"' "$RUNNER_TEMP/diagnostics.json")" >> "$GITHUB_OUTPUT"
          echo "backend_intent=$(jq -r '.deterministic.primaryIntent // "null"' "$RUNNER_TEMP/diagnostics.json")" >> "$GITHUB_OUTPUT"
          echo "intent_match=$(jq -r '.modelShadow.primaryIntentMatch // "null"' "$RUNNER_TEMP/diagnostics.json")" >> "$GITHUB_OUTPUT"
          echo "confidence=$(jq -r '.modelShadow.confidence // "null"' "$RUNNER_TEMP/diagnostics.json")" >> "$GITHUB_OUTPUT"
          echo "tokens=$(jq -r '.modelShadow.totalTokens // "null"' "$RUNNER_TEMP/diagnostics.json")" >> "$GITHUB_OUTPUT"
          echo "cost=$(jq -r '.modelShadow.estimatedCostUsd // "null"' "$RUNNER_TEMP/diagnostics.json")" >> "$GITHUB_OUTPUT"
          echo "backend_route=$(jq -r '.deterministic.backendRoute // "null"' "$RUNNER_TEMP/diagnostics.json")" >> "$GITHUB_OUTPUT"

      - name: Write verification checkpoint
        if: always()
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          TAG_URL: ${{ steps.config.outputs.tag_url }}
          MODEL_INTENT: ${{ steps.runtime.outputs.model_intent }}
          BACKEND_INTENT: ${{ steps.runtime.outputs.backend_intent }}
          INTENT_MATCH: ${{ steps.runtime.outputs.intent_match }}
          CONFIDENCE: ${{ steps.runtime.outputs.confidence }}
          TOKENS: ${{ steps.runtime.outputs.tokens }}
          COST: ${{ steps.runtime.outputs.cost }}
          BACKEND_ROUTE: ${{ steps.runtime.outputs.backend_route }}
        run: |
          set -euo pipefail
          OVERALL=FAIL
          if [ "$AUTH_OUTCOME" = success ] && [ "$CONFIG_OUTCOME" = success ] && [ "$TOKEN_OUTCOME" = success ] && [ "$RUNTIME_OUTCOME" = success ]; then OVERALL=PASS; fi
          cat > "$RESULT_PATH" <<EOF
          # AI Arman – private internal preview candidate latest

          - Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Overall: **$OVERALL**
          - Push WIF auth: \`$AUTH_OUTCOME\`
          - Candidate configuration: \`$CONFIG_OUTCOME\`
          - ID-token mint: \`$TOKEN_OUTCOME\`
          - Private runtime smoke: \`$RUNTIME_OUTCOME\`
          - Candidate revision: \`$CANDIDATE_REVISION\`
          - Private tagged preview URL: \`${TAG_URL:-unavailable}/ai-arman/internal-preview\`
          - Candidate traffic: **0%** (required by configuration check)
          - Positive live traffic: **99% / 1%** (required by configuration check)
          - Service max instances: **2** (required by configuration check)
          - Public IAM: **absent** (required by configuration check)
          - Internal diagnostics: **ON only on candidate**
          - Model interpretation/shadow/durable audit: **ON on candidate**
          - Model promotion: **OFF**
          - Existing widget preview: **OFF**
          - Writes / production actions: **OFF**
          - Synthetic model intent: \`${MODEL_INTENT:-unavailable}\`
          - Synthetic backend intent: \`${BACKEND_INTENT:-unavailable}\`
          - Synthetic primary-intent match: \`${INTENT_MATCH:-unavailable}\`
          - Synthetic confidence: \`${CONFIDENCE:-unavailable}\`
          - Synthetic backend route: \`${BACKEND_ROUTE:-unavailable}\`
          - Synthetic provider tokens: \`${TOKENS:-unavailable}\`
          - Synthetic estimated cost USD: \`${COST:-unavailable}\`

          No raw model text, prompts, secrets, customer PII, production writes, promotion, public IAM, or live traffic change are permitted by this verification.
          EOF

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_PATH"
          git commit -m 'Record internal preview candidate verification'
          git push origin HEAD:feature/ai-arman-foundation-v1
