name: AI Arman internal preview final verify once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  SERVICE_URL: https://harmoniq-ai-arman-beta0-cw6q5ekseq-lz.a.run.app
  CANDIDATE_REVISION: harmoniq-ai-arman-beta0-preview-68ae2e0c-1
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  RESULT_PATH: docs/ai-arman/INTERNAL_PREVIEW_CANDIDATE_LATEST.md

jobs:
  verify:
    if: github.event.head_commit.message == 'Final verify internal preview candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify immutable candidate boundary
        id: target
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run revisions describe "$CANDIDATE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/candidate.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          ! jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service.json")" = "2"
          jq -e '[.status.traffic[]? | select((.percent // 0) > 0) | (.percent // 0)] | sort == [1,99]' "$RUNNER_TEMP/service.json" >/dev/null
          test "$(jq -r --arg rev "$CANDIDATE_REVISION" '[.status.traffic[]? | select(.revisionName == $rev) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")" = "0"
          env_value() { jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name == $n) | .value // empty' "$RUNNER_TEMP/candidate.json"; }
          test "$(env_value AI_ARMAN_INTERNAL_PREVIEW_DIAGNOSTICS_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_INTERPRETATION_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_DURABLE_AUDIT_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_MODEL_PROMOTION_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_WIDGET_PREVIEW_ENABLED)" = "false"
          TAG_URL="$(jq -r --arg rev "$CANDIDATE_REVISION" '.status.traffic[]? | select(.revisionName == $rev and (.tag // "") != "") | .url // empty' "$RUNNER_TEMP/service.json" | head -n1)"
          test -n "$TAG_URL"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Mint ID token
        id: token
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_URL }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Run private page and model diagnostics smoke
        id: runtime
        shell: bash
        env:
          ID_TOKEN: ${{ steps.token.outputs.id_token }}
          TAG_URL: ${{ steps.target.outputs.tag_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          PAGE_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/page.html" --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$TAG_URL/ai-arman/internal-preview")"
          test "$PAGE_CODE" = "200"
          grep -F 'AI Arman – intern testyta' "$RUNNER_TEMP/page.html" >/dev/null
          DIAG_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/diag.json" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $ID_TOKEN" --header 'Content-Type: application/json' --data "{\"contractVersion\":\"ai-arman-chat-v1\",\"clientMessageId\":\"final-${GITHUB_RUN_ID}\",\"message\":{\"text\":\"Jag söker ett schampo för torrt hår\"},\"context\":{\"locale\":\"sv-SE\",\"channel\":\"internal_preview\"}}" "$TAG_URL/ai-arman/internal-preview/diagnostics")"
          [[ "$DIAG_CODE" =~ ^2[0-9][0-9]$ ]]
          jq -e '.diagnosticsVersion == "ai-arman-internal-preview-diagnostics-v1" and .deterministic.backendAuthority == "backend_policy" and .modelShadow.providerStatus == "completed" and .safety.promotionEnabled == false and .safety.modelAffectsCustomerResponse == false and .safety.modelAffectsState == false and .safety.modelAffectsTools == false and .safety.writesExecuted == false and .safety.productionActionsEnabled == false and .safety.modelOutputExposed == false and .safety.promptExposed == false' "$RUNNER_TEMP/diag.json" >/dev/null
          ! grep -Eqi 'systemPrompt|promptVersion|modelVersion|rawModelText|OPENAI_API_KEY' "$RUNNER_TEMP/diag.json"
          echo "diag_code=$DIAG_CODE" >> "$GITHUB_OUTPUT"
          echo "model_intent=$(jq -r '.modelShadow.primaryIntent' "$RUNNER_TEMP/diag.json")" >> "$GITHUB_OUTPUT"
          echo "backend_intent=$(jq -r '.deterministic.primaryIntent' "$RUNNER_TEMP/diag.json")" >> "$GITHUB_OUTPUT"
          echo "intent_match=$(jq -r '.modelShadow.primaryIntentMatch' "$RUNNER_TEMP/diag.json")" >> "$GITHUB_OUTPUT"
          echo "confidence=$(jq -r '.modelShadow.confidence' "$RUNNER_TEMP/diag.json")" >> "$GITHUB_OUTPUT"
          echo "tokens=$(jq -r '.modelShadow.totalTokens' "$RUNNER_TEMP/diag.json")" >> "$GITHUB_OUTPUT"
          echo "cost=$(jq -r '.modelShadow.estimatedCostUsd' "$RUNNER_TEMP/diag.json")" >> "$GITHUB_OUTPUT"
          echo "route=$(jq -r '.deterministic.backendRoute' "$RUNNER_TEMP/diag.json")" >> "$GITHUB_OUTPUT"

      - name: Write PASS checkpoint
        shell: bash
        env:
          TAG_URL: ${{ steps.target.outputs.tag_url }}
          DIAG_CODE: ${{ steps.runtime.outputs.diag_code }}
          MODEL_INTENT: ${{ steps.runtime.outputs.model_intent }}
          BACKEND_INTENT: ${{ steps.runtime.outputs.backend_intent }}
          INTENT_MATCH: ${{ steps.runtime.outputs.intent_match }}
          CONFIDENCE: ${{ steps.runtime.outputs.confidence }}
          TOKENS: ${{ steps.runtime.outputs.tokens }}
          COST: ${{ steps.runtime.outputs.cost }}
          ROUTE: ${{ steps.runtime.outputs.route }}
        run: |
          cat > "$RESULT_PATH" <<EOF
          # AI Arman – private internal preview candidate latest

          - Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Overall: **PASS**
          - Candidate revision: \`$CANDIDATE_REVISION\`
          - Private tagged preview URL: \`$TAG_URL/ai-arman/internal-preview\`
          - Candidate traffic: **0%**
          - Positive live traffic: **99% / 1%**
          - Service max instances: **2**
          - Public IAM: **absent**
          - Internal diagnostics: **ON only on candidate**
          - Model interpretation/shadow/durable audit: **ON on candidate**
          - Model promotion: **OFF**
          - Existing widget preview: **OFF**
          - Writes / production actions: **OFF**
          - Private preview HTTP: \`200\`
          - Diagnostics HTTP: \`$DIAG_CODE\`
          - Provider status: \`completed\`
          - Synthetic model intent: \`$MODEL_INTENT\`
          - Synthetic backend intent: \`$BACKEND_INTENT\`
          - Synthetic primary-intent match: \`$INTENT_MATCH\`
          - Synthetic model confidence: \`$CONFIDENCE\`
          - Synthetic backend route: \`$ROUTE\`
          - Synthetic provider tokens: \`$TOKENS\`
          - Synthetic estimated cost USD: \`$COST\`

          No raw model text, prompts, secrets, customer PII, production writes, model promotion, public IAM, or live traffic change were used by this verification.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_PATH"
          git commit -m 'Record final internal preview verification'
          git push origin HEAD:feature/ai-arman-foundation-v1
