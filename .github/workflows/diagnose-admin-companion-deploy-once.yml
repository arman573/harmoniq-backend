name: Diagnose compact AI Arman companion deploy once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  actions: read
  contents: write

env:
  RESULT_PATH: docs/ai-arman/ADMIN_COMPANION_DEPLOY_DIAGNOSTIC_LATEST.md

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose compact AI Arman companion deploy once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1

      - name: Find deploy workflow run and failed step
        id: diag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}/actions/workflows/ai-arman-admin-companion-zero-traffic-once.yml/runs?event=push&branch=feature%2Fai-arman-foundation-v1&per_page=10"
          gh api "$API" > "$RUNNER_TEMP/runs.json"
          RUN_ID="$(jq -r '[.workflow_runs[] | select(.head_sha=="66a44109aef3ce2ac0758269fa04d2eae2df6918")] | first | .id // empty' "$RUNNER_TEMP/runs.json")"
          if [[ -z "$RUN_ID" ]]; then
            STATUS=not_found
            CONCLUSION=not_found
            JOB_NAME=none
            FAILED_STEP=none
          else
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest" > "$RUNNER_TEMP/jobs.json"
            STATUS="$(jq -r '[.jobs[]] | first | .status // "unknown"' "$RUNNER_TEMP/jobs.json")"
            CONCLUSION="$(jq -r '[.jobs[]] | first | .conclusion // "none"' "$RUNNER_TEMP/jobs.json")"
            JOB_NAME="$(jq -r '[.jobs[]] | first | .name // "none"' "$RUNNER_TEMP/jobs.json")"
            FAILED_STEP="$(jq -r '[.jobs[].steps[]? | select(.conclusion=="failure") | .name] | first // "none"' "$RUNNER_TEMP/jobs.json")"
          fi
          echo "run_id=${RUN_ID:-none}" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "job=$JOB_NAME" >> "$GITHUB_OUTPUT"
          echo "failed_step=$FAILED_STEP" >> "$GITHUB_OUTPUT"

      - name: Record safe diagnostic
        env:
          RUN_ID: ${{ steps.diag.outputs.run_id }}
          STATUS: ${{ steps.diag.outputs.status }}
          CONCLUSION: ${{ steps.diag.outputs.conclusion }}
          JOB_NAME: ${{ steps.diag.outputs.job }}
          FAILED_STEP: ${{ steps.diag.outputs.failed_step }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RESULT_PATH" <<EOF
          # AI Arman companion deploy diagnostic

          - Checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Trigger commit: \`66a44109aef3ce2ac0758269fa04d2eae2df6918\`
          - Workflow run id: \`$RUN_ID\`
          - Status: \`$STATUS\`
          - Conclusion: \`$CONCLUSION\`
          - Job: \`$JOB_NAME\`
          - Failed step: \`$FAILED_STEP\`
          - No GCP call or mutation performed by this diagnostic.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record compact AI Arman companion deploy diagnostic'
          git push origin HEAD:feature/ai-arman-foundation-v1
