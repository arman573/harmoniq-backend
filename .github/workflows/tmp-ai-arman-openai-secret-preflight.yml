name: Temporary AI Arman OpenAI secret preflight

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-openai-secret-preflight.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com

jobs:
  secret-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate through existing WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Find AI Arman or OpenAI secret resources without reading values
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n 1)"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

          if ! gcloud secrets list --project "$PROJECT_ID" --format='value(name)' > "$RUNNER_TEMP/secret-names.txt" 2> "$RUNNER_TEMP/list-error.txt"; then
            echo "SECRET_MANAGER_LIST_ACCESS=false"
            sed -E 's/(token|key|secret)=[^ ]+/\1=[redacted]/gi' "$RUNNER_TEMP/list-error.txt" || true
            exit 0
          fi

          echo "SECRET_MANAGER_LIST_ACCESS=true"
          MATCHES="$(grep -Ei '(^|[-_])(openai|ai[-_]?arman)([-_]|$)' "$RUNNER_TEMP/secret-names.txt" || true)"
          if [ -z "$MATCHES" ]; then
            echo "AI_ARMAN_OPENAI_SECRET_MATCHES=0"
            exit 0
          fi

          COUNT="$(printf '%s\n' "$MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "AI_ARMAN_OPENAI_SECRET_MATCHES=$COUNT"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "MATCHED_SECRET_RESOURCE=$name"
          done <<< "$MATCHES"

          echo "Secret values were not accessed."
