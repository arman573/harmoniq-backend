name: Temporary AI Arman OpenAI secret preflight

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-openai-secret-preflight.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com

jobs:
  secret-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate through existing WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Inspect current beta0 env names and secret references only
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n 1)"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

          gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > "$RUNNER_TEMP/service.json"

          echo "LIVE_ENV_NAMES_BEGIN"
          jq -r '.spec.template.spec.containers[0].env[]?.name' "$RUNNER_TEMP/service.json" | sort
          echo "LIVE_ENV_NAMES_END"

          OPENAI_ENTRY="$(jq -c '.spec.template.spec.containers[0].env[]? | select(.name == "OPENAI_API_KEY")' "$RUNNER_TEMP/service.json")"
          if [ -z "$OPENAI_ENTRY" ]; then
            echo "LIVE_OPENAI_API_KEY_ENV_PRESENT=false"
          else
            echo "LIVE_OPENAI_API_KEY_ENV_PRESENT=true"
            SECRET_NAME="$(printf '%s' "$OPENAI_ENTRY" | jq -r '.valueFrom.secretKeyRef.name // empty')"
            if [ -n "$SECRET_NAME" ]; then
              echo "LIVE_OPENAI_API_KEY_SOURCE=secret_ref"
              echo "LIVE_OPENAI_SECRET_RESOURCE=$SECRET_NAME"
            else
              echo "LIVE_OPENAI_API_KEY_SOURCE=non_secret_ref"
            fi
          fi

          echo "No environment values or secret payloads were printed."
