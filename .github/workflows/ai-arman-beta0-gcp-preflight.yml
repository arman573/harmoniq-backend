name: AI Arman beta0 GCP preflight

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-beta0-gcp-preflight
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  AI_SERVICE_NAME: harmoniq-ai-arman-beta0
  RETURNS_RUNTIME_SA: 222024985388-compute@developer.gserviceaccount.com
  AI_CANDIDATE_REV: harmoniq-ai-arman-beta0-stklearn-cae86ef8-8
  REQUIRED_REF: refs/heads/feature/ai-arman-foundation-v1
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RESULT_PATH: .github/deploy-status/ai-arman-returns-invoker-readonly-latest.txt

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Inspect AI Arman invoker read only'
    name: Read-only AI Arman invoker provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Enforce exact branch and actor
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$REQUIRED_REF"
          test "$GITHUB_ACTOR" = 'arman573'

      - uses: actions/checkout@v4

      - name: Authenticate dedicated AI Arman deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read private service IAM and candidate state
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n1)" = "$DEPLOY_SERVICE_ACCOUNT"
          gcloud run services describe "$AI_SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run services get-iam-policy "$AI_SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          if jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then
            echo 'AI service unexpectedly public.' >&2
            exit 1
          fi
          MEMBER="serviceAccount:$RETURNS_RUNTIME_SA"
          INVOKER=false
          if jq -e --arg member "$MEMBER" '[.bindings[]? | select(.role=="roles/run.invoker") | .members[]?] | any(.==$member)' "$RUNNER_TEMP/iam.json" >/dev/null; then INVOKER=true; fi
          CANDIDATE_PERCENT="$(jq -r --arg r "$AI_CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")"
          CANDIDATE_TAG="$(jq -r --arg r "$AI_CANDIDATE_REV" '.status.traffic[]? | select(.revisionName==$r) | .tag // empty' "$RUNNER_TEMP/service.json" | head -n1)"
          CANONICAL_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/service.json")"
          test "$CANDIDATE_PERCENT" = '0'
          test "$CANDIDATE_TAG" = 'stock-learning-cae86ef8'
          test -n "$CANONICAL_URL"
          echo "invoker=$INVOKER" >> "$GITHUB_OUTPUT"
          echo "canonical_url=$CANONICAL_URL" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Record sanitized read-only result
        env:
          INVOKER: ${{ steps.inspect.outputs.invoker }}
          CANONICAL_URL: ${{ steps.inspect.outputs.canonical_url }}
          CANDIDATE_TAG: ${{ steps.inspect.outputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RESULT_PATH")"
          cat > "$RESULT_PATH" <<EOF
          overall=success
          inspected_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          service=$AI_SERVICE_NAME
          canonical_url=$CANONICAL_URL
          service_public=false
          returns_runtime_service_account=$RETURNS_RUNTIME_SA
          returns_runtime_has_run_invoker=$INVOKER
          candidate_revision=$AI_CANDIDATE_REV
          candidate_tag=$CANDIDATE_TAG
          candidate_traffic=0
          mutation_performed=false
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman Returns invoker read only [skip ci]'
          git push origin HEAD:feature/ai-arman-foundation-v1
