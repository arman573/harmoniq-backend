name: AI Arman beta0 GCP preflight

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-beta0-gcp-preflight
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  AI_SERVICE_NAME: harmoniq-ai-arman-beta0
  RETURNS_SERVICE_NAME: harmoniq-returns-api
  AI_RUNTIME_SA: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  RETURNS_RUNTIME_SA: 222024985388-compute@developer.gserviceaccount.com
  AI_CANDIDATE_REV: harmoniq-ai-arman-beta0-cpgcs-352e37b7-20
  AI_CANDIDATE_TAG: cpgcs-352e37b7
  RETURNS_CANDIDATE_REV: harmoniq-returns-api-aistock-53
  RETURNS_CANDIDATE_TAG: ai-arman-stock-bridge
  EXPECTED_RETURNS_LIVE_REV: harmoniq-returns-api-trk2494077-1
  CASE_ID: HQR-2493528
  REQUIRED_REF: refs/heads/feature/ai-arman-foundation-v1
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RESULT_PATH: .github/deploy-status/ai-arman-returns-invoker-readonly-latest.txt

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Verify AI Arman reply token parity read only'
    name: Verify reply token parity read only
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Enforce exact branch and actor
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$REQUIRED_REF"
          test "$GITHUB_ACTOR" = 'arman573'

      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1

      - name: Authenticate dedicated AI Arman deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Snapshot exact private zero-traffic candidates and reply configuration
        id: before
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n1)" = "$DEPLOY_SERVICE_ACCOUNT"

          gcloud run services describe "$AI_SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai-before.json"
          gcloud run services get-iam-policy "$AI_SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai-iam.json"
          if jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/ai-iam.json" >/dev/null; then
            echo 'AI service unexpectedly public.' >&2
            exit 1
          fi
          MEMBER="serviceAccount:$RETURNS_RUNTIME_SA"
          jq -e --arg member "$MEMBER" '[.bindings[]? | select(.role=="roles/run.invoker") | .members[]?] | any(.==$member)' "$RUNNER_TEMP/ai-iam.json" >/dev/null
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent:(.percent // 0),tag:(.tag // "")}] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/ai-before.json" > "$RUNNER_TEMP/ai-positive-before.json"

          AI_CANONICAL_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/ai-before.json")"
          AI_TAG_REV="$(jq -r --arg tag "$AI_CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/ai-before.json" | head -n1)"
          AI_TAG_URL="$(jq -r --arg tag "$AI_CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/ai-before.json" | head -n1)"
          test "$AI_TAG_REV" = "$AI_CANDIDATE_REV"
          test -n "$AI_TAG_URL"
          test -n "$AI_CANONICAL_URL"
          test "$(jq -r --arg r "$AI_CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/ai-before.json")" = '0'

          gcloud run revisions describe "$AI_CANDIDATE_REV" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai-candidate.json"
          test "$(jq -r '.spec.serviceAccountName // empty' "$RUNNER_TEMP/ai-candidate.json")" = "$AI_RUNTIME_SA"
          aenv(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' "$RUNNER_TEMP/ai-candidate.json" | head -n1; }
          AI_REPLY_ENABLED="$(aenv AI_ARMAN_ADMIN_REPLY_DRAFT_ENABLED)"
          AI_REPLY_TOKEN="$(aenv AI_ARMAN_ADMIN_REPLY_DRAFT_ACCESS_TOKEN)"
          test "$(aenv AI_ARMAN_CUSTOMER_ADMIN_ENABLED)" = 'true'
          test "$(aenv AI_ARMAN_CUSTOMER_PRESENTATION_GCS_BUCKET)" = 'harmoniq-210513-ai-arman-customer-presentation'
          test "$(aenv AI_ARMAN_CUSTOMER_PRESENTATION_GCS_OBJECT)" = 'ai-arman/customer-presentation-v1.json'
          if [ -n "$AI_REPLY_TOKEN" ]; then echo "::add-mask::$AI_REPLY_TOKEN"; fi

          gcloud run services describe "$RETURNS_SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/returns-before.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent:(.percent // 0),tag:(.tag // "")}] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/returns-before.json" > "$RUNNER_TEMP/returns-positive-before.json"
          test "$(jq -r '[.status.traffic[]? | select((.percent // 0)>0)] | if length==1 and .[0].percent==100 then .[0].revisionName else empty end' "$RUNNER_TEMP/returns-before.json")" = "$EXPECTED_RETURNS_LIVE_REV"
          RETURNS_TAG_REV="$(jq -r --arg tag "$RETURNS_CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/returns-before.json" | head -n1)"
          RETURNS_TAG_URL="$(jq -r --arg tag "$RETURNS_CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/returns-before.json" | head -n1)"
          test "$RETURNS_TAG_REV" = "$RETURNS_CANDIDATE_REV"
          test -n "$RETURNS_TAG_URL"
          test "$(jq -r --arg r "$RETURNS_CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/returns-before.json")" = '0'

          gcloud run revisions describe "$RETURNS_CANDIDATE_REV" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/returns-candidate.json"
          test "$(jq -r '.spec.serviceAccountName // empty' "$RUNNER_TEMP/returns-candidate.json")" = "$RETURNS_RUNTIME_SA"
          renv(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' "$RUNNER_TEMP/returns-candidate.json" | head -n1; }
          ADMIN_TOKEN="$(renv ADMIN_ACCESS_TOKEN)"
          RETURNS_REPLY_ENABLED="$(renv AI_ARMAN_ADMIN_REPLY_ENABLED)"
          RETURNS_REPLY_BASE="$(renv AI_ARMAN_ADMIN_REPLY_BASE_URL)"
          RETURNS_REPLY_AUDIENCE="$(renv AI_ARMAN_ADMIN_REPLY_AUDIENCE)"
          RETURNS_REPLY_TOKEN="$(renv AI_ARMAN_ADMIN_REPLY_ACCESS_TOKEN)"
          test ${#ADMIN_TOKEN} -ge 32
          echo "::add-mask::$ADMIN_TOKEN"
          if [ -n "$RETURNS_REPLY_TOKEN" ]; then echo "::add-mask::$RETURNS_REPLY_TOKEN"; fi

          AI_REPLY_TOKEN_PRESENT=false
          RETURNS_REPLY_TOKEN_PRESENT=false
          REPLY_TOKEN_PARITY=false
          REPLY_BASE_TARGET_PASS=false
          REPLY_AUDIENCE_TARGET_PASS=false
          [ "$AI_REPLY_ENABLED" = 'true' ] && [ ${#AI_REPLY_TOKEN} -ge 32 ] && AI_REPLY_TOKEN_PRESENT=true
          [ "$RETURNS_REPLY_ENABLED" = 'true' ] && [ ${#RETURNS_REPLY_TOKEN} -ge 32 ] && RETURNS_REPLY_TOKEN_PRESENT=true
          [ "$AI_REPLY_TOKEN_PRESENT" = 'true' ] && [ "$RETURNS_REPLY_TOKEN_PRESENT" = 'true' ] && [ "$AI_REPLY_TOKEN" = "$RETURNS_REPLY_TOKEN" ] && REPLY_TOKEN_PARITY=true
          [ "$RETURNS_REPLY_BASE" = "$AI_TAG_URL" ] && REPLY_BASE_TARGET_PASS=true
          [ "$RETURNS_REPLY_AUDIENCE" = "$AI_CANONICAL_URL" ] && REPLY_AUDIENCE_TARGET_PASS=true

          echo "AI_REPLY_ENABLED=$AI_REPLY_ENABLED" >> "$GITHUB_ENV"
          echo "AI_REPLY_TOKEN_PRESENT=$AI_REPLY_TOKEN_PRESENT" >> "$GITHUB_ENV"
          echo "RETURNS_REPLY_ENABLED=$RETURNS_REPLY_ENABLED" >> "$GITHUB_ENV"
          echo "RETURNS_REPLY_TOKEN_PRESENT=$RETURNS_REPLY_TOKEN_PRESENT" >> "$GITHUB_ENV"
          echo "REPLY_TOKEN_PARITY=$REPLY_TOKEN_PARITY" >> "$GITHUB_ENV"
          echo "REPLY_BASE_TARGET_PASS=$REPLY_BASE_TARGET_PASS" >> "$GITHUB_ENV"
          echo "REPLY_AUDIENCE_TARGET_PASS=$REPLY_AUDIENCE_TARGET_PASS" >> "$GITHUB_ENV"
          echo "AI_REPLY_TOKEN=$AI_REPLY_TOKEN" >> "$GITHUB_ENV"
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          echo "ai_tag_url=$AI_TAG_URL" >> "$GITHUB_OUTPUT"
          echo "ai_canonical_url=$AI_CANONICAL_URL" >> "$GITHUB_OUTPUT"
          echo "returns_tag_url=$RETURNS_TAG_URL" >> "$GITHUB_OUTPUT"
          echo 'SNAPSHOT_PASS=true' >> "$GITHUB_ENV"
          echo 'IAM_VERIFY_PASS=true' >> "$GITHUB_ENV"

      - name: Mint private AI service identity token
        id: idtoken
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.before.outputs.ai_canonical_url }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Verify synthetic private AI reply draft read only
        if: env.AI_REPLY_TOKEN_PRESENT == 'true'
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          AI_URL: ${{ steps.before.outputs.ai_tag_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/synthetic.json" <<'JSON'
          {
            "caseId": "HQR-SYNTHETIC-ADMIN",
            "caseType": "support",
            "status": "chat_waiting_admin",
            "statusLabel": "Väntar på svar",
            "customerName": "Testkund",
            "messages": [
              {
                "direction": "inbound",
                "sender": "Kund",
                "subject": "Leveransfråga",
                "text": "Hej, jag väntar på min order. Kan ni hjälpa mig med status?",
                "date": "2026-08-25T12:00:00Z"
              }
            ]
          }
          JSON
          CODE="$(curl --max-time 35 -sS -o "$RUNNER_TEMP/ai-draft.json" -w '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header "X-AI-Arman-Admin-Token: $AI_REPLY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/synthetic.json" \
            "$AI_URL/ai-arman/internal/admin/reply-draft")"
          echo "SYNTHETIC_AI_DRAFT_HTTP=$CODE" >> "$GITHUB_ENV"
          if [ "$CODE" = '200' ] && jq -e '.ok==true and (.draftText|type)=="string" and (.draftText|length)>0 and .sendsCustomerMessage==false and .executesWrites==false' "$RUNNER_TEMP/ai-draft.json" >/dev/null; then
            echo 'SYNTHETIC_AI_DRAFT_PASS=true' >> "$GITHUB_ENV"
          else
            echo 'SYNTHETIC_AI_DRAFT_PASS=false' >> "$GITHUB_ENV"
          fi

      - name: Verify real Returns case draft read only
        if: env.REPLY_TOKEN_PARITY == 'true' && env.REPLY_BASE_TARGET_PASS == 'true' && env.REPLY_AUDIENCE_TARGET_PASS == 'true'
        env:
          RETURNS_URL: ${{ steps.before.outputs.returns_tag_url }}
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --max-time 40 -sS -o "$RUNNER_TEMP/returns-draft.json" -w '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$RETURNS_URL/api/admin/cases/$CASE_ID/ai-arman/reply-draft")"
          echo "REAL_RETURNS_DRAFT_HTTP=$CODE" >> "$GITHUB_ENV"
          if [ "$CODE" = '200' ] && jq -e '.ok==true and (.draftText|type)=="string" and (.draftText|length)>0 and .sendsCustomerMessage==false and .executesWrites==false' "$RUNNER_TEMP/returns-draft.json" >/dev/null; then
            echo 'REAL_RETURNS_DRAFT_PASS=true' >> "$GITHUB_ENV"
          else
            echo 'REAL_RETURNS_DRAFT_PASS=false' >> "$GITHUB_ENV"
          fi

      - name: Verify traffic and production boundaries unchanged
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$AI_SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai-after.json"
          gcloud run services describe "$RETURNS_SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/returns-after.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent:(.percent // 0),tag:(.tag // "")}] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/ai-after.json" > "$RUNNER_TEMP/ai-positive-after.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent:(.percent // 0),tag:(.tag // "")}] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/returns-after.json" > "$RUNNER_TEMP/returns-positive-after.json"
          cmp "$RUNNER_TEMP/ai-positive-before.json" "$RUNNER_TEMP/ai-positive-after.json"
          cmp "$RUNNER_TEMP/returns-positive-before.json" "$RUNNER_TEMP/returns-positive-after.json"
          test "$(jq -r --arg r "$AI_CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/ai-after.json")" = '0'
          test "$(jq -r --arg r "$RETURNS_CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/returns-after.json")" = '0'
          test "$(jq -r '[.status.traffic[]? | select((.percent // 0)>0)] | if length==1 and .[0].percent==100 then .[0].revisionName else empty end' "$RUNNER_TEMP/returns-after.json")" = "$EXPECTED_RETURNS_LIVE_REV"
          echo 'TRAFFIC_UNCHANGED=true' >> "$GITHUB_ENV"

      - name: Record sanitized reply parity result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/ai-arman-foundation-v1
          git checkout -B result origin/feature/ai-arman-foundation-v1
          OVERALL=blocked
          if [ "${SNAPSHOT_PASS:-false}" = 'true' ] \
            && [ "${IAM_VERIFY_PASS:-false}" = 'true' ] \
            && [ "${AI_REPLY_TOKEN_PRESENT:-false}" = 'true' ] \
            && [ "${RETURNS_REPLY_TOKEN_PRESENT:-false}" = 'true' ] \
            && [ "${REPLY_TOKEN_PARITY:-false}" = 'true' ] \
            && [ "${REPLY_BASE_TARGET_PASS:-false}" = 'true' ] \
            && [ "${REPLY_AUDIENCE_TARGET_PASS:-false}" = 'true' ] \
            && [ "${SYNTHETIC_AI_DRAFT_PASS:-false}" = 'true' ] \
            && [ "${REAL_RETURNS_DRAFT_PASS:-false}" = 'true' ] \
            && [ "${TRAFFIC_UNCHANGED:-false}" = 'true' ]; then
            OVERALL=success
          fi
          cat > "$RESULT_PATH" <<EOF
          overall=$OVERALL
          inspected_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ai_candidate_revision=$AI_CANDIDATE_REV
          ai_candidate_traffic=0
          returns_candidate_revision=$RETURNS_CANDIDATE_REV
          returns_candidate_traffic=0
          returns_positive_revision_expected=$EXPECTED_RETURNS_LIVE_REV
          snapshot_pass=${SNAPSHOT_PASS:-false}
          iam_verify_pass=${IAM_VERIFY_PASS:-false}
          ai_reply_enabled=${AI_REPLY_ENABLED:-unknown}
          ai_reply_token_present=${AI_REPLY_TOKEN_PRESENT:-false}
          returns_reply_enabled=${RETURNS_REPLY_ENABLED:-unknown}
          returns_reply_token_present=${RETURNS_REPLY_TOKEN_PRESENT:-false}
          reply_token_parity=${REPLY_TOKEN_PARITY:-false}
          reply_base_target_pass=${REPLY_BASE_TARGET_PASS:-false}
          reply_audience_target_pass=${REPLY_AUDIENCE_TARGET_PASS:-false}
          synthetic_ai_draft_http=${SYNTHETIC_AI_DRAFT_HTTP:-skipped}
          synthetic_ai_draft_pass=${SYNTHETIC_AI_DRAFT_PASS:-false}
          real_case_id=$CASE_ID
          real_returns_draft_http=${REAL_RETURNS_DRAFT_HTTP:-skipped}
          real_returns_draft_pass=${REAL_RETURNS_DRAFT_PASS:-false}
          sends_customer_message=false
          executes_writes=false
          iam_write_executed=false
          presentation_write_executed=false
          order_or_case_write=false
          vendre_write=false
          gmail_write=false
          nshift_write=false
          traffic_unchanged=${TRAFFIC_UNCHANGED:-false}
          production_traffic_cutover=false
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman reply token parity result [skip ci]' || true
          git push origin HEAD:feature/ai-arman-foundation-v1
