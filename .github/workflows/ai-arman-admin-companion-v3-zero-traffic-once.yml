name: Deploy split AI Arman admin companion v3 once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE: harmoniq-ai-arman-beta0
  SOURCE_SHA: 6076a18c5a43b9bd83608becb7bfd0df813db9e2
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  SECRET_NAME: ai-arman-openai-api-key
  RESULT_PATH: docs/ai-arman/ADMIN_COMPANION_V3_CANDIDATE_LATEST.md

jobs:
  candidate:
    if: github.event.head_commit.message == 'Deploy split AI Arman admin companion v3 once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Guard frozen source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Re-run full source gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test -- --runInBand
          npm run build
          docker build -f Dockerfile.ai-arman-candidate -t ai-arman-admin-companion-v3:verify .
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Snapshot protected production boundary
        id: before
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/before.json"
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam-before.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/positive-before.json"
          jq -e 'length==2 and ([.[].percent] | sort)==[1,99]' "$RUNNER_TEMP/positive-before.json" >/dev/null
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/before.json")" = '2'
          if jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/iam-before.json" >/dev/null; then exit 1; fi
          echo "service_url=$(jq -r '.status.url' "$RUNNER_TEMP/before.json")" >> "$GITHUB_OUTPUT"
      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/harmoniq-containers/$SERVICE:admin-companion-v3-${SOURCE_SHA:0:12}-$GITHUB_RUN_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f Dockerfile.ai-arman-candidate -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$REGION-docker.pkg.dev/$PROJECT_ID/harmoniq-containers/$SERVICE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Deploy private zero traffic v3 candidate
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="admincompv3-${SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --platform managed \
            --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "acv3-${SOURCE_SHA:0:8}-${GITHUB_RUN_NUMBER}" \
            --tag "$TAG" --no-traffic --port 8080 --cpu 1 --memory 256Mi --concurrency 1 --timeout 30 \
            --set-env-vars "NODE_ENV=production,AI_ARMAN_ADMIN_ASSISTANT_ENABLED=true,AI_ARMAN_ADMIN_LEARNING_ENABLED=false,AI_ARMAN_ADMIN_ASSISTANT_TIMEOUT_MS=20000,AI_ARMAN_ADMIN_REPLY_DRAFT_ENABLED=false,AI_ARMAN_CUSTOMER_WIDGET_ENABLED=false,AI_ARMAN_CUSTOMER_IDENTITY_ENABLED=false,AI_ARMAN_MODEL_INTERPRETATION_ENABLED=true,AI_ARMAN_MODEL_SHADOW_ENABLED=false,AI_ARMAN_MODEL_PROMOTION_ENABLED=false,AI_ARMAN_OPENAI_MODEL=gpt-5-mini,AI_ARMAN_MODEL_INPUT_COST_USD_PER_MILLION_TOKENS=0.25,AI_ARMAN_MODEL_OUTPUT_COST_USD_PER_MILLION_TOKENS=2.0" \
            --set-secrets "OPENAI_API_KEY=$SECRET_NAME:1" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/after.json"
          REV="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          URL="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          test -n "$REV"; test -n "$URL"
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/after.json")" = '0'
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        id: idtoken
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.before.outputs.service_url }}
          create_credentials_file: false
      - name: Verify split analysis latency
        id: analysis
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          PAGE="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/page.html" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" "$URL/ai-arman/internal/admin-assistant")"
          test "$PAGE" = 200
          grep -F 'width:min(410px' "$RUNNER_TEMP/page.html" >/dev/null
          grep -F "if(d.mode!=='analysis')" "$RUNNER_TEMP/page.html" >/dev/null
          grep -F "if(d.mode!=='discussion')" "$RUNNER_TEMP/page.html" >/dev/null
          ! grep -F '.innerHTML' "$RUNNER_TEMP/page.html" >/dev/null
          cat > "$RUNNER_TEMP/analysis.json" <<'JSON'
          {"caseId":"HQR-SYNTHETIC","caseType":"support","status":"waiting_admin","messages":[{"direction":"inbound","sender":"Kund","text":"Hej, jag saknar spårningslänk. Hur går det med paketet?"}],"discussion":[]}
          JSON
          START="$(date +%s)"
          STATUS="$(curl -sS --max-time 25 -o "$RUNNER_TEMP/analysis-response.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/analysis.json" "$URL/ai-arman/internal/admin-assistant/assist")"
          ELAPSED="$(( $(date +%s) - START ))"
          case "$STATUS" in 200|201) ;; *) cat "$RUNNER_TEMP/analysis-response.json" >&2; exit 1 ;; esac
          jq -e '.ok==true and .mode=="analysis" and (.caseSummary|type=="string" and length>0) and (.recommendedActions|type=="array" and length>0) and (.reasoning|type=="string" and length>0) and .sendsCustomerMessage==false and .executesWrites==false' "$RUNNER_TEMP/analysis-response.json" >/dev/null
          test "$ELAPSED" -lt 20
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
      - name: Verify split multi-turn discussion latency
        id: discussion
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/discussion.json" <<'JSON'
          {"caseId":"HQR-SYNTHETIC","caseType":"support","status":"waiting_admin","messages":[{"direction":"inbound","sender":"Kund","text":"Hej, jag saknar spårningslänk. Hur går det med paketet?"}],"adminQuestion":"Utifrån det vi diskuterat, vad bör jag kontrollera först?","discussion":[{"role":"assistant","text":"Kontrollera verifierad fraktstatus först."},{"role":"admin","text":"Vi brukar kontrollera transportören först."}]}
          JSON
          START="$(date +%s)"
          STATUS="$(curl -sS --max-time 25 -o "$RUNNER_TEMP/discussion-response.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/discussion.json" "$URL/ai-arman/internal/admin-assistant/assist")"
          ELAPSED="$(( $(date +%s) - START ))"
          case "$STATUS" in 200|201) ;; *) cat "$RUNNER_TEMP/discussion-response.json" >&2; exit 1 ;; esac
          jq -e '.ok==true and .mode=="discussion" and (.answerToAdmin|type=="string" and length>0) and .sendsCustomerMessage==false and .executesWrites==false' "$RUNNER_TEMP/discussion-response.json" >/dev/null
          test "$ELAPSED" -lt 20
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
      - name: Verify protected production unchanged
        env:
          REV: ${{ steps.deploy.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/final.json"
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam-final.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/final.json" > "$RUNNER_TEMP/positive-after.json"
          cmp "$RUNNER_TEMP/positive-before.json" "$RUNNER_TEMP/positive-after.json"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/final.json")" = '2'
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/final.json")" = '0'
          if jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/iam-final.json" >/dev/null; then exit 1; fi
      - name: Record v3 checkpoint
        env:
          REV: ${{ steps.deploy.outputs.revision }}
          URL: ${{ steps.deploy.outputs.url }}
          ANALYSIS_SECONDS: ${{ steps.analysis.outputs.elapsed }}
          DISCUSSION_SECONDS: ${{ steps.discussion.outputs.elapsed }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/ai-arman-foundation-v1
          git checkout -B result origin/feature/ai-arman-foundation-v1
          cat > "$RESULT_PATH" <<EOF
          # AI Arman compact admin companion v3 candidate

          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Frozen source: \`$SOURCE_SHA\`
          - Overall: **PASS**
          - Candidate revision: \`$REV\`
          - Candidate URL: \`$URL\`
          - Image digest: \`$DIGEST\`
          - Candidate traffic: **0%**
          - Production 99/1: **unchanged**
          - Service max instances: **2 unchanged**
          - Private IAM: **PASS**
          - Drawer max width: **410 px**
          - Analysis/discussion schemas: **split**
          - Model reasoning effort: **minimal**
          - Analysis latency: **${ANALYSIS_SECONDS}s**
          - Discussion latency: **${DISCUSSION_SECONDS}s**
          - Multi-turn discussion: **PASS**
          - Customer message sending: **false**
          - External writes: **false**
          - Model promotion: **false**
          - Support learning writes: **OFF in candidate**
          - External modules modified: **none**
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record split AI Arman admin companion v3 candidate'
          git push origin HEAD:feature/ai-arman-foundation-v1
