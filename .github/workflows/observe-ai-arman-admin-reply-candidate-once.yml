name: Observe AI Arman admin reply candidate once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

jobs:
  observe:
    if: github.event.head_commit.message == 'Observe AI Arman admin reply candidate once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: harmoniq-210513
      REGION: europe-north1
      SERVICE_NAME: harmoniq-ai-arman-beta0
      WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
      DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
      TARGET_SOURCE_SHA: c4862358
      TARGET_FULL_SHA: c4862358b6769f6cb5578917e0718166ef965786
      RESULT_PATH: docs/ai-arman/ADMIN_REPLY_CANDIDATE_OBSERVE_LATEST.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Observe candidate and production boundary
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          SERVICE_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/service.json")"
          test -n "$SERVICE_URL"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then
            PRIVATE='false'
          else
            PRIVATE='true'
          fi
          POSITIVE="$(jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/service.json")"
          BOUNDARY_OK="$(jq -r 'length == 2 and ([.[].percent] | sort) == [1,99]' <<<"$POSITIVE")"
          SERVICE_MAX="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service.json")"

          gcloud run revisions list --service "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/revisions.json"
          CANDIDATE_REVISION="$(jq -r --arg sha "$TARGET_SOURCE_SHA" '[.[] | select(.metadata.labels.release == "admin-reply-candidate" and .metadata.labels["source-sha"] == $sha)] | sort_by(.metadata.creationTimestamp) | last | .metadata.name // empty' "$RUNNER_TEMP/revisions.json")"
          if [[ -n "$CANDIDATE_REVISION" ]]; then
            CANDIDATE_PERCENT="$(jq -r --arg rev "$CANDIDATE_REVISION" '[.status.traffic[]? | select(.revisionName==$rev) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")"
            TAG_URL="$(jq -r --arg rev "$CANDIDATE_REVISION" '.status.traffic[]? | select(.revisionName==$rev and (.tag // "") != "") | .url // empty' "$RUNNER_TEMP/service.json" | head -n1)"
          else
            CANDIDATE_PERCENT=''
            TAG_URL=''
          fi

          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "candidate_revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
          echo "candidate_percent=$CANDIDATE_PERCENT" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"
          echo "private=$PRIVATE" >> "$GITHUB_OUTPUT"
          echo "boundary_ok=$BOUNDARY_OK" >> "$GITHUB_OUTPUT"
          echo "service_max=$SERVICE_MAX" >> "$GITHUB_OUTPUT"

      - name: Mint canonical audience ID token
        if: steps.observe.outputs.candidate_revision != ''
        id: idtoken
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.observe.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Probe candidate draft safely
        if: steps.observe.outputs.candidate_revision != '' && steps.observe.outputs.tag_url != ''
        id: probe
        shell: bash
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          TAG_URL: ${{ steps.observe.outputs.tag_url }}
        run: |
          set -euo pipefail
          APP_TOKEN="$(printf 'candidate:%s' "$TARGET_FULL_SHA" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$APP_TOKEN"
          echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"caseId":"HQR-SYNTHETIC-OBSERVE","caseType":"support","status":"chat_waiting_admin","customerName":"Testkund","messages":[{"direction":"inbound","sender":"Kund","subject":"Leveransfråga","text":"Hej, mitt paket uppges vara skickat men jag har ingen spårningslänk. Kan ni hjälpa mig?","date":"2026-08-19T08:22:00Z"}]}
          JSON
          CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $ID_TOKEN" --header "X-AI-Arman-Admin-Token: $APP_TOKEN" --header 'Content-Type: application/json' --data @"$RUNNER_TEMP/request.json" "$TAG_URL/ai-arman/internal/admin/reply-draft" || true)"
          if [[ "$CODE" =~ ^20[0-9]$ ]] && jq -e '.ok == true and (.draftText|type=="string" and length>0) and .sendsCustomerMessage == false and .executesWrites == false' "$RUNNER_TEMP/response.json" >/dev/null 2>&1; then
            echo 'probe=PASS' >> "$GITHUB_OUTPUT"
          else
            echo "probe=FAIL_HTTP_${CODE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write observation checkpoint
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ steps.observe.outputs.candidate_revision }}
          CANDIDATE_PERCENT: ${{ steps.observe.outputs.candidate_percent }}
          TAG_URL: ${{ steps.observe.outputs.tag_url }}
          PRIVATE: ${{ steps.observe.outputs.private }}
          BOUNDARY_OK: ${{ steps.observe.outputs.boundary_ok }}
          SERVICE_MAX: ${{ steps.observe.outputs.service_max }}
          PROBE: ${{ steps.probe.outputs.probe }}
        run: |
          set -euo pipefail
          OVERALL='FAIL'
          if [[ -n "$CANDIDATE_REVISION" && "$CANDIDATE_PERCENT" == '0' && "$PRIVATE" == 'true' && "$BOUNDARY_OK" == 'true' && "$SERVICE_MAX" == '2' && "$PROBE" == 'PASS' ]]; then OVERALL='PASS'; fi
          cat > "$RESULT_PATH" <<EOF
          # AI Arman admin reply candidate observation

          - Observed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Target source: \`$TARGET_FULL_SHA\`
          - Overall: **$OVERALL**
          - Candidate revision: \`${CANDIDATE_REVISION:-missing}\`
          - Candidate URL: \`${TAG_URL:-missing}\`
          - Candidate traffic: \`${CANDIDATE_PERCENT:-missing}%\`
          - Private IAM: **$PRIVATE**
          - Production 99/1 unchanged: **$BOUNDARY_OK**
          - Service max instances: \`$SERVICE_MAX\`
          - Synthetic private admin draft probe: **${PROBE:-NOT_RUN}**
          - No GCP mutation performed by this observer.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman admin reply candidate observation'
          git push origin HEAD:feature/ai-arman-foundation-v1
