name: Verify AI Arman resolver candidate read only 20260824

on:
  pull_request:
    branches:
      - verify/ai-arman-resolver-candidate-20260824

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  CANDIDATE_TAG: resolver-ai-3298af83
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com

jobs:
  verify-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Wait for and inspect zero traffic candidate
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 30); do
            gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
            REV="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/service.json" | head -n1)"
            URL="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/service.json" | head -n1)"
            if [[ -n "$REV" && -n "$URL" ]]; then found=true; break; fi
            sleep 10
          done
          test "$found" = true
          echo "revision=$REV" >> "$GITHUB_ENV"
          echo "tag_url=$URL" >> "$GITHUB_ENV"
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")" = '0'
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent,tag}] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/service.json" | tee "$RUNNER_TEMP/positive.json"
          test "$(jq 'length' "$RUNNER_TEMP/positive.json")" -ge 1

      - name: Verify private IAM and candidate env
        run: |
          set -euo pipefail
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then exit 1; fi
          gcloud run revisions describe "$revision" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/revision.json"
          envv(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' "$RUNNER_TEMP/revision.json"; }
          test "$(envv AI_ARMAN_ADMIN_RESOLVER_ENABLED)" = 'true'
          test "$(envv AI_ARMAN_RETURNS_ADMIN_WRITE_ENABLED)" = 'false'
          test "$(envv AI_ARMAN_MODEL_PROMOTION_ENABLED)" = 'false'

      - name: Summary
        run: |
          {
            echo '## Read-only resolver candidate verification'
            echo
            echo "- Revision: \`$revision\`"
            echo "- Tagged URL: \`$tag_url\`"
            echo '- Candidate traffic: **0%**'
            echo '- Private IAM: **PASS**'
            echo '- Resolver enabled: **true**'
            echo '- Admin writes: **false**'
            echo '- Model promotion: **false**'
          } >> "$GITHUB_STEP_SUMMARY"
