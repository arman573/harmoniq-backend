name: Temporary AI Arman private remote smoke

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-private-remote-smoke.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  SERVICE_NAME: harmoniq-ai-arman-beta0

jobs:
  private-remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate through existing WIF for read checks
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read private service baseline
        id: service
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n 1)"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

          gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > "$RUNNER_TEMP/service.json"

          URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/service.json")"
          REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$RUNNER_TEMP/service.json")"
          test -n "$URL"
          test -n "$REVISION"

          gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            > "$RUNNER_TEMP/service-iam.json"

          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$RUNNER_TEMP/service-iam.json" >/dev/null; then
            echo "REMOTE_SMOKE_PRIVATE_IAM=FAIL_PUBLIC_MEMBER"
            exit 1
          fi

          echo "REMOTE_SMOKE_PRIVATE_IAM=PASS"
          echo "REMOTE_SMOKE_REVISION=$REVISION"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Mint service-account ID token through existing WIF
        id: auth_id
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Invoke private beta0 with minted ID token
        shell: bash
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
          ID_TOKEN: ${{ steps.auth_id.outputs.id_token }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_URL"
          test -n "$ID_TOKEN"
          echo "::add-mask::$ID_TOKEN"
          echo "REMOTE_SMOKE_ID_TOKEN=PASS"

          FOUNDATION_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/foundation.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ID_TOKEN" \
            "$SERVICE_URL/ai-arman/foundation")"
          echo "REMOTE_SMOKE_FOUNDATION_HTTP=$FOUNDATION_CODE"

          if [ "$FOUNDATION_CODE" != "200" ]; then
            cat "$RUNNER_TEMP/foundation.json" || true
            exit 21
          fi

          jq -e '
            .ok == true and
            .service == "ai-arman" and
            .phase == "foundation-v1" and
            .productionActionsEnabled == false
          ' "$RUNNER_TEMP/foundation.json" >/dev/null
          echo "REMOTE_SMOKE_FOUNDATION_PAYLOAD=PASS"

          WIDGET_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/widget.txt" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ID_TOKEN" \
            "$SERVICE_URL/ai-arman/widget/beta0-preview")"
          echo "REMOTE_SMOKE_WIDGET_HTTP=$WIDGET_CODE"
          test "$WIDGET_CODE" = "404"
          echo "REMOTE_SMOKE_WIDGET_DISABLED=PASS"
