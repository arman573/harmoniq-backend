name: AI Arman admin reply zero traffic candidate once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-admin-reply-zero-traffic-candidate-once
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  SECRET_NAME: ai-arman-openai-api-key
  ARTIFACT_REPOSITORY: harmoniq-containers
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RESULT_PATH: docs/ai-arman/ADMIN_REPLY_CANDIDATE_LATEST.md

jobs:
  candidate:
    if: github.event.head_commit.message == 'Deploy AI Arman admin reply zero traffic candidate once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1

      - name: Guard exact trigger source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_ACTOR" = "arman573"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Re-run full source gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test -- --runInBand
          npm run build
          docker build -f Dockerfile.ai-arman-candidate -t ai-arman-admin-reply:verify .

      - name: Authenticate deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Snapshot private 99/1 production boundary
        id: before
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/before.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam-before.json"

          SERVICE_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/before.json")"
          test -n "$SERVICE_URL"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam-before.json" >/dev/null; then
            echo 'AI Arman service is public; refusing candidate deploy.' >&2
            exit 1
          fi

          jq -cS '[.status.traffic[]? | select((.percent // 0) > 0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/positive-before.json"
          jq -e 'length == 2 and ([.[].percent] | sort) == [1,99]' "$RUNNER_TEMP/positive-before.json" >/dev/null
          SERVICE_MAX="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/before.json")"
          test "$SERVICE_MAX" = '2'

          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo 'Production boundary before candidate: private 99/1, max=2'

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME:admin-reply-$SHORT_SHA-$GITHUB_RUN_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull -f Dockerfile.ai-arman-candidate --tag "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "immutable_image=$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy private zero traffic admin reply candidate
        id: deploy
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.immutable_image }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          TAG="adminreply-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          REVISION_SUFFIX="admin-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          APP_TOKEN="$(printf 'candidate:%s' "$GITHUB_SHA" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$APP_TOKEN"
          echo "AI_ADMIN_APP_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"

          gcloud run deploy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$IMMUTABLE_IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "$REVISION_SUFFIX" \
            --tag "$TAG" \
            --no-traffic \
            --port 8080 \
            --startup-probe "httpGet.path=/ai-arman/foundation,httpGet.port=8080,initialDelaySeconds=0,failureThreshold=12,timeoutSeconds=2,periodSeconds=5" \
            --cpu 1 \
            --memory 256Mi \
            --cpu-throttling \
            --no-cpu-boost \
            --concurrency 1 \
            --timeout 30 \
            --set-env-vars "NODE_ENV=production,AI_ARMAN_WIDGET_PREVIEW_ENABLED=false,AI_ARMAN_INTERNAL_PREVIEW_DIAGNOSTICS_ENABLED=false,AI_ARMAN_CUSTOMER_WIDGET_ENABLED=false,AI_ARMAN_CUSTOMER_IDENTITY_ENABLED=false,AI_ARMAN_ADMIN_REPLY_DRAFT_ENABLED=true,AI_ARMAN_MODEL_INTERPRETATION_ENABLED=true,AI_ARMAN_MODEL_SHADOW_ENABLED=false,AI_ARMAN_MODEL_PROMOTION_ENABLED=false,AI_ARMAN_OPENAI_MODEL=gpt-5-mini,AI_ARMAN_MODEL_INTERPRETATION_TIMEOUT_MS=10000,AI_ARMAN_ADMIN_REPLY_DRAFT_ACCESS_TOKEN=$APP_TOKEN" \
            --set-secrets "OPENAI_API_KEY=$SECRET_NAME:1" \
            --labels "release=admin-reply-candidate,source-sha=$SHORT_SHA,promotion=off,traffic=zero" \
            --quiet

          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/after.json"
          REVISION="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag == $tag) | .revisionName // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          TAG_URL="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag == $tag) | .url // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          test -n "$REVISION"
          test -n "$TAG_URL"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify zero traffic and production unchanged
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/final.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam-final.json"
          gcloud run revisions describe "$CANDIDATE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/revision.json"

          jq -cS '[.status.traffic[]? | select((.percent // 0) > 0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/final.json" > "$RUNNER_TEMP/positive-after.json"
          cmp "$RUNNER_TEMP/positive-before.json" "$RUNNER_TEMP/positive-after.json"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/final.json")" = '2'
          CANDIDATE_PERCENT="$(jq -r --arg rev "$CANDIDATE_REVISION" '[.status.traffic[]? | select(.revisionName == $rev) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/final.json")"
          test "$CANDIDATE_PERCENT" = '0'
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam-final.json" >/dev/null; then exit 1; fi

          env_value() { jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name == $n) | .value // empty' "$RUNNER_TEMP/revision.json"; }
          test "$(env_value AI_ARMAN_ADMIN_REPLY_DRAFT_ENABLED)" = 'true'
          test "$(env_value AI_ARMAN_MODEL_INTERPRETATION_ENABLED)" = 'true'
          test "$(env_value AI_ARMAN_MODEL_SHADOW_ENABLED)" = 'false'
          test "$(env_value AI_ARMAN_MODEL_PROMOTION_ENABLED)" = 'false'
          test "$(env_value AI_ARMAN_CUSTOMER_WIDGET_ENABLED)" = 'false'
          test "$(env_value AI_ARMAN_CUSTOMER_IDENTITY_ENABLED)" = 'false'
          test "$(jq -r '.spec.containers[0].env[]? | select(.name == "OPENAI_API_KEY") | .valueFrom.secretKeyRef.name // empty' "$RUNNER_TEMP/revision.json")" = "$SECRET_NAME"

      - name: Mint canonical audience ID token
        id: idtoken
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.before.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Verify real private admin draft path
        shell: bash
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          TAG_URL: ${{ steps.deploy.outputs.tag_url }}
        run: |
          set -euo pipefail
          test -n "$ID_TOKEN"
          test -n "$TAG_URL"
          echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/admin-draft-request.json" <<'JSON'
          {
            "caseId": "HQR-SYNTHETIC-ADMIN",
            "caseType": "support",
            "status": "chat_waiting_admin",
            "statusLabel": "Väntar på svar",
            "customerName": "Testkund",
            "messages": [
              {
                "direction": "inbound",
                "sender": "Kund",
                "subject": "Leveransfråga",
                "text": "Hej, jag fick besked att paketet skickats men saknar spårningslänk. Kan ni hjälpa mig?",
                "date": "2026-08-19T08:22:00Z"
              }
            ]
          }
          JSON
          CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/admin-draft-response.json" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ID_TOKEN" \
            --header "X-AI-Arman-Admin-Token: $AI_ADMIN_APP_TOKEN" \
            --header 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/admin-draft-request.json" \
            "$TAG_URL/ai-arman/internal/admin/reply-draft")"
          case "$CODE" in 200|201|202|204) ;; *) cat "$RUNNER_TEMP/admin-draft-response.json" >&2; exit 1 ;; esac
          jq -e '.ok == true and (.draftText | type == "string" and length > 0) and .sendsCustomerMessage == false and .executesWrites == false and (.requiresHumanDecision | type == "boolean") and (.confidence | type == "number")' "$RUNNER_TEMP/admin-draft-response.json" >/dev/null

      - name: Record candidate checkpoint
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.revision }}
          TAG_URL: ${{ steps.deploy.outputs.tag_url }}
          SERVICE_URL: ${{ steps.before.outputs.service_url }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cat > "$RESULT_PATH" <<EOF
          # AI Arman admin reply candidate

          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Source commit: \`$GITHUB_SHA\`
          - Candidate revision: \`$CANDIDATE_REVISION\`
          - Candidate URL: \`$TAG_URL\`
          - Canonical service URL: \`$SERVICE_URL\`
          - Image digest: \`$DIGEST\`
          - Candidate traffic: **0%**
          - Production positive traffic: **unchanged 99/1**
          - Service max instances: **2 unchanged**
          - Private IAM: **PASS**
          - Admin reply draft enabled on candidate: **true**
          - Customer widget enabled on candidate: **false**
          - Model promotion: **false**
          - Real synthetic private draft call: **PASS**
          - Draft sends customer message: **false**
          - Draft executes writes: **false**
          - Candidate app token is candidate-only and not recorded here.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman admin reply candidate'
          git push origin HEAD:feature/ai-arman-foundation-v1
