name: AI Arman live durable shadow verify

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/ai-arman-live-durable-shadow-verify.yml

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  DETERMINISTIC_REVISION: harmoniq-ai-arman-beta0-00002-2kq
  OLD_SHADOW_REVISION: harmoniq-ai-arman-beta0-shadow-a979b694-2
  DURABLE_REVISION: harmoniq-ai-arman-beta0-durable-20ff1996-1
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RESULT_PATH: docs/ai-arman/LIVE_DURABLE_SHADOW_VERIFY_LATEST.md

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - name: Authenticate read-only boundary reader
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read live state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > service.json
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > iam.json
          gcloud run revisions describe "$DURABLE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > durable.json

          deterministic="$(jq -r --arg r "$DETERMINISTIC_REVISION" '[.status.traffic[]? | select(.revisionName==$r) | (.percent//0)] | add//0' service.json)"
          old_shadow="$(jq -r --arg r "$OLD_SHADOW_REVISION" '[.status.traffic[]? | select(.revisionName==$r) | (.percent//0)] | add//0' service.json)"
          durable="$(jq -r --arg r "$DURABLE_REVISION" '[.status.traffic[]? | select(.revisionName==$r) | (.percent//0)] | add//0' service.json)"
          max_scale="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' service.json)"
          public=no
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' iam.json >/dev/null; then public=yes; fi
          envv(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' durable.json; }
          promotion="$(envv AI_ARMAN_MODEL_PROMOTION_ENABLED)"
          widget="$(envv AI_ARMAN_WIDGET_PREVIEW_ENABLED)"
          audit="$(envv AI_ARMAN_MODEL_SHADOW_DURABLE_AUDIT_ENABLED)"
          shadow="$(envv AI_ARMAN_MODEL_SHADOW_ENABLED)"
          interpretation="$(envv AI_ARMAN_MODEL_INTERPRETATION_ENABLED)"

          status=FAIL
          if [ "$deterministic" = 99 ] && [ "$old_shadow" = 0 ] && [ "$durable" = 1 ] && [ "$max_scale" = 2 ] && [ "$public" = no ] && [ "$promotion" = false ] && [ "$widget" = false ] && [ "$audit" = true ] && [ "$shadow" = true ] && [ "$interpretation" = true ]; then status=PASS; fi

          {
            echo "status=$status"
            echo "deterministic=$deterministic"
            echo "old_shadow=$old_shadow"
            echo "durable=$durable"
            echo "max_scale=$max_scale"
            echo "public=$public"
            echo "promotion=$promotion"
            echo "widget=$widget"
            echo "audit=$audit"
            echo "shadow=$shadow"
            echo "interpretation=$interpretation"
          } >> "$GITHUB_OUTPUT"

      - name: Persist verification
        shell: bash
        env:
          STATUS: ${{ steps.state.outputs.status }}
          DETERMINISTIC: ${{ steps.state.outputs.deterministic }}
          OLD_SHADOW: ${{ steps.state.outputs.old_shadow }}
          DURABLE: ${{ steps.state.outputs.durable }}
          MAX_SCALE: ${{ steps.state.outputs.max_scale }}
          PUBLIC: ${{ steps.state.outputs.public }}
          PROMOTION: ${{ steps.state.outputs.promotion }}
          WIDGET: ${{ steps.state.outputs.widget }}
          AUDIT: ${{ steps.state.outputs.audit }}
          SHADOW: ${{ steps.state.outputs.shadow }}
          INTERPRETATION: ${{ steps.state.outputs.interpretation }}
        run: |
          mkdir -p "$(dirname "$RESULT_PATH")"
          cat > "$RESULT_PATH" <<EOF
          # AI Arman live durable shadow verification - latest

          Generated by GitHub Actions run ${GITHUB_RUN_ID} from commit ${GITHUB_SHA}.

          - Overall: ${STATUS}
          - Deterministic traffic: ${DETERMINISTIC}%
          - Old shadow traffic: ${OLD_SHADOW}%
          - Durable shadow traffic: ${DURABLE}%
          - Service max instances: ${MAX_SCALE}
          - Public IAM: ${PUBLIC}
          - Model interpretation: ${INTERPRETATION}
          - Model shadow: ${SHADOW}
          - Durable audit: ${AUDIT}
          - Model promotion: ${PROMOTION}
          - Widget preview: ${WIDGET}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_PATH"
          git diff --cached --quiet || git commit -m "Record live durable shadow verification"
          git push origin HEAD:feature/ai-arman-foundation-v1

      - name: Require verified live state
        shell: bash
        env:
          STATUS: ${{ steps.state.outputs.status }}
        run: test "$STATUS" = PASS
