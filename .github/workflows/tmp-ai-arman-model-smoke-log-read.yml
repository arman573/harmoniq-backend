name: Temporary AI Arman model smoke safe log read

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-model-smoke-log-read.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  EXECUTION_NAME: ai-arman-model-provider-smoke-8m7jx
  JOB_NAME: ai-arman-model-provider-smoke
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com

jobs:
  safe-log-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate through existing WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read only safe MODEL_PROVIDER markers
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n 1)"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

          FILTER="resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB_NAME\" AND timestamp>=\"2026-08-17T15:43:50Z\" AND timestamp<=\"2026-08-17T15:44:30Z\""

          if ! gcloud logging read "$FILTER" \
            --project "$PROJECT_ID" \
            --limit 100 \
            --order asc \
            --format='value(textPayload)' \
            > "$RUNNER_TEMP/job-text.txt" 2> "$RUNNER_TEMP/logging-error.txt"; then
            echo "SAFE_LOG_READ=BLOCKED"
            grep -E 'PERMISSION_DENIED|does not have permission|Permission' "$RUNNER_TEMP/logging-error.txt" || true
            exit 2
          fi

          grep '^MODEL_PROVIDER_' "$RUNNER_TEMP/job-text.txt" > "$RUNNER_TEMP/safe-markers.txt" || true
          if [ ! -s "$RUNNER_TEMP/safe-markers.txt" ]; then
            echo "SAFE_LOG_READ=NO_MODEL_MARKERS"
            exit 3
          fi

          echo "SAFE_LOG_READ=PASS"
          cat "$RUNNER_TEMP/safe-markers.txt"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AI Arman safe provider marker read"
            echo
            echo "- Execution: \`$EXECUTION_NAME\`"
            echo "- Only lines beginning with \`MODEL_PROVIDER_\` are emitted."
            echo "- No secret payload, raw provider body, prompt, or customer data is printed."
            echo "- No Cloud Run service or job mutation is performed."
          } >> "$GITHUB_STEP_SUMMARY"
