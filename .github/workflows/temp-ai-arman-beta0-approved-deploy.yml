name: TEMP AI Arman beta0 approved deploy

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/temp-ai-arman-beta0-approved-deploy.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: temp-ai-arman-beta0-approved-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  ARTIFACT_REPOSITORY: harmoniq-containers
  SERVICE_NAME: harmoniq-ai-arman-beta0
  REQUIRED_REF: refs/heads/feature/ai-arman-foundation-v1
  APPROVAL_MARKER: DEPLOYERA BETA0

jobs:
  verify-source:
    name: Verify approved candidate source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enforce approved deploy boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL_MARKER" = "DEPLOYERA BETA0"
          test "$GITHUB_REF" = "$REQUIRED_REF"
          test "$GITHUB_ACTOR" = "arman573"

      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify source and isolated candidate locally
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test -- --runInBand
          npm run build
          docker build -f Dockerfile.ai-arman-candidate -t ai-arman-candidate:deploy-verify .

          CONTAINER_ID="$(docker run -d \
            -p 18080:8080 \
            -e PORT=8080 \
            -e AI_ARMAN_WIDGET_PREVIEW_ENABLED=false \
            -e AI_ARMAN_MODEL_INTERPRETATION_ENABLED=false \
            -e AI_ARMAN_MODEL_SHADOW_ENABLED=false \
            -e AI_ARMAN_MODEL_PROMOTION_ENABLED=false \
            ai-arman-candidate:deploy-verify)"

          cleanup() {
            docker logs "$CONTAINER_ID" || true
            docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:18080/ai-arman/foundation > "$RUNNER_TEMP/foundation.json"; then
              break
            fi
            sleep 1
          done

          jq -e '.ok == true and .service == "ai-arman" and .phase == "foundation-v1" and .productionActionsEnabled == false' "$RUNNER_TEMP/foundation.json" >/dev/null

          WIDGET_STATUS="$(curl --silent --output "$RUNNER_TEMP/widget-disabled.txt" --write-out '%{http_code}' http://127.0.0.1:18080/ai-arman/widget/beta0-preview)"
          test "$WIDGET_STATUS" = "404"

          docker logs "$CONTAINER_ID" > "$RUNNER_TEMP/candidate.log" 2>&1
          if grep -Eqi '(127\.0\.0\.1|localhost).*(5432|postgres)|ECONNREFUSED.*5432|postgres.*(127\.0\.0\.1|localhost)' "$RUNNER_TEMP/candidate.log"; then
            echo "Detected localhost/Postgres startup attempt in isolated candidate." >&2
            cat "$RUNNER_TEMP/candidate.log" >&2
            exit 1
          fi

  deploy-private-candidate:
    name: Deploy approved private beta0 candidate
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Authenticate with dedicated AI Arman deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify exact permissions before mutation
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n 1)"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

          REPOSITORY_FORMAT="$(gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --location "$REGION" --project "$PROJECT_ID" --format='value(format)')"
          test "$REPOSITORY_FORMAT" = "DOCKER"

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"

          curl --silent --show-error --fail --output "$RUNNER_TEMP/project-permissions.json" --request POST \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions" \
            --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' \
            --data '{"permissions":["run.services.create","run.services.get","run.services.update","run.operations.get","run.services.getIamPolicy"]}'
          for permission in run.services.create run.services.get run.services.update run.operations.get run.services.getIamPolicy; do
            jq -e --arg permission "$permission" '.permissions | index($permission) != null' "$RUNNER_TEMP/project-permissions.json" >/dev/null
          done

          curl --silent --show-error --fail --output "$RUNNER_TEMP/runtime-permissions.json" --request POST \
            "https://iam.googleapis.com/v1/projects/-/serviceAccounts/${RUNTIME_SERVICE_ACCOUNT}:testIamPermissions" \
            --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' \
            --data '{"permissions":["iam.serviceAccounts.actAs"]}'
          jq -e '.permissions | index("iam.serviceAccounts.actAs") != null' "$RUNNER_TEMP/runtime-permissions.json" >/dev/null

          REPOSITORY_RESOURCE="projects/${PROJECT_ID}/locations/${REGION}/repositories/${ARTIFACT_REPOSITORY}"
          curl --silent --show-error --fail --output "$RUNNER_TEMP/repository-permissions.json" --request POST \
            "https://artifactregistry.googleapis.com/v1/${REPOSITORY_RESOURCE}:testIamPermissions" \
            --header "Authorization: Bearer $ACCESS_TOKEN" --header 'Content-Type: application/json' \
            --data '{"permissions":["artifactregistry.repositories.downloadArtifacts","artifactregistry.repositories.uploadArtifacts"]}'
          jq -e '.permissions | index("artifactregistry.repositories.downloadArtifacts") != null' "$RUNNER_TEMP/repository-permissions.json" >/dev/null
          jq -e '.permissions | index("artifactregistry.repositories.uploadArtifacts") != null' "$RUNNER_TEMP/repository-permissions.json" >/dev/null

          if gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/existing-service.json" 2>/dev/null; then
            EXISTING_RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/existing-service.json")"
            test "$EXISTING_RUNTIME" = "$RUNTIME_SERVICE_ACCOUNT"
            gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/existing-service-iam.json"
            if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/existing-service-iam.json" >/dev/null; then
              echo "Existing target service is public; refusing deploy." >&2
              exit 1
            fi
          fi

      - name: Build and push immutable candidate image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="beta0-${SHORT_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME:$TAG"

          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull -f Dockerfile.ai-arman-candidate --tag "$IMAGE" .
          docker push "$IMAGE"

          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not verify immutable image digest." >&2
            exit 1
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate with locked low-cost settings
        id: deploy
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          REVISION_SUFFIX="beta0-${SHORT_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          gcloud run deploy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "$REVISION_SUFFIX" \
            --ingress all \
            --port 8080 \
            --startup-probe "httpGet.path=/ai-arman/foundation,httpGet.port=8080,initialDelaySeconds=0,failureThreshold=12,timeoutSeconds=2,periodSeconds=5" \
            --cpu 1 \
            --memory 512Mi \
            --cpu-throttling \
            --no-cpu-boost \
            --min 0 \
            --max 1 \
            --concurrency 20 \
            --timeout 30 \
            --set-env-vars "NODE_ENV=production,AI_ARMAN_WIDGET_PREVIEW_ENABLED=false,AI_ARMAN_MODEL_INTERPRETATION_ENABLED=false,AI_ARMAN_MODEL_SHADOW_ENABLED=false,AI_ARMAN_MODEL_PROMOTION_ENABLED=false" \
            --labels "release=beta0-candidate,source-sha=$SHORT_SHA,cost-profile=beta0-minimal" \
            --quiet

          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"

          REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$RUNNER_TEMP/service.json")"
          DEPLOYED_RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/service.json")"
          STARTUP_PATH="$(jq -r '.spec.template.spec.containers[0].startupProbe.httpGet.path // empty' "$RUNNER_TEMP/service.json")"
          STARTUP_PORT="$(jq -r '.spec.template.spec.containers[0].startupProbe.httpGet.port // empty' "$RUNNER_TEMP/service.json")"
          CPU_THROTTLING="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/cpu-throttling"] // empty' "$RUNNER_TEMP/service.json")"
          CPU_BOOST="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/startup-cpu-boost"] // empty' "$RUNNER_TEMP/service.json")"
          SERVICE_MIN="$(jq -r '.metadata.annotations["run.googleapis.com/minScale"] // "0"' "$RUNNER_TEMP/service.json")"
          SERVICE_MAX="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service.json")"

          test -n "$REVISION"
          test "$DEPLOYED_RUNTIME" = "$RUNTIME_SERVICE_ACCOUNT"
          test "$STARTUP_PATH" = "/ai-arman/foundation"
          test "$STARTUP_PORT" = "8080"
          test "$CPU_THROTTLING" = "true"
          test "$CPU_BOOST" = "false"
          test "$SERVICE_MIN" = "0"
          test "$SERVICE_MAX" = "1"

          for flag in AI_ARMAN_WIDGET_PREVIEW_ENABLED AI_ARMAN_MODEL_INTERPRETATION_ENABLED AI_ARMAN_MODEL_SHADOW_ENABLED AI_ARMAN_MODEL_PROMOTION_ENABLED; do
            VALUE="$(jq -r --arg flag "$flag" '.spec.template.spec.containers[0].env[]? | select(.name == $flag) | .value' "$RUNNER_TEMP/service.json")"
            test "$VALUE" = "false"
          done

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify private IAM boundary after deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service-iam.json"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/service-iam.json" >/dev/null; then
            echo "Public Cloud Run IAM detected after deploy." >&2
            exit 1
          fi
          echo "privateIamBoundary=PASS"

      - name: Publish deployment summary
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          {
            echo "## AI Arman beta0 approved candidate deploy"
            echo
            echo "- Service: $SERVICE_NAME"
            echo "- Revision: $REVISION"
            echo "- Image: $IMAGE"
            echo "- Digest: $DIGEST"
            echo "- Private IAM boundary: PASS"
            echo "- Startup probe: /ai-arman/foundation"
            echo "- Billing profile: request-based CPU throttling"
            echo "- Startup CPU boost: disabled"
            echo "- Scaling: min 0 / max 1"
            echo "- Memory: 512 MiB"
            echo "- CPU: 1 vCPU"
            echo "- Widget preview: disabled"
            echo "- Model interpretation: disabled"
            echo "- Model shadow: disabled"
            echo "- Model promotion: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
