name: AI Arman customer gateway private candidate once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-customer-gateway-private-candidate-once
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  ARTIFACT_REPOSITORY: harmoniq-containers
  SERVICE_NAME: harmoniq-ai-arman-customer-gateway-candidate
  LIVE_AI_SERVICE: harmoniq-ai-arman-beta0
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RESULT_PATH: docs/ai-arman/CUSTOMER_GATEWAY_PRIVATE_CANDIDATE_LATEST.md

jobs:
  deploy-private-candidate:
    if: github.event.head_commit.message == 'Deploy private customer gateway candidate once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Re-run source gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test -- --runInBand
          npm run build
          docker build -f Dockerfile.ai-arman-customer-gateway -t ai-arman-customer-gateway:private-candidate-verify .

          CONTAINER_ID="$(docker run -d \
            -p 18081:8080 \
            -e PORT=8080 \
            -e AI_ARMAN_CUSTOMER_WIDGET_ENABLED=true \
            -e AI_ARMAN_CUSTOMER_IDENTITY_ENABLED=false \
            -e AI_ARMAN_CUSTOMER_OTP_EMAIL_ENABLED=false \
            -e AI_ARMAN_VENDRE_CUSTOMER_DIRECTORY_ENABLED=false \
            -e AI_ARMAN_WIDGET_PREVIEW_ENABLED=false \
            -e AI_ARMAN_MODEL_INTERPRETATION_ENABLED=false \
            -e AI_ARMAN_MODEL_SHADOW_ENABLED=false \
            -e AI_ARMAN_MODEL_PROMOTION_ENABLED=false \
            ai-arman-customer-gateway:private-candidate-verify)"
          cleanup() { docker logs "$CONTAINER_ID" || true; docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:18081/health > "$RUNNER_TEMP/local-health.json"; then break; fi
            sleep 1
          done
          jq -e '.ok == true and .productionActionsEnabled == false' "$RUNNER_TEMP/local-health.json" >/dev/null

          WIDGET_CODE="$(curl --silent --output "$RUNNER_TEMP/local-widget.js" --write-out '%{http_code}' http://127.0.0.1:18081/ai-arman/customer/widget.js)"
          test "$WIDGET_CODE" = "200"
          grep -F '/ai-arman/customer/identity/start' "$RUNNER_TEMP/local-widget.js" >/dev/null
          grep -F 'sessionStorage' "$RUNNER_TEMP/local-widget.js" >/dev/null
          if grep -Eqi '\.innerHTML|eval\(|localStorage|window\.customer|customerId' "$RUNNER_TEMP/local-widget.js"; then
            echo 'Unsafe customer widget marker found.' >&2
            exit 1
          fi

      - name: Authenticate deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Snapshot live AI boundary and candidate IAM if present
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n 1)"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

          gcloud run services describe "$LIVE_AI_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/live-before.json"
          jq -S '[.status.traffic[]? | select((.percent // 0) > 0) | {revisionName,percent:(.percent // 0),tag:(.tag // "")} ] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/live-before.json" > "$RUNNER_TEMP/live-traffic-before.json"
          test "$(jq '[.[].percent] | sort == [1,99]' "$RUNNER_TEMP/live-traffic-before.json")" = "true"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/live-before.json")" = "2"

          if gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/existing-gateway.json" 2>/dev/null; then
            EXISTING_RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/existing-gateway.json")"
            test "$EXISTING_RUNTIME" = "$RUNTIME_SERVICE_ACCOUNT"
            gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/existing-gateway-iam.json"
            if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/existing-gateway-iam.json" >/dev/null; then
              echo 'Existing customer gateway candidate is public; refusing deploy.' >&2
              exit 1
            fi
          fi

      - name: Build and push immutable gateway image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME:private-$SHORT_SHA-$GITHUB_RUN_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull -f Dockerfile.ai-arman-customer-gateway --tag "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "immutable_image=$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy private gateway candidate with identity off
        id: deploy
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.immutable_image }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          REVISION_SUFFIX="private-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"

          gcloud run deploy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$IMMUTABLE_IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "$REVISION_SUFFIX" \
            --ingress all \
            --no-allow-unauthenticated \
            --port 8080 \
            --startup-probe "httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,failureThreshold=12,timeoutSeconds=2,periodSeconds=5" \
            --cpu 1 \
            --memory 256Mi \
            --cpu-throttling \
            --no-cpu-boost \
            --min 0 \
            --max 1 \
            --concurrency 10 \
            --timeout 30 \
            --set-env-vars "NODE_ENV=production,AI_ARMAN_CUSTOMER_WIDGET_ENABLED=true,AI_ARMAN_CUSTOMER_IDENTITY_ENABLED=false,AI_ARMAN_CUSTOMER_OTP_EMAIL_ENABLED=false,AI_ARMAN_VENDRE_CUSTOMER_DIRECTORY_ENABLED=false,AI_ARMAN_WIDGET_PREVIEW_ENABLED=false,AI_ARMAN_MODEL_INTERPRETATION_ENABLED=false,AI_ARMAN_MODEL_SHADOW_ENABLED=false,AI_ARMAN_MODEL_PROMOTION_ENABLED=false" \
            --labels "release=customer-gateway-private-candidate,source-sha=$SHORT_SHA,identity=off,public=off" \
            --quiet

          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/gateway.json"
          REVISION="$(jq -r '.status.latestReadyRevisionName // empty' "$RUNNER_TEMP/gateway.json")"
          SERVICE_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/gateway.json")"
          test -n "$REVISION"
          test -n "$SERVICE_URL"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Verify private candidate configuration and unchanged live AI
        shell: bash
        env:
          REVISION: ${{ steps.deploy.outputs.revision }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/gateway-after.json"
          gcloud run revisions describe "$REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/gateway-revision.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/gateway-iam.json"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/gateway-iam.json" >/dev/null; then exit 1; fi

          test "$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/gateway-after.json")" = "$RUNTIME_SERVICE_ACCOUNT"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/gateway-after.json")" = "1"
          test "$(jq -r '.spec.containerConcurrency' "$RUNNER_TEMP/gateway-revision.json")" = "10"
          test "$(jq -r '.spec.containers[0].resources.limits.memory' "$RUNNER_TEMP/gateway-revision.json")" = "256Mi"
          env_value() { jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name == $n) | .value // empty' "$RUNNER_TEMP/gateway-revision.json"; }
          test "$(env_value AI_ARMAN_CUSTOMER_WIDGET_ENABLED)" = "true"
          test "$(env_value AI_ARMAN_CUSTOMER_IDENTITY_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_CUSTOMER_OTP_EMAIL_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_VENDRE_CUSTOMER_DIRECTORY_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_MODEL_INTERPRETATION_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_MODEL_SHADOW_ENABLED)" = "false"
          test "$(env_value AI_ARMAN_MODEL_PROMOTION_ENABLED)" = "false"
          IMAGE_FIELD="$(jq -r '.spec.containers[0].image // empty' "$RUNNER_TEMP/gateway-revision.json")"
          echo "$IMAGE_FIELD" | grep -F "$EXPECTED_DIGEST" >/dev/null

          gcloud run services describe "$LIVE_AI_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/live-after.json"
          jq -S '[.status.traffic[]? | select((.percent // 0) > 0) | {revisionName,percent:(.percent // 0),tag:(.tag // "")} ] | sort_by(.revisionName,.tag)' "$RUNNER_TEMP/live-after.json" > "$RUNNER_TEMP/live-traffic-after.json"
          diff -u "$RUNNER_TEMP/live-traffic-before.json" "$RUNNER_TEMP/live-traffic-after.json"
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/live-after.json")" = "2"

      - name: Mint private gateway ID token
        id: id_token
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Smoke private gateway over Cloud Run
        shell: bash
        env:
          ID_TOKEN: ${{ steps.id_token.outputs.id_token }}
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        run: |
          set -euo pipefail
          test -n "$ID_TOKEN"
          test -n "$SERVICE_URL"
          echo "::add-mask::$ID_TOKEN"

          HEALTH_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/health")"
          test "$HEALTH_CODE" = "200"
          jq -e '.ok == true and .service == "ai-arman-customer-gateway" and .productionActionsEnabled == false' "$RUNNER_TEMP/health.json" >/dev/null

          WIDGET_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/widget.js" --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/ai-arman/customer/widget.js")"
          test "$WIDGET_CODE" = "200"
          grep -F '/ai-arman/customer/identity/start' "$RUNNER_TEMP/widget.js" >/dev/null
          grep -F 'Verifierad kundchatt' "$RUNNER_TEMP/widget.js" >/dev/null

          INTERNAL_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/internal.json" --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/ai-arman/foundation")"
          test "$INTERNAL_CODE" = "404"

          NO_ORIGIN_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --header "Authorization: Bearer $ID_TOKEN" --header 'Content-Type: application/json' --data '{"email":"customer@example.com"}' "$SERVICE_URL/ai-arman/customer/identity/start")"
          test "$NO_ORIGIN_CODE" = "403"

          IDENTITY_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/identity.json" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $ID_TOKEN" --header 'Origin: https://harmoniq.se' --header 'Content-Type: application/json' --data '{"email":"customer@example.com"}' "$SERVICE_URL/ai-arman/customer/identity/start")"
          test "$IDENTITY_CODE" = "201"
          jq -e '.ok == false and .code == "identity_unavailable"' "$RUNNER_TEMP/identity.json" >/dev/null

      - name: Write private candidate checkpoint
        shell: bash
        env:
          REVISION: ${{ steps.deploy.outputs.revision }}
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo '# AI Arman – customer gateway private candidate latest'
            echo
            echo "- Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '- Overall: **PASS**'
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Service: \`$SERVICE_NAME\`"
            echo "- Revision: \`$REVISION\`"
            echo "- Service URL: \`$SERVICE_URL\`"
            echo "- Image digest: \`$DIGEST\`"
            echo '- Public IAM: **absent**'
            echo '- Service max instances: **1**'
            echo '- Customer widget: **ON**'
            echo '- Customer identity: **OFF**'
            echo '- Gmail OTP: **OFF**'
            echo '- Vendre customer directory: **OFF**'
            echo '- Model interpretation/shadow/promotion: **OFF**'
            echo '- Internal AI routes: **404 through gateway boundary**'
            echo '- Harmoniq origin boundary: **PASS**'
            echo '- Existing live AI Arman 99/1 traffic: **unchanged**'
            echo
            echo 'This is a private infrastructure candidate only. No customer email, Vendre lookup, model call, public IAM grant, production action, or live traffic mutation was performed.'
          } > "$RESULT_PATH"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record private customer gateway candidate'
          git push origin HEAD:feature/ai-arman-foundation-v1
