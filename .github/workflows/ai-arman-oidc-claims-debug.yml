name: AI Arman OIDC claims debug

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - ".github/workflows/ai-arman-oidc-claims-debug.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print safe GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq")
          token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | python3 -c 'import sys,base64; s=sys.stdin.read().strip(); s += "="*((4-len(s)%4)%4); print(base64.b64decode(s).decode())')
          printf '%s' "$payload" | python3 -c 'import json,sys; d=json.load(sys.stdin); keys=["repository","repository_owner","repository_id","repository_owner_id","ref","ref_type","actor","event_name","workflow","job_workflow_ref","sub","aud"]; [print(f"{k}={d.get(k)}") for k in keys]'
