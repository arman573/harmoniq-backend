name: AI Arman admin provider diagnostic candidate once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Deploy AI Arman admin provider diagnostic candidate once'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_ID: harmoniq-210513
      REGION: europe-north1
      SERVICE_NAME: harmoniq-ai-arman-beta0
      RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com
      WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
      DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
      ARTIFACT_REPOSITORY: harmoniq-containers
      SECRET_NAME: ai-arman-openai-api-key
      SOURCE_SHA: 17fbaebe9699d69bc9b5cfd3d6841a7e2f866e32
      RESULT_PATH: docs/ai-arman/ADMIN_REPLY_PROVIDER_DIAGNOSTIC_LATEST.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify frozen source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Snapshot boundary
        id: before
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/before.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then exit 1; fi
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/positive-before.json"
          jq -e 'length == 2 and ([.[].percent] | sort) == [1,99]' "$RUNNER_TEMP/positive-before.json" >/dev/null
          test "$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/before.json")" = '2'
          echo "service_url=$(jq -r '.status.url' "$RUNNER_TEMP/before.json")" >> "$GITHUB_OUTPUT"
      - name: Build immutable diagnostic image
        id: image
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME:admin-provider-diag-${SOURCE_SHA:0:12}-$GITHUB_RUN_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull -f Dockerfile.ai-arman-candidate -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Deploy zero traffic diagnostic revision
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          SHORT="${SOURCE_SHA:0:8}"
          TAG="admindiag-${SHORT}-${GITHUB_RUN_NUMBER}"
          APP_TOKEN="$(printf 'candidate:%s' "$SOURCE_SHA" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$APP_TOKEN"; echo "AI_ADMIN_APP_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"
          gcloud run deploy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --platform managed \
            --image "$IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "admindiag-${SHORT}-${GITHUB_RUN_NUMBER}" --tag "$TAG" --no-traffic \
            --port 8080 --cpu 1 --memory 256Mi --cpu-throttling --no-cpu-boost --concurrency 1 --timeout 30 \
            --set-env-vars "NODE_ENV=production,AI_ARMAN_WIDGET_PREVIEW_ENABLED=false,AI_ARMAN_CUSTOMER_WIDGET_ENABLED=false,AI_ARMAN_CUSTOMER_IDENTITY_ENABLED=false,AI_ARMAN_ADMIN_REPLY_DRAFT_ENABLED=true,AI_ARMAN_MODEL_INTERPRETATION_ENABLED=true,AI_ARMAN_MODEL_SHADOW_ENABLED=false,AI_ARMAN_MODEL_PROMOTION_ENABLED=false,AI_ARMAN_OPENAI_MODEL=gpt-5-mini,AI_ARMAN_MODEL_INTERPRETATION_TIMEOUT_MS=10000,AI_ARMAN_MODEL_INPUT_COST_USD_PER_MILLION_TOKENS=0.25,AI_ARMAN_MODEL_OUTPUT_COST_USD_PER_MILLION_TOKENS=2,AI_ARMAN_ADMIN_REPLY_DRAFT_ACCESS_TOKEN=$APP_TOKEN" \
            --set-secrets "OPENAI_API_KEY=$SECRET_NAME:1" \
            --labels "release=admin-provider-diagnostic,source-sha=$SHORT,traffic=zero,promotion=off" --quiet
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/after.json"
          REV="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .revisionName // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          URL="$(jq -r --arg tag "$TAG" '.status.traffic[]? | select(.tag==$tag) | .url // empty' "$RUNNER_TEMP/after.json" | head -n1)"
          test -n "$REV"; test -n "$URL"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"; echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verify live boundary unchanged
        env:
          REV: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/final.json"
          jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/final.json" > "$RUNNER_TEMP/positive-after.json"
          cmp "$RUNNER_TEMP/positive-before.json" "$RUNNER_TEMP/positive-after.json"
          test "$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/final.json")" = '0'
      - id: idtoken
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.before.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Probe safe failure classification
        id: probe
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"caseId":"HQR-SYNTHETIC-PROVIDER-DIAG","caseType":"support","status":"chat_waiting_admin","customerName":"Testkund","messages":[{"direction":"inbound","sender":"Kund","subject":"Leveransfråga","text":"Hej, paketet uppges vara skickat men jag saknar spårningslänk. Kan ni hjälpa mig?","date":"2026-08-19T08:22:00Z"}]}
          JSON
          CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/resp.json" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $ID_TOKEN" --header "X-AI-Arman-Admin-Token: $AI_ADMIN_APP_TOKEN" --header 'Content-Type: application/json' --data @"$RUNNER_TEMP/request.json" "$URL/ai-arman/internal/admin/reply-draft" || true)"
          SAFE="$(jq -c '{ok:(.ok // null),code:(.code // null),providerHttpStatus:(.providerHttpStatus // null),draftType:(.draftText|type),draftLength:(if (.draftText|type)=="string" then (.draftText|length) else 0 end),sendsCustomerMessage:(.sendsCustomerMessage // null),executesWrites:(.executesWrites // null)}' "$RUNNER_TEMP/resp.json" 2>/dev/null || echo '{"parse":"failed"}')"
          echo "http=$CODE" >> "$GITHUB_OUTPUT"; echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
      - name: Record safe provider diagnostic
        env:
          REV: ${{ steps.deploy.outputs.revision }}
          URL: ${{ steps.deploy.outputs.url }}
          HTTP: ${{ steps.probe.outputs.http }}
          SAFE: ${{ steps.probe.outputs.safe }}
        run: |
          set -euo pipefail
          git fetch origin feature/ai-arman-foundation-v1
          git checkout -B result origin/feature/ai-arman-foundation-v1
          cat > "$RESULT_PATH" <<EOF
          # AI Arman admin provider diagnostic

          - Checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Frozen source: \`$SOURCE_SHA\`
          - Candidate revision: \`$REV\`
          - Candidate URL: \`$URL\`
          - Candidate traffic: **0%**
          - Production 99/1: **unchanged**
          - HTTP status: \`$HTTP\`
          - Safe response shape: \`$SAFE\`
          - Draft text content: **not recorded**
          - No production traffic or IAM change performed.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman admin provider diagnostic'
          git push origin HEAD:feature/ai-arman-foundation-v1
