name: Temporary AI Arman OpenAI secret binding preflight

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/tmp-ai-arman-openai-secret-bind.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SECRET_NAME: ai-arman-openai-api-key
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: ai-arman-beta0-runtime@harmoniq-210513.iam.gserviceaccount.com

jobs:
  bind-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate through existing WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify exact secret and bind runtime accessor only
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_ACCOUNT="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)' | head -n 1)"
          test "$ACTIVE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"

          if ! gcloud secrets describe "$SECRET_NAME" \
            --project "$PROJECT_ID" --format=json \
            > "$RUNNER_TEMP/secret.json" 2> "$RUNNER_TEMP/secret-error.txt"; then
            echo "SECRET_DESCRIBE=BLOCKED"
            cat "$RUNNER_TEMP/secret-error.txt" >&2
            exit 1
          fi

          RESOURCE_NAME="$(jq -r '.name // empty' "$RUNNER_TEMP/secret.json")"
          test "$RESOURCE_NAME" = "projects/222024985388/secrets/$SECRET_NAME"
          echo "SECRET_DESCRIBE=PASS"

          if gcloud secrets versions describe 1 \
            --secret "$SECRET_NAME" --project "$PROJECT_ID" --format=json \
            > "$RUNNER_TEMP/version.json" 2> "$RUNNER_TEMP/version-error.txt"; then
            STATE="$(jq -r '.state // empty' "$RUNNER_TEMP/version.json")"
            test "$STATE" = "ENABLED"
            echo "SECRET_VERSION_1_ENABLED=PASS"
          else
            echo "SECRET_VERSION_METADATA=NOT_AUTHORIZED_OR_UNAVAILABLE"
          fi

          MEMBER="serviceAccount:$RUNTIME_SERVICE_ACCOUNT"
          if gcloud secrets get-iam-policy "$SECRET_NAME" \
            --project "$PROJECT_ID" --format=json \
            > "$RUNNER_TEMP/iam-before.json" 2> "$RUNNER_TEMP/iam-before-error.txt"; then
            if jq -e --arg member "$MEMBER" '
              any(.bindings[]?; .role == "roles/secretmanager.secretAccessor" and any(.members[]?; . == $member))
            ' "$RUNNER_TEMP/iam-before.json" >/dev/null; then
              echo "RUNTIME_SECRET_ACCESSOR=ALREADY_PRESENT"
              exit 0
            fi
          else
            echo "SECRET_GET_IAM_POLICY=NOT_AUTHORIZED"
          fi

          if ! gcloud secrets add-iam-policy-binding "$SECRET_NAME" \
            --project "$PROJECT_ID" \
            --member "$MEMBER" \
            --role roles/secretmanager.secretAccessor \
            --quiet \
            > "$RUNNER_TEMP/bind-output.txt" 2> "$RUNNER_TEMP/bind-error.txt"; then
            echo "RUNTIME_SECRET_ACCESSOR_BIND=BLOCKED"
            cat "$RUNNER_TEMP/bind-error.txt" >&2
            exit 2
          fi

          echo "RUNTIME_SECRET_ACCESSOR_BIND=PASS"

          gcloud secrets get-iam-policy "$SECRET_NAME" \
            --project "$PROJECT_ID" --format=json \
            > "$RUNNER_TEMP/iam-after.json"
          jq -e --arg member "$MEMBER" '
            any(.bindings[]?; .role == "roles/secretmanager.secretAccessor" and any(.members[]?; . == $member))
          ' "$RUNNER_TEMP/iam-after.json" >/dev/null
          echo "RUNTIME_SECRET_ACCESSOR_VERIFY=PASS"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AI Arman secret binding preflight"
            echo
            echo "- Target secret: \`$SECRET_NAME\`"
            echo "- Target runtime identity: \`$RUNTIME_SERVICE_ACCOUNT\`"
            echo "- No secret payload was read or printed."
            echo "- No Cloud Run configuration was changed."
          } >> "$GITHUB_STEP_SUMMARY"
