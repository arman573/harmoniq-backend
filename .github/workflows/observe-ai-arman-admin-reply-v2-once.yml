name: Observe AI Arman admin reply v2 once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

jobs:
  observe:
    if: github.event.head_commit.message == 'Observe AI Arman admin reply v2 once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: harmoniq-210513
      REGION: europe-north1
      SERVICE_NAME: harmoniq-ai-arman-beta0
      WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
      DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
      TARGET_SHA8: 8ce9ab5f
      TARGET_FULL_SHA: 8ce9ab5f3c42756eb90d7f7ab2ce4c1d6ef34d49
      RESULT_PATH: docs/ai-arman/ADMIN_REPLY_CANDIDATE_V2_OBSERVE_LATEST.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Inspect candidate
        id: inspect
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          gcloud run revisions list --service "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/revs.json"
          SERVICE_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/service.json")"
          REV="$(jq -r --arg sha "$TARGET_SHA8" '[.[] | select(.metadata.labels.release == "admin-reply-candidate-v2" and .metadata.labels["source-sha"] == $sha)] | sort_by(.metadata.creationTimestamp) | last | .metadata.name // empty' "$RUNNER_TEMP/revs.json")"
          PRIVATE=true
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then PRIVATE=false; fi
          POSITIVE_OK="$(jq -r '[.status.traffic[]? | select((.percent // 0)>0) | .percent] | sort == [1,99]' "$RUNNER_TEMP/service.json")"
          MAX="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service.json")"
          PERCENT=''; URL=''; CONFIG_OK=false
          if [[ -n "$REV" ]]; then
            PERCENT="$(jq -r --arg r "$REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")"
            URL="$(jq -r --arg r "$REV" '.status.traffic[]? | select(.revisionName==$r and (.tag // "") != "") | .url // empty' "$RUNNER_TEMP/service.json" | head -n1)"
            gcloud run revisions describe "$REV" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/rev.json"
            envv(){ jq -r --arg n "$1" '.spec.containers[0].env[]? | select(.name==$n) | .value // empty' "$RUNNER_TEMP/rev.json"; }
            if [[ "$(envv AI_ARMAN_ADMIN_REPLY_DRAFT_ENABLED)" == true && "$(envv AI_ARMAN_MODEL_INTERPRETATION_ENABLED)" == true && "$(envv AI_ARMAN_MODEL_INPUT_COST_USD_PER_MILLION_TOKENS)" == 0.25 && "$(envv AI_ARMAN_MODEL_OUTPUT_COST_USD_PER_MILLION_TOKENS)" == 2 && "$(envv AI_ARMAN_MODEL_PROMOTION_ENABLED)" == false ]]; then CONFIG_OK=true; fi
          fi
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
          echo "private=$PRIVATE" >> "$GITHUB_OUTPUT"
          echo "positive_ok=$POSITIVE_OK" >> "$GITHUB_OUTPUT"
          echo "max=$MAX" >> "$GITHUB_OUTPUT"
          echo "config_ok=$CONFIG_OK" >> "$GITHUB_OUTPUT"
      - name: Mint ID token
        if: steps.inspect.outputs.revision != ''
        id: idtoken
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.inspect.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Probe
        if: steps.inspect.outputs.revision != '' && steps.inspect.outputs.url != ''
        id: probe
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.inspect.outputs.url }}
        run: |
          set -euo pipefail
          APP_TOKEN="$(printf 'candidate:%s' "$TARGET_FULL_SHA" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$APP_TOKEN"; echo "::add-mask::$ID_TOKEN"
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"caseId":"HQR-SYNTHETIC-V2-OBSERVE","caseType":"support","status":"chat_waiting_admin","customerName":"Testkund","messages":[{"direction":"inbound","sender":"Kund","subject":"Leveransfråga","text":"Hej, paketet uppges vara skickat men jag saknar spårningslänk. Kan ni hjälpa mig?","date":"2026-08-19T08:22:00Z"}]}
          JSON
          CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/resp.json" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $ID_TOKEN" --header "X-AI-Arman-Admin-Token: $APP_TOKEN" --header 'Content-Type: application/json' --data @"$RUNNER_TEMP/request.json" "$URL/ai-arman/internal/admin/reply-draft" || true)"
          PROBE=FAIL_HTTP_$CODE
          if [[ "$CODE" =~ ^20[0-9]$ ]] && jq -e '.ok==true and (.draftText|type=="string" and length>0) and .sendsCustomerMessage==false and .executesWrites==false' "$RUNNER_TEMP/resp.json" >/dev/null 2>&1; then PROBE=PASS; fi
          echo "probe=$PROBE" >> "$GITHUB_OUTPUT"
      - name: Record observation
        env:
          REV: ${{ steps.inspect.outputs.revision }}
          URL: ${{ steps.inspect.outputs.url }}
          PERCENT: ${{ steps.inspect.outputs.percent }}
          PRIVATE: ${{ steps.inspect.outputs.private }}
          POSITIVE_OK: ${{ steps.inspect.outputs.positive_ok }}
          MAX: ${{ steps.inspect.outputs.max }}
          CONFIG_OK: ${{ steps.inspect.outputs.config_ok }}
          PROBE: ${{ steps.probe.outputs.probe }}
        run: |
          set -euo pipefail
          OVERALL=FAIL
          if [[ -n "$REV" && "$PERCENT" == 0 && "$PRIVATE" == true && "$POSITIVE_OK" == true && "$MAX" == 2 && "$CONFIG_OK" == true && "$PROBE" == PASS ]]; then OVERALL=PASS; fi
          cat > "$RESULT_PATH" <<EOF
          # AI Arman admin reply v2 observation

          - Observed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Target source: \`$TARGET_FULL_SHA\`
          - Overall: **$OVERALL**
          - Candidate revision: \`${REV:-missing}\`
          - Candidate URL: \`${URL:-missing}\`
          - Candidate traffic: \`${PERCENT:-missing}%\`
          - Private IAM: **$PRIVATE**
          - Production 99/1 unchanged: **$POSITIVE_OK**
          - Max instances: \`$MAX\`
          - Required model pricing configuration: **$CONFIG_OK**
          - Synthetic private draft probe: **${PROBE:-NOT_RUN}**
          - No GCP mutation performed by observer.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman admin reply v2 observation'
          git push origin HEAD:feature/ai-arman-foundation-v1
