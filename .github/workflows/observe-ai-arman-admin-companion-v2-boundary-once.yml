name: Observe AI Arman companion v2 boundary once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE: harmoniq-ai-arman-beta0
  CANDIDATE_REV: harmoniq-ai-arman-beta0-acv2-08c5ef18-1
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RESULT_PATH: docs/ai-arman/ADMIN_COMPANION_V2_BOUNDARY_LATEST.md

jobs:
  observe:
    if: github.event.head_commit.message == 'Observe AI Arman companion v2 boundary once'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Verify read-only production boundary
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"
          POSITIVE="$(jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/service.json")"
          PROD_OK=false
          if jq -e 'length==2 and ([.[].percent] | sort)==[1,99]' <<<"$POSITIVE" >/dev/null; then PROD_OK=true; fi
          MAX="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service.json")"
          PUBLIC=false
          if jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then PUBLIC=true; fi
          CANDIDATE_PERCENT="$(jq -r --arg r "$CANDIDATE_REV" '[.status.traffic[]? | select(.revisionName==$r) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")"
          echo "prod_ok=$PROD_OK" >> "$GITHUB_OUTPUT"
          echo "max=$MAX" >> "$GITHUB_OUTPUT"
          echo "public=$PUBLIC" >> "$GITHUB_OUTPUT"
          echo "candidate_percent=$CANDIDATE_PERCENT" >> "$GITHUB_OUTPUT"
      - name: Record boundary
        env:
          PROD_OK: ${{ steps.verify.outputs.prod_ok }}
          MAX: ${{ steps.verify.outputs.max }}
          PUBLIC: ${{ steps.verify.outputs.public }}
          CANDIDATE_PERCENT: ${{ steps.verify.outputs.candidate_percent }}
        shell: bash
        run: |
          set -euo pipefail
          OVERALL=FAIL
          [[ "$PROD_OK" == true && "$MAX" == 2 && "$PUBLIC" == false && "$CANDIDATE_PERCENT" == 0 ]] && OVERALL=PASS
          cat > "$RESULT_PATH" <<EOF
          # AI Arman companion v2 boundary

          - Checked at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Overall: **$OVERALL**
          - Production 99/1: **$PROD_OK**
          - Service max instances: \`$MAX\`
          - Public IAM: \`$PUBLIC\`
          - Candidate revision: \`$CANDIDATE_REV\`
          - Candidate traffic: \`$CANDIDATE_PERCENT\`
          - No Cloud Run mutation performed.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record AI Arman companion v2 boundary'
          git push origin HEAD:feature/ai-arman-foundation-v1
