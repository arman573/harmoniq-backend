name: Observe compact AI Arman admin companion once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE: harmoniq-ai-arman-beta0
  SOURCE_SHORT: d8142459
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  OBSERVER_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  RESULT_PATH: docs/ai-arman/ADMIN_COMPANION_OBSERVE_LATEST.md

jobs:
  observe:
    if: github.event.head_commit.message == 'Observe compact AI Arman admin companion once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.OBSERVER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Observe candidate only
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"

          PUBLIC=false
          if jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then PUBLIC=true; fi

          POSITIVE="$(jq -cS '[.status.traffic[]? | select((.percent // 0)>0) | {revisionName,percent}] | sort_by(.percent,.revisionName)' "$RUNNER_TEMP/service.json")"
          PROD_OK=false
          if jq -e 'length==2 and ([.[].percent] | sort)==[1,99]' <<<"$POSITIVE" >/dev/null; then PROD_OK=true; fi

          CANDIDATE="$(jq -c --arg p "ac-${SOURCE_SHORT}-" '[.status.traffic[]? | select((.revisionName // "") | startswith($p))] | sort_by(.revisionName) | last // empty' "$RUNNER_TEMP/service.json")"
          if [[ -z "$CANDIDATE" ]]; then
            CANDIDATE_REV=none
            CANDIDATE_URL=none
            CANDIDATE_PERCENT=none
            PAGE_STATUS=not_run
            UI_OK=false
            ASSIST_STATUS=not_run
            ASSIST_OK=false
          else
            CANDIDATE_REV="$(jq -r '.revisionName' <<<"$CANDIDATE")"
            CANDIDATE_URL="$(jq -r '.url' <<<"$CANDIDATE")"
            CANDIDATE_PERCENT="$(jq -r '.percent // 0' <<<"$CANDIDATE")"
            CANONICAL_URL="$(jq -r '.status.url' "$RUNNER_TEMP/service.json")"
            ID_TOKEN="$(gcloud auth print-identity-token --audiences="$CANONICAL_URL")"
            echo "::add-mask::$ID_TOKEN"

            PAGE_STATUS="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/page.html" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" "$CANDIDATE_URL/ai-arman/internal/admin-assistant" || true)"
            UI_OK=false
            if [[ "$PAGE_STATUS" == 200 ]] && grep -F 'width:min(410px' "$RUNNER_TEMP/page.html" >/dev/null && grep -F 'Förstå' "$RUNNER_TEMP/page.html" >/dev/null && grep -F 'Lös' "$RUNNER_TEMP/page.html" >/dev/null && grep -F 'Diskutera' "$RUNNER_TEMP/page.html" >/dev/null && ! grep -F '.innerHTML' "$RUNNER_TEMP/page.html" >/dev/null; then UI_OK=true; fi

            cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"caseId":"HQR-SYNTHETIC","caseType":"support","status":"waiting_admin","messages":[{"direction":"inbound","sender":"Kund","text":"Hej, jag saknar spårningslänk. Hur går det med paketet?"}]}
          JSON
            ASSIST_STATUS="$(curl -sS --max-time 35 -o "$RUNNER_TEMP/assist.json" -w '%{http_code}' -H "Authorization: Bearer $ID_TOKEN" -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/request.json" "$CANDIDATE_URL/ai-arman/internal/admin-assistant/assist" || true)"
            ASSIST_OK=false
            if [[ "$ASSIST_STATUS" =~ ^20[01]$ ]] && jq -e '.ok==true and (.caseSummary|type=="string" and length>0) and (.recommendedActions|type=="array") and (.answerToAdmin|type=="string" and length>0) and .sendsCustomerMessage==false and .executesWrites==false' "$RUNNER_TEMP/assist.json" >/dev/null 2>&1; then ASSIST_OK=true; fi
          fi

          echo "public=$PUBLIC" >> "$GITHUB_OUTPUT"
          echo "prod_ok=$PROD_OK" >> "$GITHUB_OUTPUT"
          echo "candidate_rev=$CANDIDATE_REV" >> "$GITHUB_OUTPUT"
          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "candidate_percent=$CANDIDATE_PERCENT" >> "$GITHUB_OUTPUT"
          echo "page_status=$PAGE_STATUS" >> "$GITHUB_OUTPUT"
          echo "ui_ok=$UI_OK" >> "$GITHUB_OUTPUT"
          echo "assist_status=$ASSIST_STATUS" >> "$GITHUB_OUTPUT"
          echo "assist_ok=$ASSIST_OK" >> "$GITHUB_OUTPUT"

      - name: Record observation
        shell: bash
        env:
          PUBLIC: ${{ steps.observe.outputs.public }}
          PROD_OK: ${{ steps.observe.outputs.prod_ok }}
          CANDIDATE_REV: ${{ steps.observe.outputs.candidate_rev }}
          CANDIDATE_URL: ${{ steps.observe.outputs.candidate_url }}
          CANDIDATE_PERCENT: ${{ steps.observe.outputs.candidate_percent }}
          PAGE_STATUS: ${{ steps.observe.outputs.page_status }}
          UI_OK: ${{ steps.observe.outputs.ui_ok }}
          ASSIST_STATUS: ${{ steps.observe.outputs.assist_status }}
          ASSIST_OK: ${{ steps.observe.outputs.assist_ok }}
        run: |
          set -euo pipefail
          OVERALL=FAIL
          if [[ "$PUBLIC" == false && "$PROD_OK" == true && "$CANDIDATE_PERCENT" == 0 && "$UI_OK" == true && "$ASSIST_OK" == true ]]; then OVERALL=PASS; fi
          cat > "$RESULT_PATH" <<EOF
          # AI Arman compact admin companion observation

          - Observed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Frozen source prefix: \`$SOURCE_SHORT\`
          - Overall: **$OVERALL**
          - Candidate revision: \`$CANDIDATE_REV\`
          - Candidate URL: \`$CANDIDATE_URL\`
          - Candidate traffic: \`$CANDIDATE_PERCENT\`
          - Production 99/1 unchanged: **$PROD_OK**
          - Public IAM present: **$PUBLIC**
          - Companion page HTTP: \`$PAGE_STATUS\`
          - Compact drawer UI markers: **$UI_OK**
          - Synthetic assistant HTTP: \`$ASSIST_STATUS\`
          - Synthetic case understanding: **$ASSIST_OK**
          - Customer message sending: **false**
          - External writes: **false**
          - Learning writes: **disabled in candidate**
          - No external module or Cloud Run configuration mutated by this observer.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Record compact AI Arman admin companion observation'
          git push origin HEAD:feature/ai-arman-foundation-v1
