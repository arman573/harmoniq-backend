name: Inspect AI Arman tool registry GCP access once

on:
  pull_request:
    branches:
      - trigger/ai-arman-tool-preflight-20260820
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  AI_SERVICE: harmoniq-ai-arman-beta0
  TRACKING_SERVICE: harmoniq-customer-tracking-widget
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Inspect services and secret references without reading secret values
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$AI_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai.json"
          gcloud run services describe "$TRACKING_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/tracking.json"
          gcloud run services get-iam-policy "$AI_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/ai-iam.json"
          gcloud run services get-iam-policy "$TRACKING_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/tracking-iam.json"

          AI_RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/ai.json")"
          TRACKING_RUNTIME="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/tracking.json")"
          AI_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/ai.json")"
          TRACKING_URL="$(jq -r '.status.url // empty' "$RUNNER_TEMP/tracking.json")"
          TRACKING_PUBLIC=false
          jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/tracking-iam.json" >/dev/null && TRACKING_PUBLIC=true || true
          AI_PRIVATE=true
          jq -e '[.bindings[]?.members[]?] | any(.=="allUsers" or .=="allAuthenticatedUsers")' "$RUNNER_TEMP/ai-iam.json" >/dev/null && AI_PRIVATE=false || true

          jq -r '.spec.template.spec.containers[0].env[]? | select(.valueFrom.secretKeyRef.name != null) | [.name,.valueFrom.secretKeyRef.name] | @tsv' "$RUNNER_TEMP/tracking.json" > "$RUNNER_TEMP/tracking-secrets.tsv"
          jq -r '.spec.template.spec.containers[0].env[]? | select(.value != null) | [.name,.value] | @tsv' "$RUNNER_TEMP/tracking.json" > "$RUNNER_TEMP/tracking-env.tsv"

          VENDRE_SECRET="$(awk -F '\t' 'tolower($1) ~ /vendre/ && tolower($1) ~ /(key|token|secret)/ {print $2; exit}' "$RUNNER_TEMP/tracking-secrets.tsv")"
          VENDRE_BASE_URL="$(awk -F '\t' 'tolower($1) ~ /vendre/ && tolower($1) ~ /(base|url)/ {print $2; exit}' "$RUNNER_TEMP/tracking-env.tsv")"
          [[ "$VENDRE_BASE_URL" == https://* ]] || VENDRE_BASE_URL=''

          SECRET_ACCESS=unknown
          if [[ -n "$VENDRE_SECRET" && -n "$AI_RUNTIME" ]]; then
            if gcloud secrets get-iam-policy "$VENDRE_SECRET" --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/vendre-secret-iam.json" 2>/dev/null; then
              if jq -e --arg member "serviceAccount:$AI_RUNTIME" '[.bindings[]? | select(.role=="roles/secretmanager.secretAccessor") | .members[]?] | any(.==$member)' "$RUNNER_TEMP/vendre-secret-iam.json" >/dev/null; then SECRET_ACCESS=true; else SECRET_ACCESS=false; fi
            fi
          fi

          echo "AI_RUNTIME=$AI_RUNTIME"
          echo "AI_URL=$AI_URL"
          echo "AI_PRIVATE=$AI_PRIVATE"
          echo "TRACKING_RUNTIME=$TRACKING_RUNTIME"
          echo "TRACKING_URL=$TRACKING_URL"
          echo "TRACKING_PUBLIC=$TRACKING_PUBLIC"
          echo "VENDRE_SECRET_FOUND=$([[ -n "$VENDRE_SECRET" ]] && echo true || echo false)"
          echo "VENDRE_SECRET_NAME=${VENDRE_SECRET:-none}"
          echo "VENDRE_BASE_URL_FOUND=$([[ -n "$VENDRE_BASE_URL" ]] && echo true || echo false)"
          echo "VENDRE_BASE_URL=${VENDRE_BASE_URL:-none}"
          echo "AI_RUNTIME_VENDRE_SECRET_ACCESS=$SECRET_ACCESS"
          echo "SECRET_VALUES_READ=false"
          echo "GCP_MUTATIONS=false"
