name: TEMP AI Arman Artifact Registry verify

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1
    paths:
      - .github/workflows/temp-ai-arman-artifact-verify.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  ARTIFACT_REPOSITORY: harmoniq-containers

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Artifact Registry permissions read-only
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"
          RESOURCE="projects/${PROJECT_ID}/locations/${REGION}/repositories/${ARTIFACT_REPOSITORY}"
          CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/repo.json" \
            --write-out '%{http_code}' \
            --request POST \
            "https://artifactregistry.googleapis.com/v1/${RESOURCE}:testIamPermissions" \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"permissions":["artifactregistry.repositories.downloadArtifacts","artifactregistry.repositories.uploadArtifacts"]}')"
          test "$CODE" = "200"
          jq -e '.permissions | index("artifactregistry.repositories.downloadArtifacts") != null' "$RUNNER_TEMP/repo.json" >/dev/null
          jq -e '.permissions | index("artifactregistry.repositories.uploadArtifacts") != null' "$RUNNER_TEMP/repo.json" >/dev/null
          echo "artifactRegistryWriter=PASS"
          echo "mutationsPerformed=false"
