name: AI Arman internal preview status probe once

on:
  push:
    branches:
      - feature/ai-arman-foundation-v1

permissions:
  contents: write
  id-token: write

concurrency:
  group: ai-arman-internal-preview-status-probe-once
  cancel-in-progress: false

env:
  PROJECT_ID: harmoniq-210513
  REGION: europe-north1
  SERVICE_NAME: harmoniq-ai-arman-beta0
  DEPLOY_SERVICE_ACCOUNT: github-ai-arman-deployer@harmoniq-210513.iam.gserviceaccount.com
  WIF_PROVIDER: projects/222024985388/locations/global/workloadIdentityPools/github-actions/providers/github-harmoniq
  EXPECTED_SOURCE_LABEL: 68ae2e0c
  RESULT_PATH: docs/ai-arman/INTERNAL_PREVIEW_STATUS_PROBE_LATEST.md

jobs:
  probe:
    if: github.event.head_commit.message == 'Probe internal preview candidate status once'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-arman-foundation-v1

      - name: Authenticate push WIF
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read Cloud Run state
        id: cloud
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="$(gcloud run revisions list \
            --service "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --filter="metadata.labels.release=internal-preview-candidate AND metadata.labels.source-sha=$EXPECTED_SOURCE_LABEL" \
            --sort-by='~metadata.creationTimestamp' \
            --limit=1 \
            --format='value(metadata.name)' || true)"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"

          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
          gcloud run services get-iam-policy "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json > "$RUNNER_TEMP/iam.json"

          PUBLIC_IAM=false
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' "$RUNNER_TEMP/iam.json" >/dev/null; then PUBLIC_IAM=true; fi
          POSITIVE_TRAFFIC="$(jq -c '[.status.traffic[]? | select((.percent // 0) > 0) | {revisionName,percent:(.percent // 0)}] | sort_by(.percent)' "$RUNNER_TEMP/service.json")"
          SERVICE_MAX="$(jq -r '.metadata.annotations["run.googleapis.com/maxScale"] // empty' "$RUNNER_TEMP/service.json")"
          CANDIDATE_PERCENT="0"
          if [ -n "$CANDIDATE" ]; then
            CANDIDATE_PERCENT="$(jq -r --arg rev "$CANDIDATE" '[.status.traffic[]? | select(.revisionName == $rev) | (.percent // 0)] | add // 0' "$RUNNER_TEMP/service.json")"
          fi
          echo "public_iam=$PUBLIC_IAM" >> "$GITHUB_OUTPUT"
          echo "positive_traffic=$POSITIVE_TRAFFIC" >> "$GITHUB_OUTPUT"
          echo "service_max=$SERVICE_MAX" >> "$GITHUB_OUTPUT"
          echo "candidate_percent=$CANDIDATE_PERCENT" >> "$GITHUB_OUTPUT"

      - name: Write probe checkpoint
        if: always()
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          CLOUD_OUTCOME: ${{ steps.cloud.outcome }}
          CANDIDATE: ${{ steps.cloud.outputs.candidate }}
          PUBLIC_IAM: ${{ steps.cloud.outputs.public_iam }}
          POSITIVE_TRAFFIC: ${{ steps.cloud.outputs.positive_traffic }}
          SERVICE_MAX: ${{ steps.cloud.outputs.service_max }}
          CANDIDATE_PERCENT: ${{ steps.cloud.outputs.candidate_percent }}
        run: |
          set -euo pipefail
          cat > "$RESULT_PATH" <<EOF
          # AI Arman – internal preview status probe

          - Recorded at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Probe source: \`$GITHUB_SHA\`
          - Push WIF auth outcome: \`${AUTH_OUTCOME:-unknown}\`
          - Cloud Run read outcome: \`${CLOUD_OUTCOME:-skipped}\`
          - Expected candidate source label: \`$EXPECTED_SOURCE_LABEL\`
          - Candidate revision: \`${CANDIDATE:-not-found}\`
          - Candidate traffic percent: \`${CANDIDATE_PERCENT:-unknown}\`
          - Positive traffic snapshot: \`${POSITIVE_TRAFFIC:-unavailable}\`
          - Service max instances: \`${SERVICE_MAX:-unknown}\`
          - Public IAM detected: \`${PUBLIC_IAM:-unknown}\`

          This probe is read-only against GCP. It performs no deploy, traffic update, IAM mutation, secret change, or model call.
          EOF

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_PATH"
          git commit -m 'Record internal preview status probe'
          git push origin HEAD:feature/ai-arman-foundation-v1
